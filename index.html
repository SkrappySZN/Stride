/* ── Zones that set themselves ───────────────────────────────────────
   Every Garmin FIT file carries the watch's lactate-threshold estimate; until
   a run brings one, an age-based estimate stands in. Zones someone set by
   hand are never touched. */
async function autoZones(){
  const p = doc.profile;
  if (p.zonesSet) return false;
  const glt = sortedRuns().reverse().find(r => r.garminLthr)?.garminLthr, age = ageNow();
  const [lthr, src] = glt ? [glt, 'watch'] : age ? [Math.round((208 - .7 * age) * .88), 'age'] : [null, null];
  if (!lthr || (p.zonesAuto === src && p.lthr === lthr)) return false;
  Object.assign(p, { lthr, guardHr:lthr, zones:{ easy:Math.round(lthr * .86), mod:Math.round(lthr * .94) }, zonesAuto:src });
  await rescoreAll();
  return true;
}

/* ═══ WELCOME / CHOOSE A PLAN ════════════════════════════════════════ */
const welcomeUi = { plan:null, start:null, race:null };
// Live preview of a marathon plan from the form, with a straight answer when time is short.
function maraPreview(){
  const r = welcomeUi.race, start = welcomeUi.start;
  if (!r?.date) return '<p class="card-sub" style="margin:0">Pick the race date to see the plan.</p>';
  const weeks = diffDays(weekStart(start), weekStart(r.date)) / 7 + 1;
  if (r.date <= start) return '<div class="note">' + WARN_SVG + '<div><b>That date is before the plan would start.</b></div></div>';
  const ws = marathonWeeks({ ...r }, start), build = ws.filter(w => !w.race && w.phase !== 'Taper');
  const peak = build.length ? Math.max(...build.map(w => w.longMi)) : r.longest;
  const top = Math.max(0, ...ws.filter(w => !w.race).map(w => w.miles));
  let warn = '';
  if (weeks < 4) warn = `<b>${weeks} week${weeks === 1 ? '' : 's'} isn’t enough to build anything safely.</b> Stride can only taper you from where you are. If ${r.longest} mi is your longest run, think hard about the half, or a later race.`;
  else if (peak < 16) warn = `<b>The long run only reaches ${peak} mi before the taper.</b> Most plans want 16–20. You can still finish — with planned walk breaks from the start — but a later race or the half would be kinder to your legs.`;
  return `<div class="mara-sum">
      <div><b class="display num">${ws.length}</b><span>weeks</span></div>
      <div><b class="display num">${peak}</b><span>mi peak long run</span></div>
      <div><b class="display num">${top}</b><span>mi biggest week</span></div>
      <div><b class="display num">${ws.filter(w => w.phase === 'Taper').length + 1}</b><span>weeks of taper</span></div>
    </div>
    <div class="mara-strip">${ws.map(w => `<i style="height:${Math.max(8, w.longMi / 26.2 * 100)}%" class="${w.race ? 'race' : w.phase === 'Taper' ? 'taper' : w.phase === 'Recovery' ? 'cut' : ''}" data-tip="Week ${w.week} · ${esc(w.phase)}<br>${w.race ? 'Race' : w.longMi + ' mi long run'} · ~${w.miles} mi"></i>`).join('')}</div>
    <div class="legend" style="margin:10px 0 0"><span><i style="background:var(--series-1)"></i>Build</span><span><i style="background:var(--series-1);opacity:.45"></i>Easier week</span><span><i style="background:var(--walk)"></i>Taper</span><span><i style="background:var(--accent)"></i>Race</span></div>
    ${warn ? `<div class="note" style="margin-top:14px">${WARN_SVG}<div>${warn}</div></div>` : ''}`;
}

    <button class="card plan-card" data-pick-plan="${id}" aria-pressed="${sel === id}">
      <div class="eyebrow">${id === 'marathon' ? 'Built from your race date · 3–5 runs a week' : pl.weeks.length ? pl.weeks.length + ' weeks · 3 runs a week' : 'No plan'}</div>

function renderWelcome(){

let sdkP, zipP;
const loadSdk = () => sdkP ??= import(FITSDK_URL);
const loadZip = () => zipP ??= import(JSZIP_URL).then(m => m.default);

async function handleFiles(files){
  if (!files.length) return;
  if (location.hash !== '#setup') location.hash = 'setup';
  const jobs = [];
  for (const f of files){
    const lower = f.name.toLowerCase();
    try {
      if (lower.endsWith('.zip')){
        const Zip = await loadZip();
        const z = await Zip.loadAsync(await f.arrayBuffer());
        const fits = Object.values(z.files).filter(e => !e.dir && e.name.toLowerCase().endsWith('.fit'));
        if (!fits.length) importLog.unshift({ status:'crit', title:esc(f.name), sub:'No .fit file inside this zip.' });
        for (const e of fits) jobs.push([`${f.name} › ${e.name.split('/').pop()}`, await e.async('arraybuffer')]);
      } else if (lower.endsWith('.fit')) jobs.push([f.name, await f.arrayBuffer()]);
      else importLog.unshift({ status:'crit', title:esc(f.name), sub:'Not a .fit or .zip file — skipped.' });
    } catch (err){
      importLog.unshift({ status:'crit', title:esc(f.name), sub:`Couldn’t open it: ${esc(err.message)}` });
    }
  }
  for (const [name, buf] of jobs){
    try { importLog.unshift(await importFit(name, buf)); }
    catch (err){ importLog.unshift({ status:'crit', title:esc(name), sub:`Couldn’t read it: ${esc(err.message)}` }); }
  }
  await save();
  if (location.hash === '#setup') $('#log').innerHTML = importLog.map(logItem).join('');
  enrichRuns(); maybeMoment();
}

function matchRoute(r){
  if (!r.startLL || !r.endLL) return null;
  for (const rt of doc.routes){
    if (haversine(r.startLL, rt.start) <= 150 && haversine(r.endLL, rt.end) <= 150 && Math.abs(r.distMi - rt.distMi) / rt.distMi <= 0.2) return rt.id;
  }
  return null;
}
function makeTestRoute(r){
  doc.routes.forEach(x => x.isTest = false);
  const rt = { id:'rt' + Date.now().toString(36), name:'Test route', start:r.startLL, end:r.endLL, distMi:r.distMi, isTest:true, from:r.id };
  doc.routes.push(rt);
  for (const x of doc.runs) if (x.startLL){ x.routeId = matchRoute(x); if (x.testOverride === false && x.id === r.id) x.testOverride = null; }
  r.routeId = rt.id; r.testOverride = null;
}

async function importFit(name, buf){
  const { Decoder, Stream } = await loadSdk();
  const decoder = new Decoder(Stream.fromArrayBuffer(buf));
  if (!decoder.isFIT()) throw new Error('not a FIT file');
  const { messages, errors } = decoder.read({ includeUnknownData:true, mergeHeartRates:true });
  if (!messages.recordMesgs?.length) throw new Error(errors?.[0]?.message ?? 'no activity data (is this a settings file?)');
  const { run, samples } = analyzeFit(messages, doc.profile);
  const title = `${fmtDate(run.date)} · ${fmtMi(run.distMi)} mi`;
  if (!/running|walking|generic/.test(run.sport)) return { status:'wait', title, sub:`A ${esc(run.sport || 'non-running')} activity — skipped.` };
  if (runById(run.id)) return { status:'wait', title, sub:'Already imported — skipped.', runId:run.id };

  // A FIT file for a day that came from the notes replaces that entry.
  const seed = doc.runs.find(x => x.source === 'manual' && Math.abs(diffDays(x.date, run.date)) <= 1 && Math.abs(x.distMi - run.distMi) / run.distMi <= 0.2);
  let sub = `${fmtDur(run.runSec)} jogging · ${fmtDur(run.walkSec)} walking`;
  if (run.jogHr != null) sub += ` · jogging HR ${Math.round(run.jogHr)}`;
  if (seed){
    run.felt = seed.felt || run.felt;
    run.recoveryHr ??= seed.recoveryHr;
    doc.checkins.forEach(c => { if (c.runId === seed.id) c.runId = run.id; });
    doc.runs = doc.runs.filter(x => x !== seed);
    sub += ' · replaced the entry from your notes';
  }
  run.routeId = matchRoute(run);
  run.shoeId = activeShoes().some(sh => sh.id === doc.defaultShoe) ? doc.defaultShoe : null;
  doc.runs.push(run);
  await putSamples(run.id, samples);

  let makeTest = null;
  if (seed?.testOverride && !testRoute() && run.startLL){ makeTestRoute(run); sub += ' · set as your test route'; }
  else if (!testRoute() && run.startLL && (run.gainFt ?? 99) <= 50) makeTest = run.id;
  else if (isTest(run)) sub += ' · test route ✓';
  const fl = flagsFor(run).filter(f => f[0] === 'warn' || f[0] === 'crit');
  return { status: fl.length ? 'warn' : 'good', title, sub: sub + (fl.length ? ` · ${fl.map(f => esc(f[1])).join(', ')}` : ''), runId:run.id, makeTest };
}

/* ── intervals.icu: new runs arrive on their own ──────────────────────
   Garmin (or Coros, Suunto, Wahoo) syncs to intervals.icu, which keeps the
   original FIT file; this pulls new runs' files and feeds them through the
   same importFit as a dropped file. Only the API key lives in the synced doc.
   What's been checked is per-device, so a check never writes to the account
   unless it actually found a run. */
const ICU = 'https://intervals.icu/api/v1';
const ICU_RUNS = ['Run', 'TrailRun', 'VirtualRun'];
const ICUKEY = 'stride.icu';
const icuUi = { status:'idle', msg:'' };
let icuBusy = false;
const icuLocal = () => {
  let s = {}; try { s = JSON.parse(localStorage.getItem(ICUKEY)) || {}; } catch {}
  return s.tail === doc.intervals?.key?.slice(-6) ? s : { tail: doc.intervals?.key?.slice(-6), seen:[] };   // a new key starts over
};
const setIcuLocal = s => { try { localStorage.setItem(ICUKEY, JSON.stringify(s)); } catch {} };
async function icuGet(path, key){
  const r = await fetch(ICU + path, { headers:{ Authorization:'Basic ' + btoa('API_KEY:' + key) } });
  if (r.status === 401 || r.status === 403){ const e = new Error('intervals.icu didn’t accept the API key — paste it again'); e.auth = true; throw e; }
  if (!r.ok) throw new Error('intervals.icu returned ' + r.status);
  return r;
}
// The original file comes back gzipped; Garmin's own exports can be zips.
async function unpackFit(buf){
  const b = new Uint8Array(buf, 0, 2);
  if (b[0] === 0x1f && b[1] === 0x8b) return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  if (b[0] === 0x50 && b[1] === 0x4b){
    const z = await (await loadZip()).loadAsync(buf);
    const f = Object.values(z.files).find(e => !e.dir && /\.fit$/i.test(e.name));
    if (!f) throw new Error('no FIT file in the download');
    return f.async('arraybuffer');
  }
  return buf;
}
function paintIcu(){
  const el = $('#icu-status'); if (!el) return;
  const loc = icuLocal();
  const line = icuUi.status === 'checking' ? 'Checking for new runs…'
    : icuUi.status === 'error' ? icuUi.msg
    : icuUi.msg || (loc.lastChecked ? 'Checked ' + timeAgo(loc.lastChecked) : 'Not checked yet');
  el.className = `sync-line sync-${icuUi.status === 'error' ? 'error' : icuUi.status === 'checking' ? 'busy' : 'ok'}`;
  el.innerHTML = `<span class="dot"></span>${esc(line)}`;
}
async function checkIntervals({ manual = false } = {}){
  const key = doc.intervals?.key;
  if (!key || icuBusy) return;
  const loc = icuLocal();
  if (!manual && loc.lastChecked && Date.now() - Date.parse(loc.lastChecked) < 5 * 60e3) return;
  icuBusy = true; icuUi.status = 'checking'; icuUi.msg = ''; paintIcu();
  let added = 0, problems = 0;
  try {
    // First check reaches back 30 days; after that, a few days before the last check.
    const from = loc.lastChecked ? addDays(ymd(new Date(loc.lastChecked)), -3) : addDays(todayYmd(), -30);
    const list = await (await icuGet(`/athlete/0/activities?oldest=${from}&newest=${addDays(todayYmd(), 1)}`, key)).json();
    const seen = new Set(loc.seen);
    const todo = list.filter(a => ICU_RUNS.includes(a.type) && !seen.has(a.id))
      .sort((a, b) => a.start_date_local < b.start_date_local ? -1 : 1);
    for (const a of todo){
      const title = `${esc(a.name || 'Run')} · ${a.start_date_local ? fmtDate(a.start_date_local.slice(0, 10)) : ''}`;
      let it;
      try {
        if (a.source === 'STRAVA') it = { status:'wait', title, sub:'Came in through Strava, which doesn’t share the original file. Connect Garmin to intervals.icu directly.' };
        else if (a.file_type && a.file_type !== 'fit') it = { status:'wait', title, sub:`A ${esc(a.file_type)} file, not FIT — skipped.` };
        else {
          it = await importFit(title, await unpackFit(await (await icuGet(`/activity/${a.id}/file`, key)).arrayBuffer()));
          if (it.status === 'good' || it.status === 'warn') added++;
        }
        seen.add(a.id);
      } catch (err){
        if (err.auth) throw err;
        problems++;   // not marked seen, so the next check retries it
        it = { status:'crit', title, sub:`Couldn’t import it: ${esc(err.message)}` };
      }
      if (!/Already imported/.test(it.sub)) importLog.unshift({ ...it, sub:'From intervals.icu · ' + it.sub });
    }
    // Daily body data Garmin sends to intervals.icu: weight, resting HR, HRV, sleep, VO2 max.
    let bodyChanged = false;
    try {
      const wFrom = loc.wellnessAt ? addDays(ymd(new Date(loc.wellnessAt)), -3) : addDays(todayYmd(), -180);
      const wl = await (await icuGet(`/athlete/0/wellness?oldest=${wFrom}&newest=${todayYmd()}`, key)).json();
      doc.body ??= {};
      for (const w of wl){
        const rec = {
          weight: w.weight ? Math.round(w.weight * 2.20462 * 10) / 10 : null,   // the API is metric
          rhr: w.restingHR ?? null, hrv: w.hrv != null ? Math.round(w.hrv) : null,
          sleepH: w.sleepSecs ? Math.round(w.sleepSecs / 360) / 10 : null, sleepScore: w.sleepScore ?? null,
          vo2: w.vo2max ?? null, bodyFat: w.bodyFat ?? null,
        };
        for (const k of Object.keys(rec)) if (rec[k] == null) delete rec[k];
        if (!w.id || !Object.keys(rec).length) continue;
        if (stableStringify(doc.body[w.id] ?? {}) !== stableStringify(rec)){ doc.body[w.id] = rec; bodyChanged = true; }
      }
      loc.wellnessAt = new Date().toISOString();
    } catch (err){ if (err.auth) throw err; }
    setIcuLocal({ ...loc, seen:[...seen].slice(-500), lastChecked:new Date().toISOString() });
    icuUi.status = 'idle';
    icuUi.msg = added ? `${added} new run${added > 1 ? 's' : ''} just now` : problems ? `${problems} couldn’t be imported — see the log` : '';
    if (added){ await save(); toast(`${added} new run${added > 1 ? 's' : ''} from intervals.icu`); render(); enrichRuns(); crewPush().catch(() => {}); maybeMoment(); }
    else if (bodyChanged){ await save(); if (['', '#today', '#body'].includes(location.hash)) render(); }
    else if (manual) toast(problems ? 'Some runs couldn’t be imported' : 'No new runs');
  } catch (err){
    icuUi.status = 'error'; icuUi.msg = err.message;
    if (manual || err.auth) toast(err.message);
  } finally {
    icuBusy = false; paintIcu();
    if (location.hash.startsWith('#setup') && importLog.length) $('#log') && ($('#log').innerHTML = importLog.map(logItem).join(''));
  }
}

/* ── Fill-ins for fields added after a run was imported ───────────────
   Best efforts come from the stored samples; temperature from Open-Meteo's
   hourly history (free, no key) at the start point rounded to ~1 km, so the
   exact route never leaves the browser. Runs after sync, so a second device
   picks up the first one's results instead of redoing them. */
async function fetchTemp(r){
  const [lat, lon] = r.startLL.map(v => v.toFixed(2));
  const mid = new Date(Date.parse(r.start) + (r.timerSec ?? 0) * 500);
  const d0 = mid.toISOString().slice(0, 10);
  // The archive lags a few days; the forecast API covers the recent past.
  const api = diffDays(d0, todayYmd()) > 60 ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
  const res = await fetch(`${api}?latitude=${lat}&longitude=${lon}&hourly=temperature_2m&temperature_unit=fahrenheit&timezone=GMT&start_date=${d0}&end_date=${addDays(d0, 1)}`);
  if (!res.ok) throw new Error('weather ' + res.status);
  const t = (await res.json()).hourly?.temperature_2m ?? [];
  const h = mid.getUTCHours() + mid.getUTCMinutes() / 60, a = t[Math.floor(h)], b = t[Math.floor(h) + 1];
  if (a == null) return null;
  return Math.round(b == null ? a : a + (b - a) * (h % 1));
}
let enriching = false;
async function enrichRuns(){
  if (enriching) return;
  enriching = true;
  let changed = false, weatherOk = true;
  try {
    for (const r of doc.runs){
      if (r.best === undefined && r.hasSamples){
        const s = await getSamples(r.id);
        if (s){ r.best = bestEfforts(s); changed = true; }
      }
      // undefined = never tried; null = the weather service had nothing for it.
      if (weatherOk && r.tempF === undefined && r.startLL && !isTreadmill(r)){
        try { r.tempF = await fetchTemp(r); r.tempSrc = 'weather'; changed = true; }
        catch { weatherOk = false; }   // offline or blocked: try again next open
      }
    }
    if (await autoZones()) changed = true;
  } finally { enriching = false; }
  if (!changed) return;
  await save();
  if (!document.activeElement?.matches('input, textarea, select') && !location.hash.startsWith('#setup')) render();
}

async function exportBackup(){
  const samples = {};
  for (const r of doc.runs) if (r.hasSamples){ const s = await getSamples(r.id); if (s) samples[r.id] = s; }
  const blob = new Blob([JSON.stringify({ app:'stride', exported:new Date().toISOString(), doc:(({ intervals, ...d }) => d)(blobOf()), samples })], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `stride-backup-${todayYmd()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importBackup(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'stride' || !data.doc?.runs) throw new Error('not a Stride backup');
    const { sync, intervals } = doc;
    doc = normalize(data.doc);
    if (sync) doc.sync = sync;
    if (intervals) doc.intervals = intervals;
    await idb.clear('samples').catch(() => {});
    memSamples.clear();
    for (const [id, s] of Object.entries(data.samples ?? {})) await putSamples(id, s);
    await save(); toast(`Restored ${doc.runs.length} runs`); render();
  } catch (err){ toast('Couldn’t import: ' + err.message); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && momentOpen){ closeMoment(); return; }
  if (e.key === 'Enter' && e.target.id === 'si-email' && authUi.mode === 'code'){ sendLink(); return; }
  if (e.key === 'Enter' && e.target.id === 'si-code'){ verifyCode(); return; }
  if (e.key === 'Enter' && e.target.id === 'icu-key'){ connectIntervals(); return; }
  if (e.key === 'Enter' && e.target.matches('tr[data-run]')) location.hash = 'runs/' + e.target.dataset.run;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pain-zone]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles:true })); return; }
  if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey) return;
  const pages = { 1:'today', 2:'progress', 3:'runs', 4:'body', 5:'lift', 6:'plan', 7:'setup' };
  if (pages[e.key]) location.hash = pages[e.key];
});

  if (page === 'upload') page = 'setup';   // older links
  if (page === 'body' && arg === 'lifting') page = 'lift';   // older links
  let pg = ['today', 'progress', 'runs', 'body', 'lift', 'plan', 'setup', 'welcome', 'routine', 'intake'].includes(page) ? page : 'today';
  // Leaving the player mid-routine pauses it rather than letting it run on unseen.
  if (pg !== 'routine') pauseRoutine(true);
  // No plan chosen yet: everything but Setup (where you can sign in) waits on the welcome screen.
  // No plan yet: the intake, unless they've chosen to pick a plan by hand. Lifting works without one.
  if (!doc.planId && !['setup', 'routine', 'welcome', 'intake', 'lift'].includes(pg)) pg = 'intake';
  document.querySelectorAll('.tab[data-page]').forEach(b => b.dataset.page === pg ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + pg));
  tip.classList.remove('show');
  if (pg === 'welcome') renderWelcome();
  if (pg === 'today') renderToday();
  if (pg === 'progress') renderProgress();
  if (pg === 'runs'){ $('#page-runs').dataset.run = ''; arg ? renderRunDetail(arg) : renderRunsList(); }
  if (pg === 'body'){ renderBody(); if (arg === 'pain') setTimeout(() => $('#pain-map')?.scrollIntoView({ block:'start' }), 50); }
  if (pg === 'lift') renderLift();
  if (pg === 'plan') renderPlan();
  if (pg === 'setup') renderSetup();
  if (pg === 'routine') renderRoutine(arg);
  if (pg === 'intake') renderIntake();
}
/* ── Arrival motion ──────────────────────────────────────────────────
   Played when you land on a page, never on the re-renders that sync and
   imports trigger, so numbers don't keep re-counting under you. */
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let enterTimer;
function arrive(){
  const page = $('.page.active'); if (!page || calm()) return;
  page.classList.remove('entering'); void page.offsetWidth; page.classList.add('entering');
  clearTimeout(enterTimer); enterTimer = setTimeout(() => page.classList.remove('entering'), 1400);
  // Charts and some pages draw a beat after render, so let them land first.
  setTimeout(() => {
    // Headline numbers count up from zero, keeping their decimals.
    page.querySelectorAll('.bstat-v, .k-val, .ms-v, .next-run-big').forEach(el => {
      const t = [...el.childNodes].find(n => n.nodeType === 3 && /\d/.test(n.textContent)); if (!t) return;
      const m = t.textContent.match(/^(\s*)(\d+(?:\.\d+)?)(.*)$/s); if (!m) return;
      const end = +m[2], dec = (m[2].split('.')[1] ?? '').length, t0 = performance.now();
      if (!end) return;
      const step = now => {
        const k = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        t.textContent = m[1] + (end * e).toFixed(dec) + m[3];
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
    // Lines trace themselves in.
    page.querySelectorAll('.chart path[stroke-width="2"][fill="none"], .journey .route-line').forEach(p => {
      const L = p.getTotalLength?.(); if (!L) return;
      p.animate([{ strokeDasharray:`${L} ${L}`, strokeDashoffset:L }, { strokeDasharray:`${L} ${L}`, strokeDashoffset:0 }], { duration:1100, easing:'cubic-bezier(.3,.6,.2,1)' });
    });
  }, 40);
}
// The header photo drifts a little slower than the page.
let parallaxRaf = 0;
addEventListener('scroll', () => {
  if (calm() || parallaxRaf) return;
  parallaxRaf = requestAnimationFrame(() => {
    parallaxRaf = 0;
    const bg = $('.page.active .band-bg'); if (bg) bg.style.transform = `translateY(${Math.min(scrollY, 400) * 0.35}px)`;
  });
}, { passive:true });

let lastRoute = null;
addEventListener('hashchange', () => { render(); if (location.hash !== lastRoute){ scrollTo(0, 0); arrive(); } lastRoute = location.hash; });
let rt, lastW = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === lastW) return; lastW = innerWidth;
  clearTimeout(rt); rt = setTimeout(() => { if (!/setup/.test(location.hash)) render(); }, 120);
});

/* ── Boot ────────────────────────────────────────────────────────── */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const fromLink = syncOn() ? consumeAuthHash() : null;
if (syncOn()) loadSession();
try { doc = await idb.get('doc', 'main'); }
catch { storageOk = false; }
doc = doc ? normalize(doc) : freshDoc();
await saveLocal();
if (!storageOk) toast('Storage is blocked here — changes won’t survive a reload');
lastRoute = location.hash;
render();
arrive();
paintSync();
syncInit(fromLink).finally(() => checkIntervals().finally(() => { enrichRuns(); crewPush().catch(() => {}); maybeMoment(); }));
</script>
</body>
</html>
