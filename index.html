/* ═══ THE JOURNEY: every run a waypoint on one road ═══════════════════
   Left to right from the first run (or the plan's start) to the end of the
   plan; the road ahead is dashed. Chapters are the plan's phases, or
   months when there's no plan. */
function journeyChapters(start, horizon){
  if (!coached()){
    const out = [];
    for (let d = start.slice(0, 8) + '01'; d <= horizon; ){
      const dt = parseYmd(d), next = ymd(new Date(dt.getFullYear(), dt.getMonth() + 1, 1));
      out.push({ start:d < start ? start : d, end:addDays(next, -1) > horizon ? horizon : addDays(next, -1), label:MON_LONG[dt.getMonth()].toUpperCase() });
      d = next;
    }
    return out;
  }
  const weeks = planState(), cur = weeks.at(-1), out = [];
  const push = (ws, pw) => {
    const ph = planWeekObj(pw)?.phase ?? '', last = out.at(-1);
    if (last && last.phase === ph) last.end = addDays(ws, 6); else out.push({ phase:ph, start:ws, end:addDays(ws, 6) });
  };
  weeks.forEach(w => push(w.start, w.planWeek));
  // The road ahead, if every week from here moves up.
  for (let pw = cur.planWeek, ws = cur.start; pw < planLen(); ){ pw++; ws = addDays(ws, 7); push(ws, pw); }
  out.forEach((c, i) => { c.label = `CH.${i + 1} ${c.phase.toUpperCase()}`; c.n = i + 1; });
  return out;
}
// What the flag at the end of the road stands for (plain text: it's set with textContent).
function journeyFinish(){
  if (isMarathon()) return `Race day · ${doc.race?.name || 'marathon'}`;
  if (coached()) return activePlan().goal ? `Finish · ${activePlan().goal}` : 'Finish';
  const g = (doc.goals ?? []).find(g => !goalState(g).hit);
  if (g) return `Goal · ${GOAL_TYPES[g.type].fmt(g.target)}`;
  const nx = nextMilestones(milestones())[0];
  return nx ? `Next · ${nx[0]}` : 'Keep going';
}
function journeySpan(){
  const runs = sortedRuns(), today = todayYmd();
  const start = [runs[0]?.date, coached() ? doc.planStart : null, today].filter(Boolean).sort()[0];
  let chapters = journeyChapters(start, addDays(today, 21));
  const horizon = coached() ? chapters.at(-1).end : addDays(today, 21);
  if (!coached()) chapters = journeyChapters(start, horizon);
  return { start, horizon, chapters, today };
}
function journeyCard(id){
  const runs = sortedRuns(), { start, chapters, today } = journeySpan();
  const ch = chapters.find(c => c.start <= today && today <= c.end);
  const day = diffDays(start, today) + 1, mi = runs.reduce((a, r) => a + (r.distMi ?? 0), 0);
  return `<div class="card journey"><div class="card-head"><h2>The journey${infoBtn}</h2><span class="card-sub">day ${day} · ${runs.length} runs · ${mi.toFixed(1)} mi</span></div>
    ${explain('journey')}
    <div class="chart journey-map" id="${id}"></div>
    ${ch && coached() ? `<div class="journey-foot"><span class="j-ch">Chapter ${ch.n}</span> <b>${esc(ch.phase)}</b> <span class="card-sub">${esc(planWeekObj(planState().at(-1).planWeek)?.session ?? '')}</span></div>` : ''}
  </div>`;
}
function drawJourney(host){
  if (!host) return;
  const runs = sortedRuns(), { start, horizon, chapters, today } = journeySpan();
  const narrow = host.clientWidth < 560, H = narrow ? 230 : 260, m = { l:22, r:narrow ? 26 : 34, t:34, b:30 };
  const [svg, W] = svgFor(host, H);
  const span = Math.max(14, diffDays(start, horizon) + 1);
  const X = d => m.l + diffDays(start, d) / span * (W - m.l - m.r);
  const mid = H * .56, amp = H * .17, turns = narrow ? 1.6 : 2.3;
  const Y = x => mid + amp * Math.sin((x - m.l) / (W - m.l - m.r) * Math.PI * turns + .5);
  const lit = css('--fig-hl'), quiet = css('--axis'), ink = css('--ink'), muted = css('--muted');
  // Chapters: alternating faint bands, the current one named in volt.
  chapters.forEach((c, i) => {
    const x0 = X(c.start), x1 = X(addDays(c.end, 1)), now = c.start <= today && today <= c.end;
    if (i % 2) el('rect', { x:x0, y:m.t - 18, width:Math.max(0, x1 - x0), height:H - m.t - m.b + 30, fill:ink, 'fill-opacity':.025 }, svg);
    el('line', { x1:x0, x2:x0, y1:m.t - 18, y2:H - m.b + 12, stroke:css('--line'), 'stroke-dasharray':'2 4' }, svg);
    if (x1 - x0 > (narrow ? 46 : 64)) el('text', { x:x0 + 8, y:m.t - 4, class:'j-label' + (now ? ' now' : '') }, svg).textContent = narrow ? c.label.replace(/^(CH\.\d+).*/, '$1') : c.label;
  });
  // The road: travelled solid and lit, ahead dashed.
  const tx = Math.min(X(today), W - m.r), pts = (a, b) => { const p = []; for (let x = a; x <= b; x += 3) p.push(`${x.toFixed(1)},${Y(x).toFixed(1)}`); p.push(`${b.toFixed(1)},${Y(b).toFixed(1)}`); return 'M' + p.join('L'); };
  el('path', { d:pts(m.l, W - m.r), fill:'none', stroke:quiet, 'stroke-width':1.8, 'stroke-dasharray':'3 6', 'stroke-linecap':'round' }, svg);
  el('path', { d:pts(m.l, tx), fill:'none', stroke:lit, 'stroke-width':3.5, 'stroke-linecap':'round', class:'route-line' }, svg);
  // Milestones as checkpoints; the latest few get a flag line and their name.
  const ms = milestones().sort((a, b) => a.date < b.date ? -1 : 1), named = narrow ? [] : ms.slice(-3);
  // Named checkpoints get a row each above the road, the lowest row that doesn't collide.
  const rows = [];
  const labelRow = (x0, x1) => { let i = 0; while ((rows[i] ?? []).some(([a, b]) => x0 < b + 10 && x1 > a - 10)) i++; (rows[i] ??= []).push([x0, x1]); return i; };
  ms.forEach(c => {
    const x = X(c.date), y = Y(x);
    el('path', { d:`M${x} ${y - 9}l6 6l-6 6l-6 -6z`, fill:css('--surface'), stroke:lit, 'stroke-width':1.6 }, svg);
    if (named.includes(c)){
      const w = c.label.length * 6.4, right = x > W * .7, x0 = right ? x - 4 - w : x + 4;
      const ty = m.t + 14 + labelRow(x0, x0 + w) * 14;
      el('line', { x1:x, x2:x, y1:y - 10, y2:ty + 3, stroke:lit, 'stroke-opacity':.45 }, svg);
      el('text', { x:right ? x - 4 : x + 4, y:ty, class:'j-ms', 'text-anchor':right ? 'end' : 'start' }, svg).textContent = c.label;
    }
    tipOn(el('circle', { cx:x, cy:y - 3, r:10, fill:'transparent' }, svg), `<b>Checkpoint</b><br>${esc(c.label)} · ${fmtDate(c.date)}`);
  });
  // Every run, sized by distance.
  const perDay = {};
  runs.forEach(r => {
    const k = perDay[r.date] = (perDay[r.date] ?? 0) + 1, x = X(r.date) + (k - 1) * 5, y = Y(x);
    const rad = 3 + Math.min(5, (r.distMi ?? 0) * 1.6), tread = isTreadmill(r);
    el('circle', { cx:x, cy:y, r:rad, fill:tread ? css('--surface') : isClean(r) ? lit : ink, stroke:tread ? css('--series-1') : css('--surface'), 'stroke-width':tread ? 2 : 1.5, class:'j-run' }, svg);
    const hit = el('circle', { cx:x, cy:y, r:Math.max(10, rad + 4), fill:'transparent', style:'cursor:pointer', 'data-goto':'runs/' + r.id }, svg);
    tipOn(hit, `<b>${fmtDate(r.date)}</b><br>${fmtMi(r.distMi)} mi · ${fmtDur(r.timerSec)} · HR ${r.jogHr != null ? Math.round(r.jogHr) : num(r.avgHr)}${tread ? ' · treadmill' : isClean(r) ? ' · test route' : ''}`);
  });
  // You are here.
  const ty = Y(tx);
  el('circle', { cx:tx, cy:ty, r:9, fill:lit, 'fill-opacity':.25, class:'j-pulse' }, svg);
  el('circle', { cx:tx, cy:ty, r:5.5, fill:lit, stroke:css('--surface'), 'stroke-width':2 }, svg);
  el('text', { x:tx, y:ty + 26, 'text-anchor':'middle', class:'j-you' }, svg).textContent = 'YOU';
  // The flag at the end of the road.
  const fx = W - m.r, fy = Y(fx);
  el('path', { d:`M${fx} ${fy}V${fy - 30}l14 5l-14 5`, fill:'none', stroke:ink, 'stroke-width':1.6, 'stroke-linejoin':'round' }, svg);
  el('path', { d:`M${fx} ${fy - 30}l14 5l-14 5z`, fill:lit }, svg);
  // The finish words get whatever room the start label leaves, cut short if need be.
  const startTxt = `START · ${fmtDate(start).slice(4).toUpperCase()}`, room = Math.floor((W - m.l - m.r - startTxt.length * 6.2 - 20) / 6.4);
  const fin = journeyFinish();
  el('text', { x:fx + 6, y:H - 8, 'text-anchor':'end', class:'j-finish' }, svg).textContent = fin.length > room ? fin.slice(0, Math.max(4, room - 1)).trimEnd() + '…' : fin;
  el('text', { x:m.l, y:H - 8, class:'j-label' }, svg).textContent = startTxt;
}

/* ═══ MOMENTS: full-screen scenes for the things worth stopping for ════
   A run arriving, a checkpoint passed, a week finished. Each shows once
   per device; the first time Stride opens on a device it only notes where
   you are, so an old backlog never floods in. */
let momentOpen = false;
function showMoment(kind, html, after){
  const box = $('#moment');
  box.className = 'moment ' + kind;
  box.innerHTML = `<div class="moment-in" role="dialog" aria-modal="true">${html}</div>`;
  box.hidden = false; momentOpen = true;
  document.body.classList.add('moment-on');
  requestAnimationFrame(() => box.classList.add('show'));
  // Count the big numbers up and trace any route, same as arriving on a page.
  if (!calm()) setTimeout(() => {
    box.querySelectorAll('.m-count').forEach(el => {
      const end = +el.dataset.v, dec = +(el.dataset.dec ?? 0), t0 = performance.now();
      const step = now => { const k = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - k, 3); el.textContent = (end * e).toFixed(dec); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }, 250);
  box.querySelector('[data-moment-close]')?.focus();
  box._after = after;
}
function closeMoment(){
  const box = $('#moment'); if (box.hidden) return;
  box.classList.remove('show'); momentOpen = false;
  document.body.classList.remove('moment-on');
  setTimeout(() => { box.hidden = true; box.innerHTML = ''; const f = box._after; box._after = null; f?.(); setTimeout(maybeMoment, 400); }, 260);
}
const mCount = (v, dec = 0) => `<span class="m-count" data-v="${v}" data-dec="${dec}">${calm() ? Number(v).toFixed(dec) : (0).toFixed(dec)}</span>`;

// Arrival: what this run changed, not just what it was.
async function arrivalMoment(r){
  const runs = sortedRuns(), prior = runs.filter(x => x.start < r.start);
  const lines = [];
  const firstClean = runs.find(isClean);
  if (isClean(r) && firstClean && firstClean !== r){
    const d = Math.round(hrMetric(r) - hrMetric(firstClean));
    lines.push(d < 0 ? `<b>${-d} bpm lower</b> than your first test-route run — same route, less heart.` : d > 0 ? `${d} bpm higher than your first test-route run${r.tempF >= HOT_F ? ` — it was ${r.tempF}°F, heat adds beats` : ''}.` : 'Same heart rate as your first test-route run.');
  }
  if (isTreadmill(r)) lines.push('Treadmill run — counted, but kept out of your street heart-rate trend.');
  if (prior.length && r.distMi > Math.max(...prior.map(x => x.distMi ?? 0)) + .02) lines.push('<b>Your longest run yet.</b>');
  if (r.recoveryHr != null && prior.some(x => x.recoveryHr != null) && r.recoveryHr > Math.max(...prior.filter(x => x.recoveryHr != null).map(x => x.recoveryHr))) lines.push(`<b>Best recovery yet</b> — HR dropped ${r.recoveryHr} in 2 minutes.`);
  if (r.anaerobicTE > 1) lines.push('That one got hard (hard-effort score above 1). Keep the next one easy.');
  const ms = milestones().filter(x => x.date === r.date);
  const s = r.hasSamples ? await getSamples(r.id).catch(() => null) : null;
  showMoment('arrival', `
    <button class="moment-x" data-moment-close aria-label="Close">✕</button>
    <div class="m-eyebrow">New run · ${fmtDateLong(r.date)}${r.source === 'fit' ? ' · ' + fmtTime(r.start) : ''}</div>
    <div class="m-hero display"><span class="m-big">${mCount(r.distMi ?? 0, 2)}</span><span class="m-unit">mi</span></div>
    <div class="m-stats">
      <div><span>Time</span><b>${fmtDur(r.timerSec)}</b></div>
      <div><span>Pace</span><b>${fmtDur(r.avgPaceSec)}<small>/mi</small></b></div>
      <div><span>${r.jogHr != null ? 'Jog HR' : 'Avg HR'}</span><b>${r.jogHr != null ? Math.round(r.jogHr) : num(r.avgHr)}</b></div>
      ${r.recoveryHr != null ? `<div><span>Recovery</span><b>−${r.recoveryHr}</b></div>` : ''}
    </div>
    ${s?.path?.length > 1 && !isTreadmill(r) ? `<div class="m-route">${routeSvg(s.path)}</div>` : ''}
    ${lines.length ? `<ul class="m-lines">${lines.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}
    ${ms.length ? `<div class="m-checkpoints">${ms.map(x => `<div class="m-cp"><i></i><span>Checkpoint reached</span><b>${esc(x.label)}</b></div>`).join('')}</div>` : ''}
    <div class="m-actions">
      <a class="btn primary big" href="#runs/${r.id}" data-moment-close>Open the run</a>
      ${r.date === todayYmd() ? '<a class="btn big" href="#routine/post" data-moment-close>Cool down</a>' : ''}
      <button class="btn big" data-moment-close>Done</button>
    </div>`);
  // Seen milestones don't get their own card too.
  if (ms.length) prefs.set('seenMilestones', [...prefs.get('seenMilestones', []), ...ms.map(x => x.id)].slice(-200));
}

// Week complete: the week as a poster, and what it means for the plan.
function weekMoment(ws){
  const R = recap(ws), we = addDays(ws, 6), thisWk = weekStart(todayYmd());
  // Shown Monday/Tuesday it's last week's, so say so, and show where this week stands.
  const lastWeek = ws < thisWk, now = recap(thisWk);
  let chapter = '', verdict = '';
  if (coached()){
    const w = planState().find(x => x.start === ws);
    if (w){
      const ph = planWeekObj(w.planWeek)?.phase, chs = journeySpan().chapters, ch = chs.find(c => c.start <= ws && ws <= c.end);
      chapter = `${ch ? `Chapter ${ch.n} · ` : ''}${esc(ph ?? '')} · week ${w.planWeek}`;
      verdict = isMarathon() ? '' : w.decision === 'advance' || (!w.decision && w.gate.auto === 'advance') ? `<b>Moving up to week ${Math.min(planLen(), w.planWeek + 1)}.</b> The week did its job.`
        : `<b>Repeating week ${w.planWeek}.</b> That’s the plan working, not failing: same week again, then up.`;
    }
  }
  showMoment('week', `
    <button class="moment-x" data-moment-close aria-label="Close">✕</button>
    <div class="m-eyebrow">${lastWeek ? 'Last week' : 'This week'} · ${fmtDate(ws).slice(4)} – ${fmtDate(we).slice(4)}</div>
    ${chapter ? `<div class="m-chapter">${chapter}</div>` : ''}
    <h2 class="m-head display">${esc(R.headline.replace(/[.—\s]+$/, ''))}</h2>
    <div class="m-grid">
      <div><b class="display">${mCount(R.runs.length)}</b><span>runs</span></div>
      <div><b class="display">${mCount(R.mi, 1)}</b><span>miles</span></div>
      <div><b class="display">${mCount(Math.round(R.min))}</b><span>minutes</span></div>
      <div><b class="display">${R.longest ? mCount(R.longest, 2) : '—'}</b><span>longest</span></div>
    </div>
    ${verdict ? `<p class="m-verdict">${verdict}</p>` : ''}
    ${lastWeek && now.runs.length ? `<p class="m-verdict m-now">This week so far: <b>${now.runs.length} run${now.runs.length > 1 ? 's' : ''} · ${now.mi.toFixed(1)} mi</b></p>` : ''}
    ${R.ms.length ? `<div class="m-checkpoints">${R.ms.map(x => `<div class="m-cp"><i></i><span>Checkpoint</span><b>${esc(x.label)}</b></div>`).join('')}</div>` : ''}
    <div class="m-actions">
      <button class="btn primary big" data-share-recap="${ws}">Share the week</button>
      <button class="btn big" data-moment-close>On to the next one</button>
    </div>`);
}

// Which moment, if any, is due. Called after boot, sync and imports.
function maybeMoment(){
  if (momentOpen || !doc.planId || location.hash.startsWith('#routine')) return;
  const runs = sortedRuns(), last = runs.at(-1);
  if (last){
    const seen = prefs.get('arrivalSeen', null);
    if (seen == null){ prefs.set('arrivalSeen', last.start); }
    else if (last.start > seen && diffDays(last.date, todayYmd()) <= 3){ prefs.set('arrivalSeen', last.start); arrivalMoment(last); return; }
  }
  // Sunday evening shows this week; Monday and Tuesday show last week.
  const now = new Date(), dow = now.getDay(), ws = dow === 0 && now.getHours() >= 17 ? weekStart(todayYmd()) : dow === 1 || dow === 2 ? addDays(weekStart(todayYmd()), -7) : null;
  if (ws && prefs.get('weekSeen', null) !== ws && recap(ws).runs.length){
    if (prefs.get('weekSeen', null) == null && !runs.some(r => r.date < ws)){ prefs.set('weekSeen', ws); return; }
    prefs.set('weekSeen', ws); prefs.set('recapSeen', ws);
    weekMoment(ws);
  }
}

/* ═══ COACH NOTES: what a coach would notice, from the data ═════════════
   Each rule looks for one pattern and says what it means in plain words.
   The card shows the most important few. */
function coachNotes(){
  const runs = sortedRuns(), today = todayYmd(), p = doc.profile, out = [];
  const add = (pri, tone, html) => out.push({ pri, tone, html });
  if (runs.length < 3){ add(1, 'wait', 'A few more runs and these notes get specific to you: heart-rate trends, heat, consistency and form.'); return out; }
  const last = runs.at(-1), since = diffDays(last.date, today);
  // Lifting stays out of the plan, but heavy legs the day before changes how a run feels.
  if (doc.lifts.some(l => l.date === addDays(today, -1) && liftDef(l.ex).legs) && (runsOn(today).length || (coached() && schedule(today, 1)[0].kind === 'run')))
    add(5, 'wait', '<b>Legs yesterday, run today.</b> Keep it easy and skip strides. A few extra beats of heart rate is the lifting, not lost fitness.');
  // Consistency beats everything early on.
  if (since >= 5) add(9, 'warn', `<b>${since} days since your last run.</b> A short, easy one beats waiting for the perfect day.`);
  const recent = runs.filter(r => diffDays(r.date, today) <= 30);
  const gaps = recent.slice(1).filter((r, i) => diffDays(recent[i].date, r.date) >= 5).length;
  if (gaps >= 2) add(7, 'warn', `<b>${gaps} breaks of 5+ days this month.</b> Consistency is the lever right now, more than distance or pace.`);
  const ws = weekStart(today), wkRuns = k => runs.filter(r => r.date >= addDays(ws, -7 * k) && r.date < addDays(ws, -7 * (k - 1))).length;
  if (wkRuns(1) >= 3 && wkRuns(2) >= 3 && wkRuns(3) >= 3) add(4, 'good', '<b>Three straight weeks of three runs.</b> That’s the habit doing its work.');
  // Heat explains a lot of heart rate.
  const warm = runs.slice(-3).filter(r => r.tempF >= HOT_F);
  if (warm.length >= 2) add(6, 'wait', `<b>${warm.length} of your last 3 runs were ${HOT_F}°F or hotter.</b> Heat adds several beats, so that’s the weather, not your fitness. Cooler days will show the real trend.`);
  // The trend that matters: same route, fewer beats.
  const clean = runs.filter(isClean);
  if (clean.length >= 4){
    const a = avgOf(clean.slice(0, 2).map(hrMetric)), b = avgOf(clean.slice(-2).map(hrMetric)), d = Math.round(b - a);
    if (d <= -3) add(8, 'good', `<b>Jogging heart rate is down ${-d} bpm on your test route</b> since ${fmtDate(clean[0].date).slice(4)}. The aerobic base is building.`);
    else if (d >= 4 && warm.length < 2) add(6, 'warn', `<b>Test-route heart rate is up ${d} bpm.</b> Tired, under-slept, or ramping too fast? Keep the next week easy.`);
  }
  // Drift says whether you're ready to go longer.
  if (last.drift != null && last.drift >= 8) add(6, 'warn', `<b>Heart rate climbed ${last.drift} bpm</b> from the first half of your last run to the second. Hold distance steady until that drops under about 5.`);
  else if (last.drift != null && last.drift <= 3 && (last.runSec ?? 0) >= 1200) add(4, 'good', `<b>Heart rate held steady through your last run</b> (+${last.drift} bpm). You’re ready to go a little longer.`);
  // Too hard, too often.
  const hard = runs.slice(-3).filter(r => (r.aboveLtSec ?? 0) > 120 || (r.anaerobicTE ?? 0) > 1).length;
  if (hard >= 2) add(8, 'warn', `<b>${hard} of your last 3 runs went past your threshold.</b> Easy runs build the base: slow down, or take walk breaks when heart rate passes ${p.zones.mod}.`);
  // How it felt versus what the heart said.
  if (last.effort >= 7 && hrMetric(last) != null && hrMetric(last) < p.zones.mod) add(7, 'warn', `<b>Your last run felt like a ${last.effort}, but heart rate stayed easy.</b> Legs, sleep or stress? Keep the next one gentle.`);
  // Ramping time on feet too fast.
  const mins = k => runs.filter(r => r.date >= addDays(ws, -7 * k) && r.date < addDays(ws, -7 * (k - 1))).reduce((s, r) => s + (r.timerSec ?? 0) / 60, 0);
  const m1 = mins(1), m2 = mins(2);
  if (m2 >= 30 && m1 > m2 * 1.3) add(6, 'warn', `<b>Time on your feet jumped ${Math.round((m1 / m2 - 1) * 100)}% last week.</b> Keep this week about the same so calves and shins catch up.`);
  // Recovery improving shows before pace does.
  const rec = runs.filter(r => r.recoveryHr != null);
  if (rec.length >= 3 && rec.at(-1).recoveryHr - rec[0].recoveryHr >= 5) add(5, 'good', `<b>Recovery heart rate is up ${rec.at(-1).recoveryHr - rec[0].recoveryHr} bpm</b> since your first runs. Your heart settles faster after effort.`);
  // Faster, but only by reaching further.
  const form = runs.filter(r => r.stride && r.cadence && r.avgPaceSec);
  if (form.length >= 6){
    const A = form.slice(0, 3), B = form.slice(-3), m = (xs, k) => avgOf(xs.map(r => r[k]));
    if (m(B, 'stride') - m(A, 'stride') >= .05 && Math.abs(m(B, 'cadence') - m(A, 'cadence')) < 3 && m(A, 'avgPaceSec') - m(B, 'avgPaceSec') >= 30)
      add(5, 'warn', '<b>You’re faster, but your cadence hasn’t moved,</b> so the speed is coming from longer strides, which is more load on the calves. Try quicker, shorter steps.');
  }
  // Lighter legs help the heart-rate trend.
  const wt = weightSeries(), now = windowAvg(wt, 7), then = windowAvg(wt, 7, addDays(today, -28));
  if (now != null && then != null && then - now >= 2) add(3, 'good', `<b>Weight down ${(then - now).toFixed(1)} lbs in four weeks.</b> Some of the heart-rate drop is lighter legs.`);
  if (!out.length) add(1, 'good', 'Nothing to flag. Keep stacking easy runs.');
  return out.sort((a, b) => b.pri - a.pri);
}
function coachCard(){
  if (!doc.runs.length) return '';
  const notes = coachNotes().slice(0, 3);
  return `<div class="card coach" style="margin-bottom:16px"><div class="card-head"><h2>Coach notes${infoBtn}</h2><span class="card-sub">from your last few weeks</span></div>
    ${explain('coach')}
    <ul class="status-list">${notes.map(n => `<li class="status-row">${statusIcon(n.tone)}<span class="s-sub coach-line">${n.html}</span></li>`).join('')}</ul></div>`;
}

/* ═══ PROGRESS ═══════════════════════════════════════════════════════ */
function renderProgress(){
  const runs = sortedRuns(), p = doc.profile;
  const page = $('#page-progress');
  if (!runs.length){
    page.innerHTML = band({ eyebrow:'No runs yet', title:'Progress' }) + `<div class="wrap">
      <div class="empty"><b>Nothing to chart yet.</b><br>Runs appear once your watch syncs, or upload a FIT file. <a href="#setup">Go to Setup</a></div></div>`;
    return;
  }
  const clean = runs.filter(isClean);
  const tread = runs.filter(r => isTreadmill(r) && hrMetric(r) != null).slice(-12);
  const lastClean = clean.at(-1), firstClean = clean[0];
  const rec = runs.filter(r => r.recoveryHr != null);
  const lastRun = runs.at(-1);
  const delta = (a, b, lowerBetter) => {
    if (a == null || b == null || a === b) return '';
    const d = Math.round((a - b) * 10) / 10, good = lowerBetter ? d < 0 : d > 0;
    return ` <span style="color:var(--${good ? 'good' : 'warn'}-text);font-weight:700">${d > 0 ? '+' : ''}${d} vs first</span>`;
  };

  const kpiHr = lastClean
    ? `<div class="k-val display num">${Math.round(hrMetric(lastClean))}<span class="k-unit">bpm</span></div>
       <span class="k-dir">↓ Lower is better</span>
       <div class="k-foot">${lastClean.jogHr != null ? 'Jogging only' : 'Whole-run average'} at <b>${fmtDur(lastClean.jogPaceSec ?? lastClean.avgPaceSec)} /mi</b>, ${fmtDate(lastClean.date)}.${clean.length > 1 ? delta(hrMetric(lastClean), hrMetric(firstClean), true) : ' The baseline — the same pace should cost fewer beats every few weeks.'}</div>`
    : `<div class="k-val display num">—</div><div class="k-foot">No clean test-route run yet. Run the protocol on the flat route.</div>`;
  const kpiRec = rec.length
    ? `<div class="k-val display num">${rec.at(-1).recoveryHr}<span class="k-unit">bpm</span></div>
       <span class="k-dir">↑ Higher is better</span>
       <div class="k-foot">${fmtDate(rec.at(-1).date)}.${rec.length > 1 ? delta(rec.at(-1).recoveryHr, rec[0].recoveryHr, false) : ' Moves before pace does. Only counts when you stand still 2 min before saving.'}</div>`
    : `<div class="k-val display num">—</div><div class="k-foot">Not captured yet. Stop the timer, stand still 2 minutes, then save.</div>`;
  const teRuns = runs.filter(r => r.anaerobicTE != null).slice(-6);
  const kpiTe = `<div class="k-val display num">${num(lastRun.anaerobicTE, 1)}<span class="k-unit">last run</span></div>
    <span class="k-dir">→ Stay near 0.0</span>
    <div class="te-strip">${teRuns.map(r => { const ok = r.anaerobicTE <= 1.0;
      return `<div class="te-cell" data-tip="${esc(fmtDate(r.date))} · ${ok ? 'easy' : 'too hard for an easy run'}"><b class="num"><i style="background:var(--${ok ? 'good' : 'crit'})"></i>${r.anaerobicTE.toFixed(1)}</b>${fmtDate(r.date).slice(4)}</div>`; }).join('')}</div>`;

  const withS = runs.filter(r => r.aboveLtSec != null);
  const recent = runs.slice(-12);
  const latest = k => [...runs].reverse().find(r => r[k] != null)?.[k];

  const since = diffDays(lastRun.date, todayYmd());
  const sinceTxt = since <= 0 ? 'ran today' : since === 1 ? 'last run yesterday' : `${since} days since the last run`;
  const effRuns = runs.filter(r => r.effort != null).slice(-12);
  const thisWk = weekStart(todayYmd());
  const wk0 = [weekStart(runs[0].date), addDays(thisWk, -77)].sort().at(-1);
  const weeks = [];
  for (let d = wk0; d <= thisWk; d = addDays(d, 7)){
    const rr = runs.filter(r => r.date >= d && r.date < addDays(d, 7));
    weeks.push({ date:d, n:rr.length, mi:rr.reduce((a, r) => a + (r.distMi ?? 0), 0) });
  }
  const totMi = runs.reduce((a, r) => a + (r.distMi ?? 0), 0), totJog = runs.reduce((a, r) => a + (r.runSec ?? 0), 0);
  page.innerHTML = band({
    eyebrow: `Since ${fmtDate(runs[0].date).slice(4)}${firstClean ? ` · baseline ${fmtDate(firstClean.date).slice(4)}` : ''}`,
    title: 'Pro<em>gress</em>',
    sub: 'Same effort, fewer heartbeats. That’s the whole game.',
    stats: [['Runs', runs.length], ['Clean on test route', clean.length], ['Miles', totMi.toFixed(1)], ['Hours jogging', (totJog / 3600).toFixed(1)]],
  }) + `<div class="wrap">
    ${journeyCard('j-progress')}${coachCard()}
    <div class="section-label">Getting fitter?</div>
    <div class="grid kpis">
      <div class="card kpi"><div class="eyebrow">${lastClean?.jogHr != null ? 'Jogging HR' : 'Avg HR'} · test route${infoBtn}</div>${explain('jogHr')}${kpiHr}</div>
      <div class="card kpi"><div class="eyebrow">Recovery HR · 2-min drop${infoBtn}</div>${explain('recovery')}${kpiRec}</div>
      <div class="card kpi"><div class="eyebrow">Hard-effort score (anaerobic TE)${infoBtn}</div>${explain('anTE')}${kpiTe}</div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-head"><div><h2>Heart rate on the test route${infoBtn}</h2>
        <div class="card-sub">Same route, same effort: lower over time means fitter.</div></div></div>
      ${explain('hrTrend')}
      <div class="legend">
        <span><i class="dotf" style="background:var(--series-1)"></i>Clean test-route run</span>
        <span><i class="ring"></i>Excluded — hover for why</span>
        <span><i style="background:var(--series-1-wash);border:1px solid var(--series-1)"></i>Easy zone (&lt; ${p.zones.easy})</span>
        ${runs.some(r => r.tempF >= HOT_F) ? `<span><i class="ring" style="border-color:var(--warn)"></i>${HOT_F}°F or hotter — heat adds beats</span>` : ''}
      </div>
      <div class="chart" id="c-hr"></div>
    </div>
    ${tread.length >= 2 ? `<div class="card" style="margin-top:16px">

function bestsCard(runs){

    return `<tr><td>${label}</td><td><a href="#runs/${r.id}">${fmtDur(r.best[k])}</a></td><td>${fmtDate(r.date)}${pct ? ` · ${Math.round(pct)}% age grade` : ''}</td></tr>`;
  };
  const ladder = [[50, 'Solid recreational'], [60, 'Local class'], [70, 'Regional class']];
  return `<div class="card" style="margin-top:16px"><div class="card-head"><h2>Personal bests</h2><span class="card-sub">fastest stretch inside any run, not just races</span></div>

        <tr><td><b>Age grade at ${age}</b></td><td>Mile</td><td style="text-align:right;font-weight:650;color:var(--ink)">5K</td></tr>

}

/* ── Milestones (earned automatically) and goals (set by you) ─────── */
const LONG_MARKS = [[1, 'First full mile'], [2, '2 miles in one go'], [3.1, '5K distance'], [5, '5 miles in one go'], [6.2, '10K distance'], [10, '10 miles in one go'], [13.1, 'Half marathon distance'], [26.2, 'Marathon distance']];
const RUN_MARKS = [1, 10, 25, 50, 100, 200, 365];
const MILE_MARKS = [10, 25, 50, 100, 250, 500, 1000];
const WEEK_MARKS = [2, 4, 8, 12, 26];
const GPS_SLACK = 0.02;   // a "mile" that reads 0.99 still counts
// Walk the runs in order and note the date each milestone fell.
function milestones(){
  const got = [], add = (id, label, date) => got.push({ id, label, date });
  let n = 0, mi = 0, longest = 0;
  for (const r of sortedRuns()){
    n++; mi += r.distMi ?? 0; longest = Math.max(longest, r.distMi ?? 0);
    for (const t of RUN_MARKS) if (n === t) add('runs' + t, t === 1 ? 'First run' : `${t} runs`, r.date);
    for (const t of MILE_MARKS) if (mi >= t && !got.some(g => g.id === 'mi' + t)) add('mi' + t, `${t} miles total`, r.date);
    for (const [t, l] of LONG_MARKS) if (longest >= t - GPS_SLACK && !got.some(g => g.id === 'long' + t)) add('long' + t, l, r.date);
  }
  // Weeks in a row with 3+ runs, credited on the Sunday that completes them.
  const runs = sortedRuns();
  if (runs.length){
    let streak = 0;
    for (let w = weekStart(runs[0].date); w <= weekStart(todayYmd()); w = addDays(w, 7)){
      const k = runs.filter(r => r.date >= w && r.date < addDays(w, 7)).length;
      if (k >= 3){ streak++; for (const t of WEEK_MARKS) if (streak === t) add('wk' + t, `${t} weeks in a row of 3+ runs`, addDays(w, 6) > todayYmd() ? todayYmd() : addDays(w, 6)); }
      else if (w < weekStart(todayYmd())) streak = 0;   // the current week can still get there
    }
    got.streak = streak;
  }
  got.n = n; got.mi = mi; got.longest = longest;
  return got;
}
// The next one in each family, with how close you are.
function nextMilestones(m){
  const nx = [];
  const r = RUN_MARKS.find(t => t > m.n); if (r) nx.push([`${r} runs`, m.n / r, `${m.n} of ${r}`]);
  const d = MILE_MARKS.find(t => t > m.mi); if (d) nx.push([`${d} miles total`, m.mi / d, `${m.mi.toFixed(1)} of ${d}`]);
  const l = LONG_MARKS.find(([t]) => t - GPS_SLACK > m.longest); if (l) nx.push([l[1], m.longest / l[0], `longest ${fmtMi(m.longest)} of ${l[0]} mi`]);
  const w = WEEK_MARKS.find(t => t > (m.streak ?? 0)); if (w) nx.push([`${w} weeks in a row of 3+ runs`, (m.streak ?? 0) / w, `${m.streak ?? 0} so far`]);
  return nx;
}

const GOAL_TYPES = {
  long:  { label:'Run a distance in one go', unit:'mi', ph:'2', fmt:v => `${v} mi in one go` },
  total: { label:'Total miles', unit:'mi', ph:'50', fmt:v => `${v} miles total` },
  mi:    { label:'Mile under a time', unit:'m:ss', ph:'10:00', fmt:v => `Mile under ${fmtDur(v)}` },
  k5:    { label:'5K under a time', unit:'m:ss', ph:'35:00', fmt:v => `5K under ${fmtDur(v)}` },
};
const parseDur = s => { const m = String(s).trim().match(/^(\d+):([0-5]\d)$/); return m ? +m[1] * 60 + +m[2] : null; };
// Where a goal stands: current value, 0–1 progress, and the date it was hit.
function goalState(g){
  const runs = sortedRuns();
  if (g.type === 'long'){
    const hit = runs.find(r => r.distMi >= g.target - GPS_SLACK);
    const cur = Math.max(0, ...runs.map(r => r.distMi ?? 0));
    return { cur, pct:Math.min(1, cur / g.target), hit:hit?.date, txt:`longest ${fmtMi(cur)} of ${g.target} mi` };
  }
  if (g.type === 'total'){
    let sum = 0, hit = null;
    for (const r of runs) if (r.date >= g.since && (!g.by || r.date <= g.by)){ sum += r.distMi ?? 0; if (!hit && sum >= g.target) hit = r.date; }
    return { cur:sum, pct:Math.min(1, sum / g.target), hit, txt:`${sum.toFixed(1)} of ${g.target} mi since ${fmtDate(g.since).slice(4)}` };
  }
  const k = g.type, withB = runs.filter(r => r.best?.[k] && timedRun(r));
  const best = withB.length ? Math.min(...withB.map(r => r.best[k])) : null;
  return { cur:best, pct:best ? Math.min(1, g.target / best) : 0, hit:withB.find(r => r.best[k] <= g.target)?.date,
    txt:best ? `best ${fmtDur(best)}, ${best <= g.target ? 'done' : `${fmtDur(best - g.target)} to go`}` : 'no time yet' };
}

// Goals worth suggesting from what someone has actually run: a bit further, a bit faster.
function goalIdeas(){
  const runs = sortedRuns(); if (!runs.length) return [];
  const longest = Math.max(...runs.map(r => r.distMi ?? 0)), ideas = [];
  const next = Math.max(1, Math.ceil((longest + .3) * 2) / 2);
  ideas.push(['long', next, `${next} mi in one go`]);
  const bests = runs.map(r => r.best?.mi).filter(Boolean);
  if (bests.length){ const t = Math.floor((Math.min(...bests) - 20) / 15) * 15; if (t > 240) ideas.push(['mi', t, `Mile under ${fmtDur(t)}`]); }
  if (longest < 3.1 && next !== 3.1) ideas.push(['long', 3.1, '5K distance (3.1 mi)']);
  return ideas;
}

/* ── Week in review ───────────────────────────────────────────────── */
function recap(ws){
  const we = addDays(ws, 6), inWk = d => d >= ws && d <= we;
  const runs = sortedRuns().filter(r => inWk(r.date));
  const mi = runs.reduce((a, r) => a + (r.distMi ?? 0), 0), min = runs.reduce((a, r) => a + (r.timerSec ?? 0), 0) / 60;
  const rts = (doc.routines ?? []).filter(x => inWk(x.date));
  const clean = runs.filter(isClean), before = sortedRuns().filter(r => isClean(r) && r.date < ws && diffDays(r.date, ws) <= 28);
  const hr = clean.length ? avgOf(clean.map(hrMetric)) : null, hrBefore = before.length ? avgOf(before.map(hrMetric)) : null;
  const eff = runs.filter(r => r.effort != null);
  // Rounded once, half away from zero, so the headline and the detail agree.
  const hrDelta = hr != null && hrBefore != null ? Math.sign(hr - hrBefore) * Math.round(Math.abs(hr - hrBefore)) : null;
  // Compare against every earlier week, for "your most yet".
  const first = sortedRuns()[0]?.date;
  const prevMi = [];
  if (first) for (let w = weekStart(first); w < ws; w = addDays(w, 7)) prevMi.push(sortedRuns().filter(r => r.date >= w && r.date <= addDays(w, 6)).reduce((a, r) => a + (r.distMi ?? 0), 0));
  const ms = milestones().filter(x => inWk(x.date));
  const headline = !runs.length ? 'No runs this week.'
    : hrDelta != null && hrDelta <= -2 ? `Heart rate down ${-hrDelta} bpm on the test route — that’s fitness.`
    : prevMi.length && mi > Math.max(...prevMi) + 0.05 ? 'Your biggest week yet.'
    : ms.length ? `New milestone: ${ms.at(-1).label}.`
    : runs.length >= 3 ? 'Three runs in. That’s the habit.' : `A lighter week: ${runs.length === 1 ? 'one run' : 'two runs'}.`;
  return { ws, we, runs, mi, min, strength:rts.filter(x => x.id === 'strength').length, stretches:rts.filter(x => x.id !== 'strength').length,
    longest:runs.reduce((a, r) => Math.max(a, r.distMi ?? 0), 0), hr, hrBefore, hrDelta, effort:eff.length ? avgOf(eff.map(r => r.effort)) : null, ms, headline };
}

// A poster of the week, for sharing to a group chat. Drawn on a canvas in the site's look.
async function shareRecap(ws){
  const R = recap(ws), W = 1080, H = 1350, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  try { await Promise.all(['italic 800 100px Archivo', '700 40px Archivo'].map(f => document.fonts.load(f))); } catch {}
  g.fillStyle = '#0c0d0e'; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = .12; g.strokeStyle = '#d4ff3a'; g.lineWidth = 60;
  for (let x = 560; x < W + 400; x += 150){ g.beginPath(); g.moveTo(x, -20); g.lineTo(x - 360, H + 20); g.stroke(); }
  g.restore();
  const disp = px => `italic 800 ${px}px Archivo, system-ui, sans-serif`;
  g.fillStyle = '#d4ff3a'; g.font = '700 34px Archivo, system-ui, sans-serif';
  g.fillText(`STRIDE · WEEK OF ${MON[parseYmd(ws).getMonth()].toUpperCase()} ${parseYmd(ws).getDate()}`, 80, 120);
  // The headline takes the biggest size that fits in three lines.
  const words = R.headline.replace(/[.—\s]+$/, '').toUpperCase().split(' ');
  const wrap = px => { g.font = disp(px); const lines = []; let line = '';
    for (const w of words){ const t = line ? line + ' ' + w : w; if (line && g.measureText(t).width > W - 160){ lines.push(line); line = w; } else line = t; }
    return [...lines, line]; };
  let px = 120, lines = wrap(px);
  while (lines.length > 3 && px > 64){ px -= 8; lines = wrap(px); }
  g.fillStyle = '#f4f4f0';
  lines.forEach((l, i) => g.fillText(l, 80, 250 + i * px * 1.02));
  const stats = [['RUNS', R.runs.length], ['MILES', R.mi.toFixed(1)], ['MINUTES', Math.round(R.min)], ['LONGEST', R.longest ? fmtMi(R.longest) : '—']];
  stats.forEach(([l, v], i) => {
    const x = 80 + (i % 2) * 460, yy = 820 + Math.floor(i / 2) * 230;
    g.fillStyle = '#d4ff3a'; g.font = disp(150); g.fillText(String(v), x, yy);
    g.fillStyle = '#9a9ea5'; g.font = '700 30px Archivo, system-ui, sans-serif'; g.fillText(l, x, yy + 50);
  });
  g.fillStyle = '#9a9ea5'; g.font = '600 30px Archivo, system-ui, sans-serif';
  const extra = [R.ms.length && `New: ${R.ms.map(x => x.label).join(' · ')}`, R.strength && `${R.strength}× strength`, R.stretches && `${R.stretches}× stretching`].filter(Boolean).join('   ');
  if (extra){ let t = extra; while (g.measureText(t).width > W - 160) t = t.slice(0, -2); g.fillText(t === extra ? t : t + '…', 80, H - 80); }
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], `stride-week-${ws}.png`, { type:'image/png' });
  try {
    if (navigator.canShare?.({ files:[file] })){ await navigator.share({ files:[file], title:'My running week' }); return; }
  } catch (err){ if (err.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Saved the image');
}

/* ── Crew: an opt-in weekly board with friends ───────────────────────
   Only a display name and this week's totals leave the device (stride_crew);
   the crew code and name live in the synced doc. Until the table exists the
   card says so instead of erroring. */
const CREW = { rows:null, state:'idle', at:0, pushed:null };
function crewStats(){
  const ws = weekStart(todayYmd()), wk = doc.runs.filter(r => r.date >= ws);
  return { week_start:ws, runs:wk.length, minutes:Math.round(wk.reduce((a, r) => a + (r.timerSec ?? 0), 0) / 60),
    miles:Math.round(wk.reduce((a, r) => a + (r.distMi ?? 0), 0) * 10) / 10, streak:milestones().streak ?? 0 };
}
const crewCode = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = crypto.getRandomValues(new Uint8Array(10)); return [...b].map(x => a[x % a.length]).join(''); };
async function crewPush(force = false){
  if (!signedIn() || !doc.crew?.code) return;
  const row = { user_id:SESSION.user_id, group_code:doc.crew.code, name:doc.crew.name, ...crewStats(), updated_at:new Date().toISOString() };
  const sig = JSON.stringify({ ...row, updated_at:0 });
  if (!force && sig === CREW.pushed) return;
  if (!await ensureToken()) return;
  const r = await sb('/rest/v1/stride_crew?on_conflict=user_id', { method:'POST', body:JSON.stringify(row), headers:{ Prefer:'resolution=merge-duplicates,return=minimal' } });
  if (r.status === 404){ CREW.state = 'missing'; return; }
  if (!r.ok) throw new Error('crew ' + r.status);
  CREW.pushed = sig;
}
async function crewLoad(force = false){
  if (!signedIn() || !doc.crew?.code || CREW.state === 'loading') return;
  // Throttled from the attempt, not the success, so a failing request can't loop through the card's redraw.
  if (!force && Date.now() - CREW.at < 60e3) return;
  CREW.state = 'loading'; CREW.at = Date.now();
  try {
    await crewPush();
    if (CREW.state === 'missing') return;
    const r = await sb('/rest/v1/stride_crew?select=user_id,name,week_start,runs,minutes,miles,streak&order=name');
    if (r.status === 404){ CREW.state = 'missing'; return; }
    if (!r.ok) throw new Error();
    CREW.rows = await r.json(); CREW.state = 'ok';
  } catch { CREW.state = 'error'; }
  finally { const c = $('#crew-card'); if (c) c.outerHTML = crewCard(); }
}
function crewCard(){
  const head = sub => `<div class="card-head"><h2>Crew</h2><span class="card-sub">${sub}</span></div>`;
  if (!syncOn()) return '';
  if (!signedIn()) return `<div class="card" id="crew-card">${head('run with friends')}<p class="card-sub" style="margin:0"><button class="link-btn" data-action="goto-signin">Sign in</button> to share weekly totals with friends on a private board.</p></div>`;
  if (!doc.crew?.code) return `<div class="card" id="crew-card">${head('run with friends')}
    <p class="card-sub" style="margin:0 0 12px">A private board for you and your friends: each person’s runs, minutes and miles this week, and their streak. Nothing else is shared — no heart rate, no weight, no routes.</p>
    <div class="field-row"><div class="field"><label for="crew-name">Your name on the board</label><input id="crew-name" maxlength="40" placeholder="e.g. Neil"></div>
      <div class="field"><label for="crew-join">Got a code? (leave blank to start a crew)</label><input id="crew-join" maxlength="10" placeholder="ABCD234XYZ" style="text-transform:uppercase"></div></div>
    <div class="btn-row" style="margin-top:12px"><button class="btn small primary" data-action="crew-go">Start or join</button></div></div>`;
  if (CREW.state === 'missing') return `<div class="card" id="crew-card">${head('almost ready')}<p class="card-sub" style="margin:0">The crew board isn’t switched on yet — it needs a one-time database update. Your settings are saved and it’ll appear once that’s done.</p></div>`;
  if (!CREW.rows){ if (CREW.state !== 'error' || Date.now() - CREW.at > 60e3) crewLoad(); return `<div class="card" id="crew-card">${head(CREW.state === 'error' ? 'couldn’t load — try again soon' : 'loading…')}</div>`; }
  const ws = weekStart(todayYmd());
  const rows = CREW.rows.map(r => r.week_start === ws ? r : { ...r, runs:0, minutes:0, miles:0 }).sort((a, b) => b.runs - a.runs || b.minutes - a.minutes);
  return `<div class="card" id="crew-card">${head(`this week · code <b class="num" style="letter-spacing:.06em">${esc(doc.crew.code)}</b>`)}
    <table class="quiet crew">${rows.map(r => `<tr${r.user_id === SESSION.user_id ? ' class="me"' : ''}><td>${esc(r.name)}${r.streak >= 2 ? ` <span class="badge">${r.streak} wk streak</span>` : ''}</td>
      <td>${r.runs} run${r.runs === 1 ? '' : 's'}</td><td>${r.minutes} min · ${Number(r.miles).toFixed(1)} mi</td></tr>`).join('')}</table>
    <p class="card-sub" style="margin:12px 0 0">Share the code with friends so they can join. <button class="link-btn" data-action="crew-copy">Copy invite</button> · <button class="link-btn" data-action="crew-leave">Leave crew</button></p>
  </div>`;
}

const activeShoes = () => (doc.shoes ?? []).filter(sh => !sh.retired);
function shoeRow(sh){

  if (s) chartTrace($('#c-trace'), s);
  $('#rec-in').addEventListener('change', async e => {

// A daily series on a real date axis, so missed days leave gaps instead of
// squeezing the line. `smooth` draws raw days as faint dots under a 7-day mean.
function chartDaily(host, pts, { days, unit = '', step, dec = 0, smooth = false, bars = false, gapDays = 10 }){
  const H = 200, m = { t:22, r:44, b:28, l:38 };
  const [svg, W] = svgFor(host, H);
  const end = todayYmd(), start = addDays(end, -days + 1);
  pts = pts.filter(p => p.date >= start);
  if (!pts.length){ host.innerHTML = '<div class="pending-box">Nothing in this range yet.</div>'; return; }
  const vals = pts.map(p => p.v);
  let lo = bars ? 0 : Math.floor((Math.min(...vals) - step / 2) / step) * step, hi = Math.ceil((Math.max(...vals) + step / 2) / step) * step;
  if (hi - lo < step * 2) hi = lo + step * 2;
  const x = d => m.l + (diffDays(start, d) + .5) / days * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const f = v => Number(v).toFixed(dec);
  hGrid(svg, niceTicks(lo, hi, step), y, m.l, W - m.r, v => step < 1 ? f(v) : String(Math.round(v)));
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  const tickEvery = days <= 31 ? 7 : days <= 92 ? 14 : 61;
  for (let d = 0; d < days; d += tickEvery){
    const dd = addDays(start, d);
    el('text', { x:x(dd), y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = `${MON[parseYmd(dd).getMonth()]} ${parseYmd(dd).getDate()}`;
  }
  const c = css('--series-1'), surf = css('--surface');
  const band = (W - m.l - m.r) / days;
  let line = pts;
  if (bars){
    const bw = Math.max(2, Math.min(14, band - 2));
    pts.forEach(p => el('path', { d:colPath(x(p.date) - bw / 2, y(p.v), bw, y(lo)), fill:c, class:'bar' }, svg));
  } else if (smooth){
    pts.forEach(p => el('circle', { cx:x(p.date), cy:y(p.v), r:3, fill:c, 'fill-opacity':.28 }, svg));
    line = pts.map(p => ({ date:p.date, v:windowAvg(pts, 7, p.date) }));
  }
  if (!bars && line.length > 1){
    let d = '';
    line.forEach((p, i) => { const gap = i && diffDays(line[i - 1].date, p.date) > gapDays; d += `${!i || gap ? 'M' : 'L'}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`; });
    el('path', { d, fill:'none', stroke:c, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  }
  if (!bars && !smooth) pts.forEach(p => el('circle', { cx:x(p.date), cy:y(p.v), r:pts.length > 40 ? 2.5 : 4, fill:c, stroke:surf, 'stroke-width':pts.length > 40 ? 0 : 2 }, svg));
  const lastP = line.at(-1);
  el('circle', { cx:x(lastP.date), cy:y(lastP.v), r:5, fill:c, stroke:surf, 'stroke-width':2 }, svg);
  el('text', { x:x(lastP.date) + 8, y:y(lastP.v) + 4, class:'lbl num' }, svg).textContent = f(lastP.v);
  // hover: nearest day
  const cross = el('line', { y1:m.t, y2:H - m.b, stroke:css('--ink'), opacity:0 }, svg);
  const hit = el('rect', { x:m.l, y:m.t, width:W - m.l - m.r, height:H - m.t - m.b, fill:'transparent' }, svg);
  hit._tip = e => {
    const r = svg.getBoundingClientRect(), dx = (e.clientX - r.left - m.l) / (W - m.l - m.r) * days;
    const want = addDays(start, Math.round(dx - .5));
    const p = pts.reduce((a, b) => Math.abs(diffDays(b.date, want)) < Math.abs(diffDays(a.date, want)) ? b : a);
    cross.setAttribute('x1', x(p.date)); cross.setAttribute('x2', x(p.date)); cross.setAttribute('opacity', .3);
    const avg = smooth ? windowAvg(pts, 7, p.date) : null;
    return `<b>${fmtDate(p.date)}</b><br>${f(p.v)} ${unit}${avg != null ? ` · 7-day avg ${f(avg)}` : ''}${p.src === 'manual' ? ' · weigh-in' : ''}`;
  };
  hit._tipOut = () => cross.setAttribute('opacity', 0);
}

function bodyStat(label, pts, { unit = '', dec = 0, days = 7, lowerBetter = null } = {}){
  const now = windowAvg(pts, days), before = windowAvg(pts, days, addDays(todayYmd(), -28));
  let delta = '';
  if (now != null && before != null && Math.abs(now - before) >= Math.pow(10, -dec)){
    const d = now - before, good = lowerBetter == null ? null : lowerBetter ? d < 0 : d > 0;
    delta = `<span class="delta${good == null ? '' : good ? ' good' : ' bad'}">${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(dec)} vs 4 wks ago</span>`;
  }
  return { label, value: now == null ? '—' : now.toFixed(dec), unit, delta };
}
function bodyStats(){
  return {
    weight: bodyStat('Weight · 7-day avg', weightSeries(), { unit:'lbs', dec:1 }),
    rhr: bodyStat('Resting HR', bodySeries('rhr'), { unit:'bpm', lowerBetter:true }),
    hrv: bodyStat('HRV · overnight', bodySeries('hrv'), { unit:'ms', lowerBetter:false }),
    sleep: bodyStat('Sleep · 7-night avg', bodySeries('sleepH'), { unit:'hrs', dec:1, lowerBetter:false }),
  };
}

function bodyTodayCard(){
  const st = bodyStats(), any = Object.values(st).some(x => x.value !== '—');
  return `<a class="card card-link" href="#body"><div class="card-head"><h2>Body</h2><span class="card-sub">${any ? '7-day averages ›' : 'set it up ›'}</span></div>
    ${any ? `<div class="mini-stats">${Object.values(st).map(x => `<div><div class="ms-l">${x.label.split(' · ')[0]}</div><div class="ms-v display num">${x.value}<small>${x.value === '—' ? '' : x.unit}</small></div>${x.delta}</div>`).join('')}</div>`
      : `<p class="card-sub" style="margin:0">${doc.intervals?.key ? 'Garmin’s daily data (weight, resting HR, HRV, sleep) will show up here after the next sync.' : 'Connect intervals.icu in Setup and Garmin’s daily weight, resting HR, HRV and sleep fill in on their own. Or add a weigh-in on the Body tab.'}</p>`}
  </a>`;
}

/* ── Aches & pains: a tap-where-it-hurts body map ─────────────────────
   Front and back outlines, legs split into zones. Front view shows the
   person's right leg on the viewer's left; the back view is the other way
   round. The plan's hard stops apply: shin or Achilles pain, or a sharp knee,
   pauses the plan until it's been looked at. */
const PAIN_AREAS = {
  hipF:'Hip / groin', quad:'Thigh, front', knee:'Knee', shin:'Shin', ankle:'Ankle', foot:'Foot',
  back:'Lower back', glute:'Glute', ham:'Hamstring', calf:'Calf', achilles:'Achilles', heel:'Heel / sole',
};
const PAIN_LEVELS = { 1:'Mild', 2:'Moderate', 3:'Sharp' };
// Zone bands down each leg: [area, y0, y1]. x0/x1 are the leg's edges.
const FRONT_ZONES = [['hipF', 104, 124], ['quad', 124, 164], ['knee', 164, 182], ['shin', 182, 222], ['ankle', 222, 232], ['foot', 232, 246]];
const BACK_ZONES = [['glute', 104, 130], ['ham', 130, 166], ['calf', 166, 208], ['achilles', 208, 230], ['heel', 230, 246]];
const painUi = { area:null, side:null, level:null, msg:null };
const painRed = p => ((p.area === 'shin' || p.area === 'achilles') && p.level >= 2) || (p.area === 'knee' && p.level === 3);
const sideName = (area, side) => `${side === 'center' ? '' : side === 'left' ? 'Left ' : 'Right '}${PAIN_AREAS[area].toLowerCase()}`.replace(/^./, c => c.toUpperCase());

function bodyMapSvg(){
  const recent = (doc.pains ?? []).filter(p => diffDays(p.date, todayYmd()) <= 30);
  const fig = (ox, view) => {
    const zones = view === 'front' ? FRONT_ZONES : BACK_ZONES;
    // Viewer-left leg is the person's right from the front, their left from behind.
    const legs = [[31, 49, view === 'front' ? 'right' : 'left'], [51, 69, view === 'front' ? 'left' : 'right']];
    let s = `<g transform="translate(${ox} 0)">
      <circle cx="50" cy="16" r="11" class="bm-base"/><rect x="44" y="26" width="12" height="8" class="bm-base"/>
      <rect x="29" y="32" width="42" height="74" rx="11" class="bm-base"/>
      <rect x="17" y="35" width="10" height="70" rx="5" class="bm-base"/><rect x="73" y="35" width="10" height="70" rx="5" class="bm-base"/>
      ${legs.map(([x0, x1]) => `<rect x="${x0}" y="102" width="${x1 - x0}" height="132" rx="7" class="bm-base"/><rect x="${x0 - (view === 'front' ? 1 : 0)}" y="232" width="${x1 - x0 + 2}" height="13" rx="5" class="bm-base"/>`).join('')}
      <text x="50" y="258" text-anchor="middle" class="bm-cap">${view === 'front' ? 'Front' : 'Back'}</text>`;
    if (view === 'back') s += zoneRect(34, 80, 66, 103, 'back', 'center');
    for (const [x0, x1, side] of legs) for (const [area, y0, y1] of zones) s += zoneRect(x0, y0, x1, y1, area, side);
    // Recent aches as dots, sized and coloured by how bad.
    for (const p of recent){
      const z = zones.find(q => q[0] === p.area); if (!z && p.area !== 'back') continue;
      const leg = legs.find(l => l[2] === p.side), cx = p.area === 'back' ? 50 : leg ? (leg[0] + leg[1]) / 2 : null;
      if (cx == null || (p.area === 'back' && view !== 'back')) continue;
      const cy = p.area === 'back' ? 92 : (z[1] + z[2]) / 2;
      s += `<circle cx="${cx}" cy="${cy}" r="${3 + p.level}" class="bm-dot l${p.level}"/>`;
    }
    return s + '</g>';
  };
  function zoneRect(x0, y0, x1, y1, area, side){
    const on = painUi.area === area && painUi.side === side;
    return `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="3" class="bm-zone${on ? ' on' : ''}" data-pain-zone="${area}|${side}" tabindex="0" role="button" aria-label="${sideName(area, side)}"><title>${sideName(area, side)}</title></rect>`;
  }
  return `<svg viewBox="0 0 230 262" class="bodymap" role="group" aria-label="Body map">${fig(5, 'front')}${fig(125, 'back')}</svg>`;
}

function painCard(){
  const pains = [...(doc.pains ?? [])].sort((a, b) => a.at < b.at ? 1 : -1), recent = pains.filter(p => diffDays(p.date, todayYmd()) <= 30);
  // The same spot three times in two weeks deserves more than guessing.
  const counts = {}; for (const p of pains.filter(p => diffDays(p.date, todayYmd()) <= 14)){ const k = p.area + '|' + p.side; counts[k] = (counts[k] ?? 0) + 1; }
  const repeat = Object.entries(counts).filter(([, n]) => n >= 3).map(([k]) => sideName(...k.split('|')));
  return `<div class="card" id="pain-map"><div class="card-head"><h2>Aches & pains</h2><span class="card-sub">tap where it hurts</span></div>
    <div class="pain-grid">
      <div>${bodyMapSvg()}
        <div class="legend" style="justify-content:center"><span><i class="bm-key l1"></i>Mild</span><span><i class="bm-key l2"></i>Moderate</span><span><i class="bm-key l3"></i>Sharp</span><span class="card-sub">last 30 days</span></div></div>
      <div>
        ${painUi.msg ? `<div class="response show${painUi.msg.alarm ? ' alarm' : ''}" style="margin:0 0 14px">${painUi.msg.html}</div>` : ''}
        ${painUi.area ? `<div class="eyebrow" style="margin-bottom:8px">${sideName(painUi.area, painUi.side)} · how bad?</div>
          <div class="pill-row">${Object.entries(PAIN_LEVELS).map(([k, l]) => `<button class="pill" data-pain-level="${k}" aria-pressed="${painUi.level === +k}">${l}</button>`).join('')}</div>
          <div class="field" style="margin-top:12px"><label for="pain-note">Note (optional)</label><input id="pain-note" placeholder="e.g. tight going downstairs"></div>
          <div class="btn-row" style="margin-top:12px"><button class="btn small primary" data-action="save-pain" ${painUi.level ? '' : 'disabled'}>Log it</button><button class="link-btn" data-action="cancel-pain">Cancel</button></div>`
        : `<p class="card-sub" style="margin:0 0 12px">Tap the spot on the outline. It builds a picture over time, so a niggle that keeps coming back stands out early. This is a log, not a diagnosis.</p>`}
        ${repeat.length ? `<div class="note" style="margin-top:14px">${WARN_SVG}<div><b>${esc(repeat.join(', '))} keeps coming back.</b> Three times in two weeks is worth a physical therapist rather than more guessing.</div></div>` : ''}
        ${recent.length ? `<table class="quiet" style="margin-top:14px">${recent.slice(0, 8).map(p => `<tr><td>${fmtDate(p.date)}</td><td>${sideName(p.area, p.side)}</td><td>${PAIN_LEVELS[p.level]}${p.note ? ' · ' + esc(p.note) : ''} <button class="link-btn" data-del-pain="${p.id}">remove</button></td></tr>`).join('')}</table>` : ''}
      </div>
    </div>
  </div>`;
}
function painResponse(p){
  const where = sideName(p.area, p.side).toLowerCase();
  if (painRed(p)) return { alarm:true, html:`<b>Stop running and get it looked at.</b> ${p.area === 'knee' ? 'A sharp knee' : p.area === 'shin' ? 'Shin pain' : 'Achilles pain'} is one of the plan’s hard stops, so it’s paused until a doctor or physical therapist has checked it. Walking is fine if it doesn’t hurt.` };
  if (p.area === 'knee') return { alarm:false, html:`<b>Don’t run through knee pain</b> the way you would tight muscles — joints don’t loosen up as they warm. If it shows up earlier in your next run, swells, catches or makes you limp, get it checked.` };
  if (p.area === 'calf' && p.level >= 2) return { alarm:true, html:`<b>One calf sore${p.level === 3 ? ' and sharp' : ''} is the early warning.</b> If it’s clearly worse than the other side or pulls during a run, stop the run. Repeat this week instead of moving up.` };
  if (p.level === 3) return { alarm:true, html:`<b>Sharp ${where} pain: skip running until it settles.</b> If it’s still sharp in a couple of days, get it looked at. Sharp is different from the dull ache of normal soreness.` };
  return { alarm:false, html:`Logged. Dull, achy and easing as you move is normal soreness. Still there in 48 hours means repeat the week instead of moving up.` };
}

function fmtSets(sets, bw){

function liftBest(ex){

// back ~10% after missing the same weight twice running.
function progWeight(ex, sets, reps){
  const P = doc.liftProg, h = liftHist(ex).filter(l => l.day && l.date >= P.since);
  if (!h.length) return P.start[ex] ?? 0;
  const hit = l => l.sets.filter(s => s.lb >= topLb(l) && s.reps >= reps).length >= sets;
  const last = h.at(-1), prev = h.at(-2), w = topLb(last);
  if (hit(last)) return w + liftDef(ex).inc;
  if (prev && topLb(prev) === w && !hit(prev)) return round5(w * 0.9);
  return w;
}

const liftUi = { summary:null, ex:'squat', date:null, sets:[{ lb:'', reps:'' }], day:null, wo:null, editId:null, name:'', legs:true, setup:null, chart:null, edit:null };

// { id, name, items:[{ ex, sets?, reps? }] }. Entries logged from one carry `wo`.
const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;

const LIFT_SPLIT = ['Push', 'Pull', 'Legs'];
// Each slot is an exercise family; the variation is picked when the workout is made or run.
const SPLIT_TEMPLATES = {
  Push: [['hpress', 3, 8], ['ipress', 3, 10], ['vpress', 3, 10], ['fly', 3, 12], ['triceps', 3, 12], ['lateral', 3, 15]],
  Pull: [['vpull', 3, 8], ['hpull', 3, 10], ['hpull', 3, 12], ['reardelt', 3, 15], ['biceps', 3, 12], ['biceps', 2, 12]],
  Legs: [['squat', 3, 8], ['hinge', 3, 8], ['single', 3, 10], ['hamcurl', 3, 12], ['calf', 3, 15], ['core', 3, 12]],
};
function groupOf(exs){
  const c = {};
  for (const ex of exs){ const g = liftDef(ex).g; if (LIFT_SPLIT.includes(g)) c[g] = (c[g] || 0) + 1; }
  return Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
}
function nextGroup(){
  const last = doc.lifts.map(l => l.date).sort().at(-1);
  if (!last) return { g:'Push', after:null };
  const g = groupOf(doc.lifts.filter(l => l.date === last).map(l => l.ex));
  return { g: g ? LIFT_SPLIT[(LIFT_SPLIT.indexOf(g) + 1) % LIFT_SPLIT.length] : 'Push', after:g && { g, date:last } };

// The family member done longest ago (never done counts as longest), skipping
// what the gym doesn't have and what this session already uses.
function pickVariation(f, used, date){
  const lastDone = id => liftHist(id).filter(l => l.date < date).at(-1)?.date ?? '';
  const opts = LIFTS.filter(l => l.f === f && !doc.gym.skip.includes(l.id) && !used.has(l.id));
  return opts.sort((a, b) => lastDone(a.id) < lastDone(b.id) ? -1 : lastDone(a.id) > lastDone(b.id) ? 1 : 0)[0]?.id ?? null;

// Uses only history before `date`, so the picks hold still while you log.
function woPlan(w, date){
  const used = new Set();

    let ex = it.ex;
    if (f && (w.vary || doc.gym.skip.includes(it.ex))) ex = pickVariation(f, used, date) ?? it.ex;

function drawLiftChart(){
  const host = $('#c-lift'); if (!host) return;
  const def = liftDef(host.dataset.ex), m = {};
  for (const l of liftHist(def.id)){ const v = Math.max(...l.sets.map(s => liftScore(def, s))); if (!m[l.date] || v > m[l.date].v) m[l.date] = { v, r:{ date:l.date } }; }
  const pts = Object.values(m), vs = pts.map(p => p.v), lo0 = Math.min(...vs), hi0 = Math.max(...vs);
  const step = def.bw ? Math.max(1, Math.ceil((hi0 - lo0) / 4)) : Math.max(5, round5((hi0 - lo0) / 4));
  chartLine(host, pts, { lo:Math.max(0, Math.floor(lo0 / step) * step - step), hi:Math.ceil(hi0 / step) * step + step, step,
    tipFmt:p => `<b>${fmtDate(p.r.date)}</b><br>${def.bw ? `${p.v} reps` : `est. 1-rep max ${p.v} lb`}` });
}

function liftRunTips(){
  const today = todayYmd(), legsOn = d => doc.lifts.some(l => l.date === d && liftDef(l.ex).legs);
  if (!doc.planId) return `<div class="card"><div class="card-head"><h2>Lifting around your runs</h2><span class="card-sub">when you start running</span></div>
    <p class="card-sub" style="margin:0 0 12px">Pick a run plan and this card spaces your leg days around your runs. Lifting on its own works fine without one.</p>
    <a class="btn small" href="#intake" style="text-decoration:none">Pick a run plan</a></div>`;
  const days = coached() ? schedule(today, 2) : [];
  const runToday = runsOn(today).length > 0 || days[0]?.kind === 'run', runTomorrow = days[1]?.kind === 'run', tips = [];
  if (legsOn(addDays(today, -1)) && runToday) tips.push('<b>Legs yesterday, run today:</b> keep it truly easy and skip any strides. Heart rate may sit a few beats higher than usual. That’s the lifting, not lost fitness.');
  if (runTomorrow && !legsOn(today)) tips.push('<b>Run tomorrow:</b> if you lift today, make it upper body, or keep leg work light and stop well short of failure.');
  if (runToday) tips.push('<b>Lifting on a run day?</b> Run first and lift after, ideally a few hours later. Tired legs make for a sloppy run.');
  else if (coached() && !runTomorrow) tips.push('<b>No run today or tomorrow:</b> a good window for your heaviest leg day.');
  tips.push('Keep heavy leg days at least 48 hours before your longest or hardest run of the week, and skip heavy legs in race week.');
  return `<div class="card"><div class="card-head"><h2>Lifting around your runs</h2><span class="card-sub">suggestions · your run plan doesn’t change</span></div>
    <ul class="lift-tips">${tips.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
}

Object.assign(LMOVES, { dbrdl:{ ...LMOVES.rdl, gear:P => bell(P.w1) }, dbbench:{ ...LMOVES.bench, props:BENCH, gear:P => bell(P.w1) },
  dbincline:{ ...LMOVES.incline, gear:P => bell(P.w1) }, chinup:LMOVES.pullup, hammer:LMOVES.dbcurl });

// The routine as timed steps. Sore spots from the last few days get longer holds.
function routineSteps(rid){
  const recent = v => doc.checkins.some(c => c.value === v && Date.now() - Date.parse(c.at) < 4 * 864e5);
  const extra = { hipKneel:recent('hip'), hipStand:recent('hip'), couch:recent('hip'), calfStraight:recent('calves'), calfBent:recent('calves') };
  const steps = [];
  for (const it of ROUTINES[rid].moves){
    const [id, over] = Array.isArray(it) ? it : [it, null], m = MOVES[id];
    const sec = (over ?? m.sec) + (extra[id] ? 15 : 0);
    const prep = m.rest ? 0 : PREP_SEC;
    if (m.sides){ steps.push({ id, side:'Left', sec, prep, extra:extra[id] }, { id, side:'Right', sec, prep:SWITCH_SEC, extra:extra[id] }); }
    else steps.push({ id, sec, prep, extra:extra[id] });
  }
  return steps;
}
const routineSec = steps => steps.reduce((a, s) => a + s.sec + s.prep, 0);
const routinesThisWeek = id => (doc.routines ?? []).filter(r => r.id === id && r.date >= weekStart(todayYmd())).length;

/* Player. Time comes from the clock, not from counting ticks, so a slow phone
   or a backgrounded tab never stretches a hold. */
const RP = { rid:null, steps:[], i:0, phase:'idle', endAt:0, left:0, paused:false, timer:null, lastBeep:null, started:0 };
let audioCtx = null, wakeLock = null;
const soundOn = () => prefs.get('sound', true);
function beep(freq = 880, ms = 120){
  if (soundOn() && audioCtx){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + ms / 1000);
    o.start(t); o.stop(t + ms / 1000 + .02);
  }
  if (navigator.userActivation?.hasBeenActive !== false) navigator.vibrate?.(ms);
}
async function keepAwake(on){
  try {
    if (on && !wakeLock && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && RP.phase !== 'idle' && RP.phase !== 'done' && !RP.paused){ wakeLock = null; keepAwake(true); }
});

function startRoutine(rid){
  try { audioCtx ??= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {}
  Object.assign(RP, { rid, steps:routineSteps(rid), i:0, paused:false, started:Date.now() });
  enterStep(0); keepAwake(true);
  clearInterval(RP.timer); RP.timer = setInterval(tickRoutine, 100);
}
function enterStep(i){
  RP.i = i; RP.lastBeep = null;
  const s = RP.steps[i];
  if (s.prep){ RP.phase = 'prep'; RP.endAt = Date.now() + s.prep * 1000; }
  else { RP.phase = 'go'; RP.endAt = Date.now() + s.sec * 1000; beep(1320, 220); }
  paintPlayer(true);
}
function tickRoutine(){
  if (RP.paused || RP.phase === 'idle' || RP.phase === 'done') return;
  const left = Math.max(0, RP.endAt - Date.now()), whole = Math.ceil(left / 1000);
  if (RP.phase === 'go' && whole <= 3 && whole > 0 && RP.lastBeep !== whole){ RP.lastBeep = whole; beep(880, 90); }
  if (left > 0){ paintPlayer(false); return; }
  if (RP.phase === 'prep'){ RP.phase = 'go'; RP.endAt = Date.now() + RP.steps[RP.i].sec * 1000; RP.lastBeep = null; beep(1320, 220); paintPlayer(true); return; }
  if (RP.i + 1 < RP.steps.length){ enterStep(RP.i + 1); return; }
  finishRoutine();
}
async function finishRoutine(){
  clearInterval(RP.timer); RP.phase = 'done'; keepAwake(false); beep(1320, 400);
  const today = todayYmd(), r = ROUTINES[RP.rid];
  for (const t of r.tasks) doc.done[`${today}|${t}`] = true;
  doc.routines = [...(doc.routines ?? []), { date:today, id:RP.rid, sec:Math.round((Date.now() - RP.started) / 1000) }].slice(-300);
  await save();
  if (location.hash.startsWith('#routine')) renderRoutine(RP.rid);
}
function stopRoutine(){ clearInterval(RP.timer); RP.phase = 'idle'; RP.paused = false; keepAwake(false); }
function pauseRoutine(p){
  if (p === RP.paused || RP.phase === 'idle' || RP.phase === 'done') return;
  if (p){ RP.left = RP.endAt - Date.now(); RP.paused = true; keepAwake(false); }
  else { RP.endAt = Date.now() + RP.left; RP.paused = false; keepAwake(true); }
  paintPlayer(true);
}

function routineCard(){
  const today = todayYmd(), ran = runsOn(today).length > 0;
  const nextRun = coached() ? schedule(today, 1)[0]?.kind === 'run' : false;
  const str = routinesThisWeek('strength');
  const pick = ran ? 'post' : nextRun ? 'pre' : str < 2 || !focus().hips ? 'strength' : 'desk';
  const why = { pre:'Run day: do this right before you head out.', post:'You ran today: cool down while you’re still warm.', strength:`Rest day: a good day for strength (${str}/2 this week).`, desk:'Rest day: keep the hips loose between sitting.' }[pick];
  return `<div class="card"><div class="card-head"><h2>Stretch & strength</h2><span class="card-sub">follow along, with a timer</span></div>
    <p class="card-sub" style="margin:0 0 12px">${why}</p>
    <div class="routine-list">${Object.entries(ROUTINES).map(([id, r]) => {
      const m = Math.round(routineSec(routineSteps(id)) / 60), done = (doc.routines ?? []).some(x => x.id === id && x.date === today);
      return `<a class="routine-pick${id === pick ? ' pick' : ''}" href="#routine/${id}">
        <span><b>${r.name}</b><small>${m} min${done ? ' · done today ✓' : id === 'strength' ? ` · ${str}/2 this week` : ''}</small></span><span aria-hidden="true">▶</span></a>`;
    }).join('')}</div></div>`;
}

const RING_R = 54, RING_C = 2 * Math.PI * RING_R;
function renderRoutine(rid){
  const page = $('#page-routine'), r = ROUTINES[rid];
  if (!r){ location.hash = 'today'; return; }
  if (RP.rid === rid && RP.phase !== 'idle' && RP.phase !== 'done'){ paintPlayer(true); return; }
  const steps = routineSteps(rid), total = routineSec(steps);
  if (RP.rid === rid && RP.phase === 'done'){
    page.innerHTML = band({ eyebrow:`${r.name} · done`, title:'Nice <em>work</em>', sub:`${fmtDur((Date.now() - RP.started) / 1000)} well spent. It’s ticked off on Today.`,
      extra:`<div class="btn-row"><a class="btn primary" href="#today">Back to Today</a><button class="btn" data-routine-start="${rid}">Do it again</button></div>` }) + `<div class="wrap">${routineCard()}</div>`;
    return;
  }
  const ids = [...new Set(steps.map(s => s.id))].filter(id => !MOVES[id].rest);
  const longer = ids.filter(id => steps.find(s => s.id === id).extra);
  page.innerHTML = band({
    eyebrow:`Routine · ${Math.round(total / 60)} minutes`, title:r.title, sub:r.sub,
    stats:[['Moves', ids.length], ['Minutes', Math.round(total / 60)]],
    extra:`<div class="btn-row"><button class="btn primary big" data-routine-start="${rid}">▶ Start</button>
      <button class="btn" data-action="toggle-sound" aria-pressed="${soundOn()}">${soundOn() ? 'Sound on' : 'Sound off'}</button></div>`,
  }) + `<div class="wrap">
    ${longer.length ? `<div class="note" style="margin-bottom:16px">${WARN_SVG}<div><b>Longer holds today.</b> You logged ${[...new Set(longer.map(id => /calf/.test(id) ? 'sore calves' : 'a tight hip'))].join(' and ')} in the last few days, so ${longer.length > 1 ? 'these stretches get' : `the ${MOVES[longer[0]].name.toLowerCase()} gets`} an extra 15 seconds a side.</div></div>` : ''}
    <div class="move-grid">${ids.map(id => { const m = MOVES[id], s = steps.find(x => x.id === id);
      return `<div class="card move-card">${figure(m, { size:96, still:true })}<div><b>${m.name}</b><div class="card-sub">${s.sec} sec${m.sides ? ' each side' : ''}${m.hold ? ' · hold' : ''}</div><p>${esc(m.cue)}</p></div></div>`; }).join('')}</div>
    <p class="card-sub" style="margin-top:14px">Keep your phone where you can see it — the screen stays on, and a beep marks each change. Stretch to mild tension, never pain.</p>
  </div>`;
}
// Full repaint on a new step; otherwise only the clock moves, so the figure's animation isn't restarted.
function paintPlayer(full){
  const page = $('#page-routine');
  if (!location.hash.startsWith('#routine') || RP.phase === 'idle' || RP.phase === 'done') return;
  const s = RP.steps[RP.i], m = MOVES[s.id], next = RP.steps[RP.i + 1];
  const left = RP.paused ? RP.left : RP.endAt - Date.now(), secLeft = Math.max(0, Math.ceil(left / 1000));
  const span = (RP.phase === 'prep' ? s.prep : s.sec) * 1000, frac = Math.max(0, Math.min(1, left / span));
  if (full){
    const label = RP.phase === 'prep' ? (s.prep === SWITCH_SEC ? 'Switch sides' : 'Get ready') : m.rest ? 'Rest' : m.hold ? 'Hold' : 'Go';
    page.innerHTML = `<div class="wrap player">
      <div class="player-top"><button class="btn small" data-action="routine-exit">✕ End</button>
        <span class="card-sub num">${RP.i + 1} / ${RP.steps.length}</span>
        <button class="btn small" data-action="toggle-sound" aria-pressed="${soundOn()}">${soundOn() ? 'Sound on' : 'Sound off'}</button></div>
      <div class="player-bar">${RP.steps.map((_, i) => `<i class="${i < RP.i ? 'done' : i === RP.i ? 'now' : ''}"></i>`).join('')}</div>
      <div class="player-main">
        <div class="player-fig">${figure(m, { size:260 })}</div>
        <div class="player-info">
          <div class="eyebrow ${RP.phase === 'prep' ? 'prep' : 'go'}">${label}${s.side ? ` · ${s.side} side` : ''}</div>
          <h1 class="display player-name">${m.name}</h1>
          <p class="player-cue">${esc(m.cue)}</p>
          <div class="ring-wrap"><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="${RING_R}" class="ring-bg"/>
            <circle cx="60" cy="60" r="${RING_R}" class="ring-fg ${RP.phase}" id="ring-fg" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C * (1 - frac)}"/></svg>
            <div class="ring-num display num" id="ring-num">${secLeft}</div></div>
          <div class="btn-row player-ctl">
            <button class="btn" data-action="routine-prev" ${RP.i === 0 ? 'disabled' : ''} aria-label="Previous">◀</button>
            <button class="btn primary big" data-action="routine-pause">${RP.paused ? '▶ Resume' : '❚❚ Pause'}</button>
            <button class="btn" data-action="routine-next" aria-label="Skip">▶▶</button>
          </div>
          <p class="card-sub">${next ? `Next: ${MOVES[next.id].name}${next.side ? ` · ${next.side.toLowerCase()} side` : ''}` : 'Last one!'}</p>

}

/* ═══ PLAN ═══════════════════════════════════════════════════════════ */

  }

  } : {
    eyebrow: `${esc(plan.name)} · three runs a week, rest day between`,
    title: pw > len ? 'Plan <em>done</em>' : `Week <em>${pw}</em>`,
    sub: `Goal: ${esc(plan.goal)}. Each week unlocks the next.`,
    stats: [['Plan length', len, 'wks'], ['Started', fmtDate(doc.planStart).slice(4)], ['Phase', esc(planWeekObj(pw).phase)]],
    extra: `<div class="btn-row"><a class="btn small" href="#welcome" style="text-decoration:none">Change plan</a><a class="btn small" href="#intake" style="text-decoration:none">${doc.intake ? 'Retake the intake' : 'Tailor Stride to you'}</a></div>`,
  }) + `<div class="wrap"><div class="grid today-grid">

          <div class="wk display num">${w}</div>

          <div class="p-s" style="max-width:240px">${esc(p.add)}</div>

          ${past.length ? `<ul class="hist">${past.map((w, i) => `<li>
            <span><b>${fmtDate(w.start).slice(4)} – ${fmtDate(w.end).slice(4)}</b> · week ${Math.min(w.planWeek, len)} · ${w.runs.length} run${w.runs.length === 1 ? '' : 's'}</span>

        </div>`}
      </div>

}

/* ═══ INTAKE: the questions a coach would ask before writing a plan ═════
   The answers pick the plan and the week to start it at, and decide which
   stretches, check-in options and routines Stride leans on (focus()). */
const INTAKE_Q = [
  { id:'goal', q:'What are you here <em>for</em>?', sub:'You can change plans any time.', opts:[
    ['start', 'New to running', 'Build up from walking to running'], ['comeback', 'Coming back after a break', 'You’ve run before and want to rebuild'],
    ['5k', 'Run a 5K', 'Run 3.1 miles without stopping, then race it'], ['race', 'Train for a race', 'A half or full marathon with a date'],
    ['track', 'Just track my runs', 'No plan: log, chart and compare'] ] },
  { id:'canRun', q:'How long can you run <em>non-stop?</em>', sub:'Right now, at an easy pace. Be honest; starting too high is how injuries start.', opts:[
    ['0', 'Under 5 minutes'], ['5', '5–15 minutes'], ['15', '15–30 minutes'], ['30', '30+ minutes'] ] },
  { id:'days', q:'How many days a week <em>can you run?</em>', sub:'Realistically, most weeks.', opts:[['2', '2 days'], ['3', '3 days'], ['4', '4 days'], ['5', '5 days']] },
  { id:'niggles', many:true, q:'Anything that <em>niggles?</em>', sub:'Past injuries or spots that get tight or sore. Pick all that apply.', opts:[
    ['calves', 'Calves'], ['achilles', 'Achilles'], ['shins', 'Shins'], ['knees', 'Knees'], ['hips', 'Hips'], ['back', 'Lower back'], ['none', 'Nothing'] ] },
  { id:'sits', q:'Do you sit <em>most of the day?</em>', sub:'Desk, car, couch: long sitting tightens the hips.', opts:[['yes', 'Yes, most of the day'], ['no', 'No, I’m up and about']] },
  { id:'about', q:'A little <em>about you</em>', sub:'For your heart-rate zones and the standards for your age. Skip if you’d rather.', about:true },
];
const intakeUi = { step:0, a:null };
function intakeAnswers(){
  if (intakeUi.a) return intakeUi.a;
  const i = doc.intake ?? {}, p = doc.profile;
  return intakeUi.a = { goal:i.goal ?? null, canRun:i.canRun ?? null, days:i.days ?? null, niggles:[...(i.niggles ?? [])], sits:i.sits ?? null,
    sex:p.sex ?? '', born:p.birthYear ?? '', ft:p.heightIn ? Math.floor(p.heightIn / 12) : '', inch:p.heightIn ? p.heightIn % 12 : '', lbs:currentWeight() ?? '' };
}
// Which plan, and where in it to start, from the goal and what you can run now.
function intakePlan(a){
  const c = +a.canRun;
  if (a.goal === 'track') return { plan:'track', week:1, why:'You’ll get the log, charts and trends without weekly assignments.' };
  if (a.goal === 'race') return { plan:'marathon', week:1, why:c < 15 ? 'A race plan from here is a big jump: the long runs will be capped to what you can actually do, and you’ll see straight away if the date is too soon.' : 'Built backward from your race date, from what you can run now.' };
  if (a.goal === '5k' && c < 15) return { plan:'build', week:c >= 5 ? 3 : 1, why:'Build to 20 minutes of easy running first; the 5K plan starts from there.' };
  if (c >= 30) return { plan:'5k', week:3, why:'You can already run 30 minutes, so you skip the base weeks and start building.' };
  if (c >= 15) return { plan:'5k', week:1, why:'You can run 15–30 minutes, so you start the 5K build from week 1.' };
  return { plan:'build', week:c >= 5 ? 3 : 1, why:c >= 5 ? 'You can already run 5–15 minutes, so you skip the first two weeks.' : 'Starting with run/walk: short jogs, walk breaks, three times a week.' };
}
// What to look after. Before someone has an intake, Stride keeps its old defaults.
function focus(){
  const i = doc.intake;

  const n = i.niggles ?? [];
  return { hips:n.includes('hips') || i.sits === 'yes', knees:n.includes('knees'), calves:n.some(x => ['calves', 'achilles'].includes(x)), back:n.includes('back'), shins:n.includes('shins') };
}
function focusLines(f){
  return [
    f.hips && ['Hip flexor stretches', doc.intake?.sits === 'yes' ? 'you sit most of the day' : 'you flagged your hips'],
    f.calves && ['Extra calf and Achilles care', 'you flagged calves or Achilles'],
    f.knees && ['Glute strength', 'strong glutes take load off the knees'],
    f.shins && ['Toe raises for the shins', 'you flagged shins'],
    f.back && ['Back mobility', 'you flagged your lower back'],
  ].filter(Boolean);
}

}
function renderIntakeResult(){

    extra:`<div class="intake-bar">${INTAKE_Q.map(() => '<i class="done"></i>').join('')}</div>` }) + `<div class="wrap intake">
    <div class="grid two" style="align-items:start">

      <a class="link-btn" href="#welcome" data-action="intake-manual">Pick a different plan</a>
    </div>
  </div>`;
}
// Save what the intake learned: answers, profile, and zones from age if none yet.
async function intakeSave(){
  const a = intakeAnswers(), p = doc.profile;
  doc.intake = { goal:a.goal, canRun:a.canRun, days:a.days, niggles:a.niggles.filter(x => x !== 'none'), sits:a.sits, at:todayYmd() };
  if (a.sex) p.sex = a.sex;
  const yr = new Date().getFullYear(); if (+a.born > yr - 100 && +a.born < yr - 8) p.birthYear = +a.born;
  const h = Math.round((+a.ft || 0) * 12 + (+a.inch || 0)); if (h >= 48 && h <= 90) p.heightIn = h;
  const lbs = +a.lbs; if (lbs > 50 && lbs < 600 && lbs !== currentWeight()) p.weights = [...p.weights.filter(w => w.date !== todayYmd()), { date:todayYmd(), lbs }].sort((x, y) => x.date < y.date ? -1 : 1);

function intakeRead(){
  const a = intakeAnswers(), v = id => $('#' + id)?.value ?? '';
  if ($('#in-sex')) Object.assign(a, { sex:v('in-sex'), born:v('in-born'), ft:v('in-ft'), inch:v('in-in'), lbs:v('in-lbs') });
