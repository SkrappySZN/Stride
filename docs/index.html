<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Running tracker: FIT upload, test-route trends and the 8-week build.">
<title>Stride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ───────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;

  --bg:#eef0ea;
  --surface:#ffffff;
  --surface-2:#f5f6f2;
  --ink:#0c0d0e;
  --ink-2:#4a4d52;
  --muted:#7c8087;
  --line:#e2e4de;
  --grid:#e8e9e4;
  --axis:#c5c8c0;

  --accent:#d4ff3a;          /* brand volt — fills only, never text on light */
  --accent-ink:#0c0d0e;      /* text that sits on the volt fill */
  --accent-text:#4b6a00;     /* volt-family text that reads on the surface */

  --series-1:#2a78d6;
  --series-1-wash:rgba(42,120,214,.08);
  --walk:#bfc2ba;

  --good:#0ca30c;  --good-text:#006300;
  --warn:#fab219;  --warn-text:#8a5a00;
  --crit:#d03b3b;  --crit-text:#b02a2a;

  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 0 rgba(12,13,14,.04), 0 1px 3px rgba(12,13,14,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a0b0d; --surface:#14161a; --surface-2:#1b1e22;
    --ink:#f3f4f0; --ink-2:#b8bbb3; --muted:#7f838a;
    --line:#24272c; --grid:#22252a; --axis:#393d43;
    --accent-text:#d4ff3a;
    --series-1:#3987e5; --series-1-wash:rgba(57,135,229,.10);
    --walk:#4a4e55;
    --good-text:#3fcf3f; --warn-text:#fab219; --crit-text:#ff7a7a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0b0d; --surface:#14161a; --surface-2:#1b1e22;
  --ink:#f3f4f0; --ink-2:#b8bbb3; --muted:#7f838a;
  --line:#24272c; --grid:#22252a; --axis:#393d43;
  --accent-text:#d4ff3a;
  --series-1:#3987e5; --series-1-wash:rgba(57,135,229,.10);
  --walk:#4a4e55;
  --good-text:#3fcf3f; --warn-text:#fab219; --crit-text:#ff7a7a;
  --shadow:none;
}

/* ── Base ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.display{
  font-stretch:72%; font-weight:850; font-style:italic;
  letter-spacing:-.01em; text-transform:uppercase; line-height:.95;
}
.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted);
}
.num{font-variant-numeric:tabular-nums}

/* ── Shell ────────────────────────────────────────────────────────── */
.shell{display:grid; grid-template-columns:220px 1fr; min-height:100vh}
.rail{
  position:sticky; top:0; height:100vh;
  padding:22px 14px; display:flex; flex-direction:column; gap:4px;
  border-right:1px solid var(--line); background:var(--surface);
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px 22px}
.brand-mark{
  width:30px; height:30px; border-radius:8px; background:var(--accent);
  display:grid; place-items:center;
}
.brand-name{font-size:24px}
.nav-btn{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:10px 12px; border:0; border-radius:10px; background:none;
  font-weight:600; color:var(--ink-2); cursor:pointer; text-align:left;
}
.nav-btn:hover{background:var(--surface-2); color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--ink); color:var(--surface)}
.nav-btn[aria-current="page"] svg{color:var(--accent)}
:root[data-theme="dark"] .nav-btn[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
:root[data-theme="dark"] .nav-btn[aria-current="page"] svg{color:var(--accent-ink)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .nav-btn[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
  :root:not([data-theme="light"]) .nav-btn[aria-current="page"] svg{color:var(--accent-ink)}
}
.nav-btn[disabled]{opacity:.45; cursor:default}
.nav-btn[disabled]:hover{background:none; color:var(--ink-2)}
.nav-btn .soon{margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--muted)}
.nav-btn svg{width:18px; height:18px; flex:none}
.rail-foot{margin-top:auto; padding:8px; display:flex; flex-direction:column; gap:10px}
.theme-btn{
  border:1px solid var(--line); background:var(--surface-2); border-radius:10px;
  padding:8px 10px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-2);
}
.mock-note{font-size:12px; color:var(--muted); line-height:1.4}
#syncbox{display:flex; flex-direction:column; gap:6px}
#syncbox .mock-note{overflow-wrap:anywhere}
.sync-line{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:650; color:var(--ink-2)}
.sync-line .dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--good)}
.sync-busy .dot,.sync-signedout .dot,.sync-off .dot{background:none; box-shadow:0 0 0 1.5px var(--muted) inset}
.sync-error,.sync-conflict{color:var(--crit-text)}
.sync-error .dot,.sync-conflict .dot{background:var(--crit)}
dialog#choose{
  max-width:min(440px, calc(100vw - 32px)); padding:24px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); color:var(--ink); box-shadow:0 12px 40px rgba(0,0,0,.25)
}
dialog#choose::backdrop{background:rgba(10,11,13,.55)}
dialog#choose h2{font-size:32px; margin:0 0 10px}
dialog#choose p{margin:0 0 18px; color:var(--ink-2); font-size:14.5px}

main{padding:30px 36px 80px; max-width:1180px; width:100%; min-width:0}
.page{display:none}
.page.active{display:block}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap}
.page-head h1{margin:6px 0 0; font-size:52px}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--ink-2);
}
.chip .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}

/* ── Cards ────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow); min-width:0;
}
.card h2{margin:0; font-size:15px; font-weight:750}
.card-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; margin-bottom:14px; flex-wrap:wrap}
.card-sub{color:var(--muted); font-size:13px}
.grid{display:grid; gap:16px}
.today-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); align-items:start}
.col{display:grid; gap:16px; min-width:0}

/* hero assignment */
.hero{
  position:relative; overflow:hidden; padding:26px 24px 22px;
  background:var(--ink); color:var(--surface); border:0;
}
:root[data-theme="dark"] .hero{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hero{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)} }
.hero .eyebrow{color:var(--accent)}
.hero-title{font-size:68px; margin:10px 0 12px}
.hero-title em{font-style:inherit; color:var(--accent)}
.hero p{margin:0; max-width:52ch; opacity:.82}
.hero-stripes{
  position:absolute; right:-40px; top:-20px; width:260px; height:200px; opacity:.12;
  background:repeating-linear-gradient(115deg, var(--accent) 0 14px, transparent 14px 34px);
  pointer-events:none;
}
.task-list{list-style:none; margin:18px 0 0; padding:0; display:grid; gap:8px}
.task{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:11px 12px; border-radius:10px; cursor:pointer;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
}
.card:not(.hero) .task{background:var(--surface-2); border:1px solid var(--line)}
.task .box{
  width:22px; height:22px; flex:none; border-radius:7px; border:2px solid currentColor; opacity:.55;
  display:grid; place-items:center;
}
.task .box svg{width:14px; height:14px; opacity:0}
.task[aria-pressed="true"] .box{background:var(--accent); border-color:var(--accent); opacity:1; color:var(--accent-ink)}
.task[aria-pressed="true"] .box svg{opacity:1}
.task[aria-pressed="true"] .t-main{text-decoration:line-through; opacity:.55}
.t-main{font-weight:600}
.t-sub{font-size:12.5px; opacity:.65}
.task .t-meta{margin-left:auto; font-size:12px; opacity:.6; white-space:nowrap}

/* check-in */
.pill-row{display:flex; flex-wrap:wrap; gap:8px}
.pill{
  padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
  font-weight:600; cursor:pointer; font-size:14px;
}
.pill:hover{border-color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.pill.flag{border-style:dashed}
.response{margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--surface-2); font-size:14px; display:none}
.response.show{display:block}
.response.alarm{background:color-mix(in srgb, var(--crit) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--crit) 40%, transparent)}

/* status rows */
.status-list{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.status-row{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line)}
.status-row:first-child{border-top:0}
.s-icon{width:22px; height:22px; flex:none; border-radius:50%; display:grid; place-items:center; margin-top:1px}
.s-icon svg{width:13px; height:13px}
.s-good{background:var(--good); color:#fff}
.s-warn{background:var(--warn); color:#1a1300}
.s-crit{background:var(--crit); color:#fff}
.s-wait{background:var(--surface-2); color:var(--muted); border:1.5px dashed var(--axis)}
.s-main{font-weight:600}
.s-sub{font-size:13px; color:var(--muted)}
.verdict{margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--surface-2); display:flex; gap:10px; align-items:center; font-size:14px}
.verdict strong{font-weight:750}

/* week strip */
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.day{
  border-radius:10px; padding:9px 4px 10px; text-align:center; background:var(--surface-2);
  border:1px solid var(--line); min-width:0;
}
.day .d-name{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase}
.day .d-num{font-size:20px; font-weight:800; font-stretch:75%; margin:2px 0 6px}
.day .d-tag{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 0; border-radius:6px}
.day.today{outline:2px solid var(--ink); outline-offset:-1px}
.tag-run{background:var(--accent); color:var(--accent-ink)}
.tag-ref{background:var(--ink); color:var(--surface)}
.tag-rest{color:var(--muted)}
.tag-done{color:var(--accent-text)}

.plan-bar{display:grid; grid-template-columns:repeat(8,1fr); gap:4px; margin-top:6px}
.plan-seg{height:8px; border-radius:4px; background:var(--grid)}
.plan-seg.done{background:var(--ink)}
.plan-seg.now{background:var(--accent); box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.plan-labels{display:grid; grid-template-columns:repeat(8,1fr); gap:4px; margin-top:6px; font-size:11px; color:var(--muted); text-align:center}

.note{
  display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:var(--radius);
  background:color-mix(in srgb, var(--warn) 14%, var(--surface)); border:1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  font-size:14px;
}
.note b{font-weight:700}

details.protocol summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.protocol summary::-webkit-details-marker{display:none}
details.protocol summary .caret{transition:transform .15s; color:var(--muted)}
details.protocol[open] summary .caret{transform:rotate(180deg)}
.next-run-big{font-size:40px; margin:6px 0 4px}
.kv{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:10px}
.kv div{font-size:13px; color:var(--muted)}
.kv b{display:block; font-size:17px; color:var(--ink); font-weight:750}
.switch{display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600; font-size:14px; user-select:none}
.switch input{appearance:none; width:40px; height:24px; border-radius:999px; background:var(--axis); position:relative; cursor:pointer; margin:0; transition:background .15s}
.switch input::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(16px); background:var(--accent)}

/* ── Progress ─────────────────────────────────────────────────────── */
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .k-val{font-size:64px; margin:14px 0 2px; display:flex; align-items:baseline; gap:8px}
.kpi .k-unit{font-size:18px; font-style:normal; font-weight:700; color:var(--muted); font-stretch:90%; text-transform:none}
.kpi .k-dir{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.kpi .k-foot{margin-top:12px; font-size:13px; color:var(--muted)}
.kpi .k-foot b{color:var(--ink); font-weight:650}
.te-strip{display:flex; gap:6px; margin-top:10px}
.te-cell{flex:1; border-radius:8px; padding:7px 8px; background:var(--surface-2); border:1px solid var(--line); font-size:12px; color:var(--muted)}
.te-cell b{display:flex; align-items:center; gap:5px; font-size:16px; color:var(--ink)}
.te-cell i{width:9px; height:9px; border-radius:50%; display:inline-block}

.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.chart{width:100%; position:relative}
.chart svg{display:block; width:100%; overflow:visible}
.chart text{font-family:var(--font); font-size:11px; fill:var(--muted)}
.chart .lbl{fill:var(--ink); font-weight:700; font-size:12px; paint-order:stroke; stroke:var(--surface); stroke-width:4px; stroke-linejoin:round}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); margin-bottom:10px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
.legend i.ring{border-radius:50%; border:2px solid var(--muted); background:var(--surface)}
.legend i.dotf{border-radius:50%}
.pending-box{
  height:170px; border-radius:10px; border:1.5px dashed var(--axis); display:grid; place-items:center;
  text-align:center; color:var(--muted); font-size:13.5px; padding:16px;
}
table.quiet{width:100%; border-collapse:collapse; font-size:13.5px}
table.quiet td{padding:9px 0; border-top:1px solid var(--line)}
table.quiet td:nth-child(2){text-align:right; font-weight:650; font-variant-numeric:tabular-nums}
table.quiet td:nth-child(3){padding-left:18px; color:var(--muted); font-size:12.5px}
details.stored summary{cursor:pointer; font-weight:700; list-style:none; display:flex; justify-content:space-between}
details.stored summary::-webkit-details-marker{display:none}

#tip{
  position:fixed; z-index:50; pointer-events:none; opacity:0; transition:opacity .08s;
  background:var(--ink); color:var(--surface); padding:8px 10px; border-radius:8px;
  font-size:12.5px; line-height:1.35; max-width:240px; box-shadow:0 6px 20px rgba(0,0,0,.2);
}
#tip b{font-weight:750}
#tip.show{opacity:1}

/* ── Mobile ───────────────────────────────────────────────────────── */
@media (max-width:900px){
  .today-grid,.two{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .days{gap:4px}
  .day .d-tag{font-size:9.5px}
  .task .t-meta{display:none}
  .rail{
    position:fixed; top:auto; bottom:0; left:0; right:0; height:auto; z-index:20;
    flex-direction:row; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); gap:2px;
    border-right:0; border-top:1px solid var(--line); justify-content:space-around;
  }
  .brand,.rail-foot,.nav-btn .soon,.nav-btn[data-optional]{display:none}
  .nav-btn{flex-direction:column; gap:3px; font-size:11px; padding:7px 4px; align-items:center; text-align:center}
  main{padding:18px 16px 110px}
  .page-head h1{font-size:40px}
  .hero-title{font-size:52px}
  .kpi .k-val{font-size:54px}
  .mobile-theme{display:inline-flex !important}
}
.mobile-theme{display:none}

/* ── App additions ────────────────────────────────────────────────── */
:root{
  --z-easy:#86b6ef; --z-mod:#2a78d6; --z-hard:#184f95; --z-above:#d03b3b;
}
:root[data-theme="dark"]{ --z-easy:#1c5cab; --z-mod:#3987e5; --z-hard:#86b6ef; --z-above:#e66767 }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --z-easy:#1c5cab; --z-mod:#3987e5; --z-hard:#86b6ef; --z-above:#e66767 }
}
a{color:inherit}
.link-btn{border:0; background:none; padding:0; cursor:pointer; font-weight:650; color:var(--ink-2); text-decoration:underline; text-underline-offset:3px}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface-2); font-weight:650; cursor:pointer; font-size:14px;
}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.danger{color:var(--crit-text)}
.btn.small{padding:6px 11px; font-size:13px}
.btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.empty{padding:28px; text-align:center; color:var(--muted); border:1.5px dashed var(--axis); border-radius:var(--radius)}
.empty b{color:var(--ink)}

/* runs table */
.table-wrap{overflow-x:auto; margin:0 -20px; padding:0 20px}
table.runs{width:100%; border-collapse:collapse; font-size:14px; min-width:720px}
table.runs th{
  text-align:right; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); padding:0 10px 10px; white-space:nowrap
}
table.runs th:first-child, table.runs td:first-child{text-align:left; padding-left:0}
table.runs td{padding:12px 10px; border-top:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
table.runs tbody tr{cursor:pointer}
table.runs tbody tr:hover td{background:var(--surface-2)}
.r-date{font-weight:700}
.r-sub{font-size:12px; color:var(--muted); font-weight:500}
.badge{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.04em;
  padding:3px 8px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); white-space:nowrap
}
.badge.test{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.badge.warn{color:var(--warn-text); border-color:color-mix(in srgb, var(--warn) 50%, transparent)}
.badge.crit{color:var(--crit-text); border-color:color-mix(in srgb, var(--crit) 50%, transparent)}
.flags{display:inline-flex; gap:4px}
.flag-dot{width:8px; height:8px; border-radius:50%}

/* run detail */
.detail-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.detail-head h1{font-size:56px; margin:6px 0 8px}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.stat{padding:14px 16px; box-shadow:1px 0 0 var(--line), 0 1px 0 var(--line)}
.stat .s-l{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.stat .s-v{font-size:26px; font-weight:800; font-stretch:78%; margin-top:4px; font-variant-numeric:tabular-nums}
.stat .s-v small{font-size:13px; font-weight:600; color:var(--muted); font-stretch:100%; margin-left:3px}
.stat .s-n{font-size:12px; color:var(--muted); margin-top:2px}
.stat input{
  width:90px; font:inherit; font-size:22px; font-weight:800; font-stretch:78%; padding:2px 6px; margin-top:4px;
  border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink)
}
.zone-bar{display:flex; gap:2px; height:14px; border-radius:5px; overflow:hidden; margin:10px 0 12px}
.zone-bar div{height:100%}
.zone-legend{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; font-size:12.5px}
.zone-legend b{display:block; font-size:16px; font-variant-numeric:tabular-nums}
.zone-legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.state-strip{display:flex; height:8px; border-radius:4px; overflow:hidden; gap:0}
textarea.felt{
  width:100%; min-height:84px; font:inherit; font-size:14px; padding:10px 12px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink); resize:vertical
}
.route-svg{width:100%; height:180px; display:block}
.confirm{display:none; gap:8px; align-items:center; font-size:13.5px}
.confirm.show{display:inline-flex}

/* upload */
.drop{
  border:2px dashed var(--axis); border-radius:18px; padding:48px 20px; text-align:center; cursor:pointer;
  background:var(--surface); transition:border-color .15s, background .15s;
}
.drop:hover,.drop.over{border-color:var(--ink); background:var(--surface-2)}
.drop .display{font-size:40px; margin:10px 0 6px}
.drop-icon{width:52px; height:52px; border-radius:14px; background:var(--accent); display:inline-grid; place-items:center}
.log{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:8px}
.log li{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:10px; background:var(--surface); border:1px solid var(--line); font-size:14px}
.log .s-icon{margin-top:0}
.how{counter-reset:how; list-style:none; padding:0; margin:0; display:grid; gap:12px}
.how li{counter-increment:how; display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:14px}
.how li::before{
  content:counter(how); width:24px; height:24px; border-radius:7px; background:var(--surface-2); border:1px solid var(--line);
  display:grid; place-items:center; font-weight:800; font-size:12px
}
.how b{display:block}
.field-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px; letter-spacing:.04em}
.field input{
  width:100%; font:inherit; font-size:15px; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-variant-numeric:tabular-nums
}

/* plan */
.plan-list{display:grid; gap:10px}
.plan-row{display:grid; grid-template-columns:64px 1fr auto; gap:16px; align-items:center; padding:14px 16px; border-radius:12px; background:var(--surface); border:1px solid var(--line)}
.plan-row.now{outline:2px solid var(--ink); outline-offset:-1px}
.plan-row .wk{font-size:34px}
.plan-row .p-t{font-weight:750}
.plan-row .p-s{font-size:13px; color:var(--muted)}
.hist{list-style:none; padding:0; margin:0}
.hist li{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; flex-wrap:wrap}
.hist li:first-child{border-top:0}
.rules{margin:0; padding-left:18px; display:grid; gap:8px; font-size:14px}

.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); opacity:0; z-index:60;
  background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-weight:600; font-size:14px;
  transition:opacity .2s, transform .2s; pointer-events:none
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (max-width:720px){
  .toast{bottom:92px}
  .detail-head h1{font-size:44px}
  .zone-legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan-row{grid-template-columns:48px 1fr}
  .plan-row > :last-child{grid-column:1 / -1}
}
</style>
</head>
<body>

<dialog id="choose"></dialog>

<div class="shell">
  <nav class="rail" aria-label="Sections">

      <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0c0d0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg></div>

    </div>

    <button class="nav-btn" data-page="progress">

    <button class="nav-btn" data-page="runs">

    <button class="nav-btn" data-page="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
    <button class="nav-btn" disabled data-optional>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Body<span class="soon">SOON</span></button>
    <button class="nav-btn" data-page="upload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Upload</button>

  <main>

    <section class="page" id="page-progress"></section>

    <section class="page" id="page-plan"></section>
    <section class="page" id="page-upload"></section>
  </main>

<script type="module">
/* ═══════════════════════════════════════════════════════════════════
   STRIDE — running tracker
   One file. Runs, check-ins and settings live in this browser's
   IndexedDB; FIT files are parsed in the page and never uploaded.
   ═══════════════════════════════════════════════════════════════════ */

const FITSDK_URL = 'https://cdn.jsdelivr.net/npm/@garmin/fitsdk@21.217.0/+esm';
const JSZIP_URL  = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

/* ── The 8-week build ─────────────────────────────────────────────── */
const PLAN = [
  { w:1, phase:'Base',      session:'9–10 min jog',       detail:'Flat route, walk breaks as needed',                       add:'Nothing — just no calf pain the next day' },
  { w:2, phase:'Base',      session:'9–10 min jog',       detail:'Flat route, walk breaks as needed',                       add:'Nothing — just no calf pain the next day' },
  { w:3, phase:'Full mile', session:'Full mile',          detail:'Same route, work toward the full mile continuous',        add:'4 × 20 sec strides after one run', strides:1 },
  { w:4, phase:'Full mile', session:'Full mile',          detail:'Same route, work toward the full mile continuous',        add:'4 × 20 sec strides after one run', strides:1 },
  { w:5, phase:'Extend',    session:'1.25–1.5 mi easy',   detail:'Same easy pace. Keep one run a week on the test route',   add:'Strides after two runs a week', strides:2 },
  { w:6, phase:'Extend',    session:'1.25–1.5 mi easy',   detail:'Same easy pace. Keep one run a week on the test route',   add:'Strides after two runs a week', strides:2 },
  { w:7, phase:'Speed',     session:'1.5 mi easy',        detail:'Two easy runs at 1.5 mi, one speed run',                  add:'Speed run: warm up, 4 × 2 min harder / 2 min walk, cool down', speed:true },
  { w:8, phase:'Speed',     session:'1.5 mi easy',        detail:'Two easy runs at 1.5 mi, one speed run',                  add:'Speed run: warm up, 4 × 2 min harder / 2 min walk, cool down', speed:true },
];

const PROTOCOL = p => [
  ['p1','Start where the test route starts','Not from home if there’s a hill on the way — a climb contaminates every average'],
  ['p2','Warm up','5 min brisk walk, then 10 leg swings per side'],
  ['p3','Run the flat test route',`Under ~50 ft total gain. Walk break if HR passes ~${p.zones.mod}`],
  ['p4','Stop the timer at the finish','Don’t hit Save yet'],
  ['p5','Stand still for 2 minutes','This is how the watch captures recovery HR'],
  ['p6','Save, then walk home','That’s the cooldown'],
];

const TASKS = {
  hip:    ['Half-kneeling hip flexor stretch','Back knee down, squeeze the glute, tuck the hips · 30–45 sec','2–3× / side'],
  calf:   ['Calf stretch — straight leg, then bent','30 sec each, against the wall','2× / side'],
  roll:   ['Foam roll or tennis ball the calves','','~5 min'],
  bridge: ['Glute bridges','Takes load off the hip flexors and knees','2–3 × 12–15'],
  sporthip: ['Hip flexor stretch between sessions','Most sports work them hard','each break'],
};

/* SEED:START — empty in the published copy. */
const SEED = {};
/* SEED:END */

// ==ANALYZE:START== pure helpers + FIT analysis (no DOM) ───────────────
const MI = 1609.344, FT = 3.28084;
const IDLE_TOLERANCE = 20;   // seconds of standing still before a run is flagged
const RUN_CADENCE = 125;     // spm — at or above is jogging, below is walking

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const weekStart = s => addDays(s, -((parseYmd(s).getDay() + 6) % 7));   // Monday
const fmtDur = s => { if (s == null || !isFinite(s)) return '—'; s = Math.round(s); return `${Math.floor(s/60)}:${pad(s%60)}`; };

function median(a){
  const b = a.filter(v => v != null && !Number.isNaN(v)).sort((x, y) => x - y);
  if (!b.length) return null;
  const m = b.length >> 1;
  return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2;
}
function rollMedian(arr, i, k){
  const w = [];
  for (let j = Math.max(0, i-k); j <= Math.min(arr.length-1, i+k); j++) w.push(arr[j]);
  return median(w);
}
function haversine(a, b){
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0]-a[0]) * r, dLon = (b[1]-a[1]) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*r) * Math.cos(b[0]*r) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Time in each threshold-anchored zone. Recomputed whenever the zones change,
// so every run is always measured against the same lines.
function zoneStats(s, profile){
  const { easy, mod } = profile.zones, lt = profile.lthr;
  const z = { easy:0, mod:0, hard:0, above:0 };
  let above = 0;
  for (let i = 0; i < s.t.length; i++){
    const hr = s.hr[i]; if (hr == null) continue;
    const dt = i < s.t.length-1 && s.t[i+1]-s.t[i] <= 5 ? s.t[i+1]-s.t[i] : 1;
    if (hr >= lt){ z.above += dt; above += dt; }
    else if (hr >= mod) z.hard += dt;
    else if (hr >= easy) z.mod += dt;
    else z.easy += dt;
  }
  return { aboveLtSec: above, zoneSec: z };
}

function analyzeFit(messages, profile){
  const session = messages.sessionMesgs?.[0] ?? {};
  const recs = (messages.recordMesgs ?? []).filter(r => r.timestamp);
  if (!recs.length) throw new Error('No second-by-second samples in this file');
  const sport = String(session.sport ?? messages.sportMesgs?.[0]?.sport ?? '').toLowerCase();
  const startDate = new Date(session.startTime ?? recs[0].timestamp);
  const t0 = +startDate;
  const n = recs.length;

  const T = [], HR = [], SPD = [], CAD = [], PWR = [], ALT = [], DIST = [], GCT = [], LAT = [], LON = [];
  for (const r of recs){
    T.push(Math.round((+new Date(r.timestamp) - t0) / 1000));
    HR.push(r.heartRate ?? null);
    SPD.push(r.enhancedSpeed ?? r.speed ?? null);
    CAD.push(r.cadence != null ? (r.cadence + (r.fractionalCadence || 0)) * 2 : null);   // strides → steps
    PWR.push(r.power ?? null);
    ALT.push(r.enhancedAltitude ?? r.altitude ?? null);
    DIST.push(r.distance ?? null);
    GCT.push(r.stanceTime ?? null);
    LAT.push(r.positionLat != null ? r.positionLat * 180 / 2**31 : null);
    LON.push(r.positionLong != null ? r.positionLong * 180 / 2**31 : null);
  }

  // Single-sample sensor glitches: drop anything far from its neighbours.
  const filtered = { hr:0, cad:0, gct:0 };
  const HRf = HR.map((v, i) => {
    if (v == null) return null;
    const m = rollMedian(HR, i, 3);
    if (v < 40 || v > 230 || (m != null && Math.abs(v - m) > 25)){ filtered.hr++; return null; }
    return v;
  });
  const CADf = CAD.map((v, i) => {
    if (v == null) return null;
    const m = rollMedian(CAD, i, 2);
    if (v > 200 || (m != null && v - m > 40)){ filtered.cad++; return null; }
    return v;
  });
  const GCTf = GCT.map((v, i) => {
    if (v == null) return null;
    const m = rollMedian(GCT, i, 4);
    if (v < 150 || v > 500 || (m != null && Math.abs(v - m) > 70)){ filtered.gct++; return null; }
    return v;
  });
  const SPDf = SPD.map(v => v == null || v > 7 ? null : v);
  const DT = T.map((t, i) => i < n-1 && T[i+1] - t <= 5 ? T[i+1] - t : 1);   // gaps are timer pauses

  // Run / walk / idle, from smoothed cadence and speed.
  let ST = T.map((_, i) => {
    const c = rollMedian(CADf, i, 2), s = rollMedian(SPDf, i, 2);
    if ((s == null || s < 0.35) && (c == null || c < 40)) return 0;
    if (c != null ? c >= RUN_CADENCE : (s ?? 0) >= 1.6) return 2;
    return 1;
  });
  // Fold blips shorter than 8 s into the segment before them.
  const segs = [];
  ST.forEach((st, i) => {
    const last = segs.at(-1);
    if (last && last.st === st){ last.i1 = i; last.dur += DT[i]; }
    else segs.push({ st, i0:i, i1:i, dur:DT[i] });
  });
  for (let k = 1; k < segs.length; k++){
    if (segs[k].dur < 8){ for (let i = segs[k].i0; i <= segs[k].i1; i++) ST[i] = segs[k-1].st; segs[k].st = segs[k-1].st; }
  }
  // Garmin's own run/walk detection (rwd* splits) wins wherever it covers a sample.
  const RWD = { rwdRun:2, rwdWalk:1, rwdStand:0 };
  const rwdSplits = (messages.splitMesgs ?? []).filter(x => x.splitType in RWD && x.totalTimerTime > 0 && x.startTime);
  for (const sp of rwdSplits){
    const a = Math.round((+new Date(sp.startTime) - t0) / 1000);
    const b = Math.round((+new Date(sp.endTime ?? +new Date(sp.startTime) + sp.totalElapsedTime * 1000) - t0) / 1000);
    for (let i = 0; i < n; i++) if (T[i] >= a && T[i] <= b) ST[i] = RWD[sp.splitType];
  }
  const rwdSum = {};
  for (const x of messages.splitSummaryMesgs ?? []) if (x.splitType in RWD) rwdSum[x.splitType] = x;

  let runSec = 0, walkSec = 0, idleSec = 0, runDist = 0, hrSum = 0, hrW = 0;
  const runHr = [];
  for (let i = 0; i < n; i++){
    const dt = DT[i];
    if (ST[i] === 2){
      runSec += dt;
      if (i < n-1 && DIST[i] != null && DIST[i+1] != null && T[i+1]-T[i] <= 5) runDist += DIST[i+1] - DIST[i];
      if (HRf[i] != null){ hrSum += HRf[i] * dt; hrW += dt; runHr.push([runSec, HRf[i], dt]); }
    }
    else if (ST[i] === 1) walkSec += dt;
    else idleSec += dt;
  }
  // Cardiac drift: second half of the jogging vs the first half.
  let drift = null;
  if (runSec >= 480 && runHr.length > 20){
    const half = runSec / 2;
    const a = runHr.filter(x => x[0] <= half), b = runHr.filter(x => x[0] > half);
    const mean = xs => xs.reduce((s, x) => s + x[1]*x[2], 0) / xs.reduce((s, x) => s + x[2], 0);
    drift = Math.round((mean(b) - mean(a)) * 10) / 10;
  }

  const altOk = ALT.filter(v => v != null);
  let gainFt = session.totalAscent != null ? session.totalAscent * FT : null;
  if (gainFt == null && altOk.length){
    let g = 0, ref = altOk[0];
    for (const a of altOk){ if (a - ref > 1){ g += a - ref; ref = a; } else if (a < ref) ref = a; }
    gainFt = g * FT;
  }
  const firstLL = LAT.findIndex((v, i) => v != null && LON[i] != null);
  let lastLL = -1; for (let i = n-1; i >= 0; i--) if (LAT[i] != null && LON[i] != null){ lastLL = i; break; }
  const path = [];
  for (let i = 0; i < n; i += 5) if (LAT[i] != null && LON[i] != null) path.push([+LAT[i].toFixed(5), +LON[i].toFixed(5)]);

  if (rwdSum.rwdRun){
    runSec = rwdSum.rwdRun.totalTimerTime ?? runSec;
    if (rwdSum.rwdRun.totalDistance) runDist = rwdSum.rwdRun.totalDistance;
    if (rwdSum.rwdRun.avgHeartRate) hrSum = rwdSum.rwdRun.avgHeartRate, hrW = 1;
  }
  if (rwdSum.rwdWalk) walkSec = rwdSum.rwdWalk.totalTimerTime ?? walkSec;
  if (rwdSum.rwdStand) idleSec = rwdSum.rwdStand.totalTimerTime ?? idleSec;
  runSec = Math.round(runSec); walkSec = Math.round(walkSec); idleSec = Math.round(idleSec);

  // The watch's own local time, so the date is right wherever the file is opened.
  const act = messages.activityMesgs?.[0];
  const tzOffsetSec = act?.localTimestamp != null && act.timestamp ? Math.round(act.localTimestamp + 631065600 - +new Date(act.timestamp) / 1000) : null;
  const localDate = tzOffsetSec == null ? ymd(startDate) : new Date(t0 + tzOffsetSec * 1000).toISOString().slice(0, 10);
  // Recovery HR isn't in the public FIT profile; the FR265 writes it to session field 202.
  const recoveryHr = typeof session[202] === 'number' && session[202] > 0 ? session[202] : null;

  const lastDist = [...DIST].reverse().find(v => v != null) ?? 0;
  const distMi = (session.totalDistance ?? lastDist) / MI;
  const timerSec = session.totalTimerTime ?? T[n-1];
  const hrVals = HRf.filter(v => v != null);
  const user = messages.userProfileMesgs?.[0];
  const zt = messages.zonesTargetMesgs?.[0];

  // Garmin-only fields that aren't in the public FIT profile (recovery HR among
  // them) arrive as numbered fields. Keep them so they can be mapped later.
  const unknown = {};
  for (const [k, v] of Object.entries(session)) if (/^\d+$/.test(k) && typeof v === 'number') unknown['session.' + k] = v;

  const samples = {
    t: T, hr: HRf, st: ST, cad: CADf.map(v => v == null ? null : Math.round(v)),
    spd: SPDf.map(v => v == null ? null : Math.round(v * 100)),
    alt: ALT.map(v => v == null ? null : Math.round(v * 10)),
    dist: DIST.map(v => v == null ? null : Math.round(v)),
    gct: GCTf.map(v => v == null ? null : Math.round(v)),
    pwr: PWR, path,
  };
  const zs = zoneStats(samples, profile);

  const run = {
    id: 'g' + Math.round(t0 / 1000), source: 'fit', date: localDate, start: startDate.toISOString(), tzOffsetSec,
    sport, subSport: String(session.subSport ?? ''),
    distMi, elapsedSec: session.totalElapsedTime ?? T[n-1], timerSec,
    movingSec: runSec + walkSec, runSec, walkSec, idleSec,
    avgPaceSec: distMi > 0.05 ? timerSec / distMi : null,
    jogPaceSec: runDist > 50 ? runSec / (runDist / MI) : null,
    avgHr: session.avgHeartRate ?? (hrVals.length ? Math.round(hrVals.reduce((a, b) => a + b, 0) / hrVals.length) : null),
    maxHr: session.maxHeartRate ?? (hrVals.length ? Math.max(...hrVals) : null),
    jogHr: hrW ? Math.round(hrSum / hrW * 10) / 10 : null,
    drift, aboveLtSec: zs.aboveLtSec, zoneSec: zs.zoneSec,
    recoveryHr,
    aerobicTE: session.totalTrainingEffect ?? null,
    anaerobicTE: session.totalAnaerobicTrainingEffect ?? null,
    load: session.trainingLoadPeak != null ? Math.round(session.trainingLoadPeak) : null,
    avgPower: session.avgPower ?? null, maxPower: session.maxPower ?? null,
    weightLbs: user?.weight ? Math.round(user.weight * 2.20462 * 10) / 10 : null,
    cadence: (() => { const c = median(CADf.filter((_, i) => ST[i] === 2)); return c == null ? null : Math.round(c); })(),
    stride: session.avgStepLength ? Math.round(session.avgStepLength) / 1000 : null,
    vertRatio: session.avgVerticalRatio ?? null,
    vertOsc: session.avgVerticalOscillation != null ? Math.round(session.avgVerticalOscillation) / 10 : null,
    gct: (() => { const g = median(GCTf.filter((_, i) => ST[i] === 2)); return g == null ? (session.avgStanceTime ?? null) : Math.round(g); })(),

/* ── Storage: IndexedDB, one doc + one samples row per run ───────── */
const idb = {
  _db: null,
  open(){
    return this._db ??= new Promise((res, rej) => {
      const r = indexedDB.open('stride', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('doc'); r.result.createObjectStore('samples'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req?.result);
      t.onerror = () => rej(t.error);
    });
  },
  get(store, k){ return this.tx(store, 'readonly', s => s.get(k)); },
  put(store, k, v){ return this.tx(store, 'readwrite', s => s.put(v, k)); },
  del(store, k){ return this.tx(store, 'readwrite', s => s.delete(k)); },
  clear(store){ return this.tx(store, 'readwrite', s => s.clear()); },
  keys(store){ return this.tx(store, 'readonly', s => s.getAllKeys()); },
};

const blobOf = () => { const { sync, ...rest } = doc; return rest; };
const runCount = o => o?.runs?.length ?? 0;
const meta = (row, dirty) => ({ user_id:SESSION.user_id, email:SESSION.email, version:row?.version ?? 0, at:row?.updated_at ?? null, dirty });
// jsonb doesn't keep key order, so compare with keys sorted.
function stableStringify(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}
async function pullRow(){
  if (!await ensureToken()) return null;
  const r = await sb(`/rest/v1/stride_docs?user_id=eq.${SESSION.user_id}&select=data,version,updated_at`);
  if (!r.ok) throw new Error('pull failed (' + r.status + ')');
  return (await r.json())[0] || null;
}

async function adoptRemote(row){

}
async function pushRow(){
  clearTimeout(pushTimer); pushTimer = null;
  if (!signedIn()) return;
  if (!await ensureToken()){ setSync('signedout', 'Session expired — sign in again'); return; }
  const v = doc.sync?.version || 0;
  const payload = { user_id:SESSION.user_id, data:blobOf(), version:v + 1, updated_at:new Date().toISOString() };
  setSync('busy', 'Saving…');
  let r;
  if (v === 0){
    r = await sb('/rest/v1/stride_docs', { method:'POST', body:JSON.stringify(payload), headers:{ Prefer:'return=representation' } });
    if (r.status === 409){ await reconcile(); return; }
  } else {
    // compare-and-set: if another device wrote since, this matches nothing
    r = await sb(`/rest/v1/stride_docs?user_id=eq.${SESSION.user_id}&version=eq.${v}`,
      { method:'PATCH', body:JSON.stringify(payload), headers:{ Prefer:'return=representation' } });
  }
  if (!r.ok){ setSync('error', 'Couldn’t save — ' + r.status); return; }
  const rows = await r.json();

// The row moved under us. Let the person choose; never guess.
async function reconcile(){
  const row = await pullRow();
  if (!row){ doc.sync = meta(null, true); await saveLocal(); return pushRow(); }
  if (!runCount(row.data) && runCount(doc)){ doc.sync = meta(row, true); await saveLocal(); return pushRow(); }
  if (stableStringify(blobOf()) === stableStringify(row.data)){ await markSynced(row); return; }
  setSync('conflict', 'Another device saved first');
  choose('Changed on another device',
    `Here: ${runCount(doc)} runs, last synced ${timeAgo(doc.sync?.at)}. There: ${runCount(row.data)} runs, saved ${timeAgo(row.updated_at)}. Keeping one replaces the other.`,
    ['Keep what’s here', async () => { doc.sync = meta(row, true); await saveLocal(); pushRow(); }],
    ['Take the other one', async () => { await adoptRemote(row); toast('Pulled from the other device'); }]);
}
async function firstSync(){
  try {
    const row = await pullRow();
    // This browser holds someone else's runs: never upload them into this account.
    const owner = doc.sync?.user_id;
    if (owner && owner !== SESSION.user_id){
      await idb.clear('samples').catch(() => {}); memSamples.clear(); setUnsent([]);
      if (row){ await adoptRemote(row); toast(`Loaded ${runCount(doc)} runs`); }
      else { doc = normalize({ ...freshDoc(), runs:[], checkins:[] }); doc.sync = meta(null, false); await saveLocal(); render(); setSync('ok'); }
      return;
    }
    const here = runCount(doc), there = row ? runCount(row.data) : 0;
    const uploadAll = async () => { addUnsent(doc.runs.filter(r => r.hasSamples).map(r => r.id)); await pushRow(); toast(`Uploaded ${runCount(doc)} runs to your account`); };
    if (!row){
      // signing in on an empty browser must not publish that emptiness
      doc.sync = meta(null, !!here); await saveLocal();
      if (here) await uploadAll(); else setSync('ok');
      return;
    }
    if (!there && !here){ await markSynced(row); return; }
    if (!there){ doc.sync = meta(row, true); await saveLocal(); await uploadAll(); return; }
    if (!here){ await adoptRemote(row); toast(`Loaded ${runCount(doc)} runs`); return; }
    // The version counter says what happened; content breaks the tie only the
    // first time this browser meets the row.
    const known = doc.sync?.version || 0, dirty = !!doc.sync?.dirty;
    if (known === row.version){
      if (!dirty){ await markSynced(row); return; }
      doc.sync = meta(row, true); await saveLocal(); await pushRow(); return;
    }
    if (known && known < row.version && !dirty){ await adoptRemote(row); toast('Pulled changes from another device'); return; }
    if (stableStringify(blobOf()) === stableStringify(row.data)){ await markSynced(row); return; }
    setSync('conflict', 'Two versions');
    choose('There are already runs on this account',
      `Here: ${here} runs. There: ${there} runs, saved ${timeAgo(row.updated_at)}. Keeping one replaces the other.`,
      ['Keep what’s here', async () => { doc.sync = meta(row, true); await saveLocal(); await uploadAll(); }],
      ['Take the account’s', async () => { await adoptRemote(row); toast('Loaded from your account'); }]);
  } catch (e){ setSync('error', e.message); }
}

    for (const id of getUnsent()){
      if (!runById(id)){ setUnsent(getUnsent().filter(x => x !== id)); continue; }
      let s = memSamples.get(id);
      if (!s) try { s = await idb.get('samples', id); } catch {}

        if (!await ensureToken()) break;
        const r = await sb('/rest/v1/stride_samples?on_conflict=user_id,run_id', { method:'POST',
          body:JSON.stringify({ user_id:SESSION.user_id, run_id:id, data:s }),
          headers:{ Prefer:'resolution=merge-duplicates,return=minimal' } });
        if (!r.ok) break;

/* ── Derived facts ───────────────────────────────────────────────── */
const sortedRuns = () => [...doc.runs].sort((a, b) => a.start < b.start ? -1 : 1);

const testRoute = () => doc.routes.find(r => r.isTest);
const isTest = r => r.testOverride ?? (!!r.routeId && !!doc.routes.find(x => x.id === r.routeId)?.isTest);
const isClean = r => isTest(r) && (r.idleSec ?? 0) <= IDLE_TOLERANCE;

const currentWeight = () => doc.profile.weights.at(-1)?.lbs ?? null;

function exclusionReasons(r){
  const why = [];
  if (!isTest(r)) why.push(r.gainFt > 50 ? `not the test route (${r.gainFt} ft gain)` : 'not the test route');
  if ((r.idleSec ?? 0) > IDLE_TOLERANCE) why.push(`idle ${fmtDur(r.idleSec)} — timer left running`);
  return why;
}

// Protocol audit: what, if anything, contaminates this run's numbers.
function flagsFor(r){
  const f = [], p = doc.profile;
  if ((r.idleSec ?? 0) > IDLE_TOLERANCE) f.push(['warn', `Idle ${fmtDur(r.idleSec)}`, 'Timer left running while standing — drags average pace and HR']);
  if (!isTest(r)) f.push(['wait', 'Not the test route', r.gainFt != null ? `${r.gainFt} ft of gain — kept out of the HR trend` : 'Kept out of the HR trend']);
  if (r.recoveryHr == null) f.push(['wait', 'No recovery HR', 'Stop the timer, stand still 2 min, then save. Or type it in from Garmin Connect']);
  if (r.anaerobicTE != null && r.anaerobicTE > 1.0) f.push(['crit', `Anaerobic TE ${r.anaerobicTE.toFixed(1)}`, 'Too hard for an easy run — should be near 0.0']);
  if (r.maxHr != null && r.maxHr > p.guardHr) f.push(['warn', `Max HR ${r.maxHr}`, `Over the ~${p.guardHr} guardrail — take a walk break when HR passes ${p.zones.mod}`]);
  if (r.aboveLtSec != null && r.aboveLtSec > 30) f.push(['warn', `${fmtDur(r.aboveLtSec)} above ${p.lthr}`, 'Should be near zero on easy runs']);
  const w = currentWeight();
  if (r.weightLbs != null && w != null && Math.abs(r.weightLbs - w) >= 3) f.push(['wait', `Computed at ${r.weightLbs} lbs`, 'Power and calories are a few percent off vs. your current weight']);
  if (r.source === 'manual') f.push(['wait', 'Entered from notes', 'Upload the FIT file for jogging-only HR, zones and time above threshold']);
  return f;
}

/* ── Check-ins and the red flag ──────────────────────────────────── */
const SORE = { none:'Nothing', calves:'Calves', hip:'Hip', knee:'Knee', red:'Shin / Achilles / one calf much worse' };
function redFlagActive(){
  const reds = doc.checkins.filter(c => c.value === 'red').map(c => c.at).sort();
  return reds.length > 0 && (!doc.redClearedAt || reds.at(-1) > doc.redClearedAt);
}
function pendingCheckin(){
  // Only the latest run matters — a newer run resets the soreness clock.
  const r = sortedRuns().reverse().find(x => hoursSince(x) >= 0);
  if (!r) return null;
  const h = hoursSince(r);
  const has = st => doc.checkins.some(c => c.runId === r.id && c.stage === st);
  if (h >= 36 && h < 72 && !has('48')) return { run:r, stage:'48', hours:h };
  if (h >= 10 && h < 36 && !has('24')) return { run:r, stage:'24', hours:h };
  return null;
}

/* ── Plan state: walk calendar weeks from the start, gate each one ─ */
function gateFor(w){
  const runs = w.runs, n = runs.length, p = doc.profile, items = [];
  items.push([n >= 3 ? 'good' : w.current ? 'wait' : 'crit', '3 runs completed',
    n ? `${n} so far · ${runs.map(r => DOW[parseYmd(r.date).getDay()]).join(', ')}` : 'None yet']);

  const cks = doc.checkins.filter(c => runs.some(r => r.id === c.runId));
  const red = cks.some(c => c.value === 'red');
  const sore48 = cks.filter(c => c.stage === '48' && c.value !== 'none');
  const last = runs.at(-1);
  const pending48 = !!last && !doc.checkins.some(c => c.runId === last.id && c.stage === '48') && hoursSince(last) < 72;
  if (red) items.push(['crit', 'No red-flag symptoms', 'Hard stop logged — plan paused']);
  else if (sore48.length) items.push(['crit', 'No soreness past 48 hrs', `${SORE[sore48[0].value]} still sore at 48 hrs`]);
  else if (pending48){
    const sore24 = cks.find(c => c.runId === last.id && c.stage === '24' && c.value !== 'none');
    const due = new Date(Date.parse(last.start) + 48 * 36e5);
    items.push(['wait', 'No soreness past 48 hrs', `${sore24 ? SORE[sore24.value] + ' sore at ~24 hrs — normal. ' : ''}48-hr check ${DOW_LONG[due.getDay()]} ${due.getHours() >= 17 ? 'night' : ''}`.trim()]);
  }
  else items.push(['good', 'No soreness past 48 hrs', n ? 'Clear' : '—']);

  const over = runs.filter(r => r.maxHr > p.guardHr);
  const peak = n ? Math.max(...runs.map(r => r.maxHr ?? 0)) : null;
  items.push([over.length ? 'warn' : n ? (peak === p.guardHr ? 'warn' : 'good') : 'wait', `Max HR under ~${p.guardHr}`,
    over.length ? `${over.map(r => `${r.maxHr} ${DOW[parseYmd(r.date).getDay()]}`).join(', ')} — walk when HR passes ${p.zones.mod}`
      : n ? (peak === p.guardHr ? `Peaked at ${peak} — right on the line` : `Peaked at ${peak}`) : '—']);

  const withS = runs.filter(r => r.aboveLtSec != null);
  if (!withS.length) items.push(['wait', `Little to no time above ${p.lthr}`, n ? 'Needs FIT samples — upload these runs' : '—']);
  else {
    const tot = withS.reduce((s, r) => s + r.aboveLtSec, 0);
    items.push([tot > 60 ? 'warn' : 'good', `Little to no time above ${p.lthr}`,
      `${fmtDur(tot)} total${withS.length < n ? ` · ${n - withS.length} run${n - withS.length > 1 ? 's' : ''} without samples` : ''}`]);
  }

  let auto, verdict;
  if (red){ auto = 'repeat'; verdict = ['crit', 'Paused.', 'Resume once you’re cleared.']; }
  else if (n === 0 && !w.current){ auto = 'back'; verdict = ['crit', 'Missed week.', 'Go back one week — don’t jump ahead.']; }
  else if (sore48.length){ auto = 'repeat'; verdict = ['warn', 'Repeat this week.', 'Soreness lasted past 48 hours.']; }
  else if (n < 3){ auto = 'repeat'; verdict = w.current ? ['wait', 'In progress.', `${3 - n} more run${3 - n > 1 ? 's' : ''} this week.`] : ['warn', 'Repeat this week.', 'Fewer than 3 runs.']; }
  else if (pending48){ auto = 'advance'; verdict = ['wait', 'Almost there.', 'Advances if the 48-hour check comes back clear.']; }
  else { auto = 'advance'; verdict = ['good', 'On track to advance.', w.planWeek === 1 ? 'Weeks 1–2 are the same workload, so there’s no jump either way.' : 'Next week’s targets unlock Monday.']; }
  return { items, auto, verdict };
}

function planState(){
  const cur = weekStart(todayYmd());
  const weeks = [];
  let ws = weekStart(doc.planStart), pw = 1;
  while (ws <= cur){
    const we = addDays(ws, 6);
    const w = { start:ws, end:we, planWeek:pw, current: ws === cur,
      runs: sortedRuns().filter(r => r.date >= ws && r.date <= we) };
    w.gate = gateFor(w);
    if (!w.current){
      const ov = doc.decisions[ws];
      w.decision = ov || w.gate.auto; w.overridden = !!ov;
      pw = w.decision === 'advance' ? Math.min(9, pw + 1) : w.decision === 'back' ? Math.max(1, pw - 1) : pw;
    }
    weeks.push(w);
    ws = addDays(ws, 7);
  }
  return weeks;
}
const planWeekObj = pw => PLAN[Math.min(pw, 8) - 1];

// Next N days: rest between runs, three a week, rest before a sport day.
function schedule(from, n){
  const out = [], red = redFlagActive(), counts = {};
  const count = ws => counts[ws] ??= doc.runs.filter(r => weekStart(r.date) === ws).length;
  for (let i = 0; i < n; i++){
    const d = addDays(from, i), ws = weekStart(d);
    count(ws);
    const prevD = addDays(d, -1);
    const prev = i ? out[i-1] : { kind: runsOn(prevD).length ? 'done' : isRef(prevD) ? 'ref' : 'rest' };
    let kind, note = '';
    if (runsOn(d).length) kind = 'done';
    else if (isRef(d)) kind = 'ref';
    else if (red){ kind = 'rest'; note = 'Paused'; }
    else if (prev.kind === 'done' || prev.kind === 'run'){ kind = 'rest'; note = 'After a run'; }
    else if (counts[ws] >= 3){ kind = 'rest'; note = 'Week’s runs are in'; }
    else if (isRef(addDays(d, 1))){ kind = 'rest'; note = 'Sport tomorrow'; }
    else { kind = 'run'; counts[ws]++; if (prev.kind === 'ref') note = 'Skip if legs are toast'; }
    out.push({ date:d, kind, note, slot: kind === 'run' ? counts[ws] : null });
  }
  return out;
}
function sessionFor(pw, slot){
  const p = planWeekObj(pw);
  if (p.speed && slot === 3) return { title:'Speed run', detail:'Warm up, 4 × 2 min harder with 2 min walk, cool down', extra:'' };
  return { title:p.session, detail:p.detail, extra: slot && p.strides && slot <= p.strides ? 'Then 4 × 20 sec strides at ~80% — a full minute of walking between' : '' };
}

/* ── Theme ───────────────────────────────────────────────────────── */
const prefs = {
  get(k, d){ try { const v = localStorage.getItem('stride:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('stride:' + k, JSON.stringify(v)); } catch {} },
};
const savedTheme = prefs.get('theme', null);
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
document.querySelectorAll('[data-theme-toggle]').forEach(b => b.addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  prefs.set('theme', next);
  render();
}));
document.addEventListener('click', e => { if (e.target.closest('[data-theme-toggle2]')) $('[data-theme-toggle]').click(); });

/* ── Charts: hand-built SVG at the container's real width ────────── */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent){
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function svgFor(host, H){
  host.innerHTML = '';
  const W = Math.max(host.clientWidth, 260);
  return [el('svg', { width:W, height:H, viewBox:`0 0 ${W} ${H}` }, host), W];
}
function hGrid(svg, ticks, y, x0, x1, fmt = String){
  ticks.forEach(t => {
    el('line', { x1:x0, x2:x1, y1:y(t), y2:y(t), stroke:css('--grid'), 'stroke-width':1 }, svg);
    el('text', { x:x0 - 8, y:y(t) + 4, 'text-anchor':'end', class:'num' }, svg).textContent = fmt(t);
  });
}
function colPath(x, yTop, w, yBase, r = 4){
  const h = yBase - yTop; r = Math.min(r, h, w / 2);
  if (h <= 0) return '';
  return `M${x},${yBase} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yBase} Z`;
}
const tipOn = (node, html) => { node.dataset.tip = html; return node; };
const niceTicks = (lo, hi, step) => { const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) t.push(v); return t; };

function chartHrTrend(host, runs){
  const H = 260, m = { t:14, r:58, b:30, l:40 };
  const [svg, W] = svgFor(host, H);
  const p = doc.profile;
  const vals = runs.map(hrMetric).filter(v => v != null);
  const lo = Math.min(140, ...vals.map(v => Math.floor((v - 5) / 10) * 10));
  const hi = Math.max(190, ...vals.map(v => Math.ceil((v + 5) / 10) * 10));
  const last = runs.length ? runs.at(-1).date : doc.planStart;
  const span = Math.max(56, Math.ceil((diffDays(doc.planStart, last) + 8) / 7) * 7);
  const x = d => m.l + d / span * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

  el('rect', { x:m.l, y:y(p.zones.easy), width:W - m.l - m.r, height:y(lo) - y(p.zones.easy), fill:css('--series-1-wash') }, svg);
  hGrid(svg, niceTicks(lo, hi, 10), y, m.l, W - m.r);
  const weeks = span / 7, every = Math.ceil(weeks / 10);
  for (let w = 0; w < weeks; w++){
    if (w) el('line', { x1:x(w * 7), x2:x(w * 7), y1:m.t, y2:H - m.b, stroke:css('--grid') }, svg);
    if (w % every === 0) el('text', { x:x(w * 7 + 3.5), y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = 'W' + (w + 1);
  }
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  el('line', { x1:m.l, x2:W - m.r, y1:y(p.lthr), y2:y(p.lthr), stroke:css('--crit'), 'stroke-width':1.5 }, svg);
  el('text', { x:W - m.r + 6, y:y(p.lthr) + 4 }, svg).textContent = 'LT ' + p.lthr;
  el('text', { x:W - m.r + 6, y:y(p.zones.easy) + 4 }, svg).textContent = 'Easy';
  const td = diffDays(doc.planStart, todayYmd());
  if (td >= 0 && td <= span){
    el('line', { x1:x(td), x2:x(td), y1:m.t, y2:H - m.b, stroke:css('--ink'), opacity:.35 }, svg);
    el('text', { x:x(td) + 5, y:m.t + 10, style:'font-weight:700' }, svg).textContent = 'Today';
  }
  const clean = runs.filter(isClean);
  if (clean.length > 1){
    el('path', { d: clean.map((r, i) => `${i ? 'L' : 'M'}${x(diffDays(doc.planStart, r.date))},${y(hrMetric(r))}`).join(' '),
      fill:'none', stroke:css('--series-1'), 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  }
  runs.forEach(r => {
    const v = hrMetric(r); if (v == null) return;
    const cx = x(diffDays(doc.planStart, r.date)), cy = y(v), ok = isClean(r);
    if (ok) el('circle', { cx, cy, r:6, fill:css('--series-1'), stroke:css('--surface'), 'stroke-width':2 }, svg);
    else el('circle', { cx, cy, r:5, fill:css('--surface'), stroke:css('--muted'), 'stroke-width':2 }, svg);
    if (ok && (r === clean.at(-1) || r === clean[0])) el('text', { x:cx + 10, y:cy - 8, class:'lbl num' }, svg).textContent = Math.round(v);
    const pace = fmtDur(r.jogPaceSec ?? r.avgPaceSec);
    const kind = r.jogHr != null ? 'jogging HR' : 'avg HR (whole run)';
    const hit = el('circle', { cx, cy, r:14, fill:'transparent', style:'cursor:pointer' }, svg);
    hit.addEventListener('click', () => { location.hash = 'runs/' + r.id; });
    tipOn(hit, `<b>${fmtDate(r.date)}</b><br>${Math.round(v)} bpm ${kind} · ${pace} /mi<br>${ok ? '✓ Clean test-route run' : '✕ Excluded: ' + exclusionReasons(r).join(' · ')}`);
  });
}

function chartColumns(host, { cats, series, max, ticks, fmt, guard, labelFmt, tipFmt, onClick }){
  const H = 210, m = { t:20, r:12, b:28, l:36 };
  const [svg, W] = svgFor(host, H);
  const y = v => m.t + (max - v) / max * (H - m.t - m.b);
  hGrid(svg, ticks ?? niceTicks(0, max, max <= 5 ? 1 : 5), y, m.l, W - m.r, fmt);
  const band = (W - m.l - m.r) / Math.max(cats.length, 1);
  const bw = Math.min(24, band * 0.55);
  cats.forEach((c, i) => {
    const cx = m.l + band * i + band / 2;
    let acc = 0;
    series.forEach((s, si) => {
      const v = Math.min(c[s.key] ?? 0, max - acc);
      if (v <= 0) return;
      const y0 = y(acc), y1 = y(acc + v), gap = acc > 0 ? 2 : 0;
      const top = series.slice(si + 1).every(s2 => !(c[s2.key] > 0));
      if (top) el('path', { d:colPath(cx - bw / 2, y1, bw, y0 - gap), fill:s.color }, svg);
      else el('rect', { x:cx - bw / 2, y:y1, width:bw, height:Math.max(0, y0 - y1 - gap), fill:s.color }, svg);
      acc += v;
    });
    if (labelFmt && band > 34) el('text', { x:cx, y:y(acc) - 6, 'text-anchor':'middle', class:'lbl num' }, svg).textContent = labelFmt(c);
    if (band > 30 || i % Math.ceil(30 / band) === 0)
      el('text', { x:cx, y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = c.date.slice(5).replace('-', '/');
    const hit = el('rect', { x:cx - band / 2 + 2, y:m.t, width:Math.max(band - 4, 4), height:H - m.t - m.b, fill:'transparent', style:onClick ? 'cursor:pointer' : '' }, svg);
    tipOn(hit, tipFmt(c));
    if (onClick) hit.addEventListener('click', () => onClick(c));
  });
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  if (guard != null) el('line', { x1:m.l, x2:W - m.r, y1:y(guard), y2:y(guard), stroke:css('--crit'), 'stroke-width':1.5 }, svg);
}

function chartLine(host, pts, { lo = 0, hi, step, tipFmt }){
  const H = 210, m = { t:22, r:24, b:28, l:36 };
  const [svg, W] = svgFor(host, H);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const x = i => pts.length === 1 ? (m.l + W - m.r) / 2 : m.l + 16 + i * (W - m.l - m.r - 32) / (pts.length - 1);
  hGrid(svg, niceTicks(lo, hi, step), y, m.l, W - m.r);
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  if (pts.length > 1) el('path', { d:pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.v)}`).join(' '), fill:'none',
    stroke:css('--series-1'), 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  const labelEvery = Math.ceil(pts.length / 8);
  pts.forEach((p, i) => {
    el('circle', { cx:x(i), cy:y(p.v), r:4.5, fill:css('--series-1'), stroke:css('--surface'), 'stroke-width':2 }, svg);
    if (i === 0 || i === pts.length - 1) el('text', { x:x(i), y:y(p.v) - 11, 'text-anchor':'middle', class:'lbl num' }, svg).textContent = p.v;
    if (i % labelEvery === 0 || i === pts.length - 1) el('text', { x:x(i), y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = p.r.date.slice(5).replace('-', '/');
    tipOn(el('circle', { cx:x(i), cy:y(p.v), r:14, fill:'transparent' }, svg), tipFmt(p));
  });
}

// One run's heart rate over time, zone bands behind, run/walk strip below.
function chartTrace(host, s){
  const H = 280, m = { t:12, r:74, b:46, l:40 };
  const [svg, W] = svgFor(host, H);
  const p = doc.profile;
  const hrs = s.hr.filter(v => v != null);
  if (!hrs.length){ host.innerHTML = '<div class="pending-box">No heart rate in this file.</div>'; return; }
  const lo = Math.min(100, Math.floor((Math.min(...hrs) - 5) / 10) * 10);
  const hi = Math.max(190, Math.ceil((Math.max(...hrs) + 3) / 10) * 10);
  const tMax = s.t.at(-1) || 1;
  const x = t => m.l + t / tMax * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const bands = [[lo, p.zones.easy, '--z-easy', 'Easy'], [p.zones.easy, p.zones.mod, '--z-mod', 'Moderate'], [p.zones.mod, p.lthr, '--z-hard', 'Hard'], [p.lthr, hi, '--z-above', 'Above LT']];
  bands.forEach(([a, b, c, label]) => {
    el('rect', { x:m.l, y:y(b), width:W - m.l - m.r, height:y(a) - y(b), fill:css(c), 'fill-opacity':.1 }, svg);
    el('text', { x:W - m.r + 8, y:(y(a) + y(b)) / 2 + 4 }, svg).textContent = label;
  });
  hGrid(svg, niceTicks(lo, hi, 20), y, m.l, W - m.r);
  el('line', { x1:m.l, x2:W - m.r, y1:y(p.lthr), y2:y(p.lthr), stroke:css('--crit'), 'stroke-width':1.5 }, svg);
  const tickStep = tMax > 1800 ? 300 : tMax > 600 ? 120 : 60;
  for (let t = 0; t <= tMax; t += tickStep) el('text', { x:x(t), y:H - m.b + 32, 'text-anchor':'middle', class:'num' }, svg).textContent = fmtDur(t);
  let d = '', pen = false;
  s.t.forEach((t, i) => {
    const v = s.hr[i];
    if (v == null || (i && t - s.t[i-1] > 5)){ pen = false; if (v == null) return; }
    d += `${pen ? 'L' : 'M'}${x(t).toFixed(1)},${y(v).toFixed(1)}`; pen = true;
  });
  el('path', { d, fill:'none', stroke:css('--series-1'), 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  // run / walk / idle strip
  const stripY = H - m.b + 8, colors = [css('--muted'), css('--walk'), css('--series-1')];
  let i0 = 0;
  for (let i = 1; i <= s.t.length; i++){
    if (i === s.t.length || s.st[i] !== s.st[i0]){
      const x0 = x(s.t[i0]), x1 = x(i === s.t.length ? tMax : s.t[i]);
      el('rect', { x:x0, y:stripY, width:Math.max(x1 - x0 - (i === s.t.length ? 0 : 2), 1), height:8, rx:2, fill:colors[s.st[i0]], opacity:s.st[i0] === 0 ? .5 : 1 }, svg);
      i0 = i;
    }
  }
  // crosshair
  const cross = el('line', { y1:m.t, y2:H - m.b, stroke:css('--ink'), opacity:0 }, svg);
  const dot = el('circle', { r:4.5, fill:css('--series-1'), stroke:css('--surface'), 'stroke-width':2, opacity:0 }, svg);
  const hit = el('rect', { x:m.l, y:m.t, width:W - m.l - m.r, height:H - m.t, fill:'transparent' }, svg);
  const STATE = ['standing', 'walking', 'jogging'];
  hit._tip = e => {
    const r = svg.getBoundingClientRect();
    const t = (e.clientX - r.left - m.l) / (W - m.l - m.r) * tMax;
    let a = 0, b = s.t.length - 1;
    while (b - a > 1){ const mid = (a + b) >> 1; if (s.t[mid] < t) a = mid; else b = mid; }
    const i = Math.abs(s.t[a] - t) < Math.abs(s.t[b] - t) ? a : b;
    cross.setAttribute('x1', x(s.t[i])); cross.setAttribute('x2', x(s.t[i])); cross.setAttribute('opacity', .3);
    if (s.hr[i] != null){ dot.setAttribute('cx', x(s.t[i])); dot.setAttribute('cy', y(s.hr[i])); dot.setAttribute('opacity', 1); }
    const pace = s.spd[i] > 30 ? `${fmtDur(MI / (s.spd[i] / 100))} /mi` : '—';
    return `<b>${fmtDur(s.t[i])}</b> · ${STATE[s.st[i]]}<br>${s.hr[i] ?? '—'} bpm · ${pace}${s.cad[i] ? ` · ${s.cad[i]} spm` : ''}`;
  };
  hit._tipOut = () => { cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); };
}

function routeSvg(path){
  if (!path || path.length < 2) return '';
  const lat0 = path[0][0] * Math.PI / 180;
  const pts = path.map(([la, lo]) => [lo * Math.cos(lat0), -la]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const span = Math.max(x1 - x0, y1 - y0) || 1, W = 300, H = 180, padd = 16;
  const k = Math.min((W - 2 * padd) / (x1 - x0 || span), (H - 2 * padd) / (y1 - y0 || span));
  const ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
  const P = pts.map(([px, py]) => [ox + (px - x0) * k, oy + (py - y0) * k]);
  const d = P.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');
  return `<svg class="route-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-label="Route shape">
    <path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${P.at(-1)[0]}" cy="${P.at(-1)[1]}" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${P[0][0]}" cy="${P[0][1]}" r="6" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/>
  </svg>`;
}

const tip = $('#tip');
let lastTipTarget = null;
document.addEventListener('pointermove', e => {
  const t = e.target.closest?.('[data-tip]');
  const live = e.target._tip ? e.target : null;
  if (lastTipTarget && lastTipTarget !== live && lastTipTarget._tipOut) lastTipTarget._tipOut();
  lastTipTarget = live;
  const html = live ? live._tip(e) : t?.dataset.tip;
  if (!html){ tip.classList.remove('show'); return; }
  tip.innerHTML = html; tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  let lx = e.clientX + 14, ly = e.clientY - r.height - 12;
  if (lx + r.width > innerWidth - 8) lx = e.clientX - r.width - 14;
  if (ly < 8) ly = e.clientY + 16;
  tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
});

  return `<li><button class="task" data-task="${esc(key)}" aria-pressed="${on}">

    cats: recent.map(r => ({ ...r, jogM:(r.runSec ?? 0) / 60, walkM:(r.walkSec ?? 0) / 60 })),
    series: [{ key:'jogM', color:css('--series-1') }, { key:'walkM', color:css('--walk') }],
    max: Math.max(15, Math.ceil(Math.max(...recent.map(r => ((r.runSec ?? 0) + (r.walkSec ?? 0)) / 60)) / 5) * 5),
    ticks: null, labelFmt: c => fmtDur(c.runSec),
    tipFmt: c => `<b>${fmtDate(c.date)}</b><br>Jog ${fmtDur(c.runSec)} · Walk ${fmtDur(c.walkSec)}`, onClick: openRun,
  });
  if (rec.length) chartLine($('#c-rec'), rec.slice(-12).map(r => ({ r, v:r.recoveryHr, id:r.id })), {
    lo: 0, hi: Math.max(50, Math.ceil(Math.max(...rec.map(r => r.recoveryHr)) / 10) * 10 + 10), step: 10,
    tipFmt: pt => `<b>${fmtDate(pt.r.date)}</b><br>Dropped ${pt.v} bpm in 2 min` });
  chartColumns($('#c-max'), {
    cats: recent, series: [{ key:'maxHr', color:css('--series-1') }], max: 200, ticks: [0, 50, 100, 150, 200], guard: p.guardHr,
    labelFmt: c => c.maxHr, onClick: openRun,
    tipFmt: c => `<b>${fmtDate(c.date)}</b><br>Max ${c.maxHr} bpm · ${c.maxHr > p.guardHr ? '▲ over the guardrail' : `✓ at or under ${p.guardHr}`}`,
  });
  if (withS.length){
    const lt = withS.slice(-12).map(r => ({ ...r, ltM:r.aboveLtSec / 60 }));
    chartColumns($('#c-lt'), {
      cats: lt, series: [{ key:'ltM', color:css('--series-1') }],
      max: Math.max(2, Math.ceil(Math.max(...lt.map(r => r.ltM)))), ticks: null, fmt: v => v + 'm',
      labelFmt: c => fmtDur(c.aboveLtSec), onClick: openRun,
      tipFmt: c => `<b>${fmtDate(c.date)}</b><br>${fmtDur(c.aboveLtSec)} at or above ${p.lthr} bpm`,
    });
  }
  const loads = runs.filter(r => r.load != null).slice(-12);
  if (loads.length) chartLine($('#c-load'), loads.map(r => ({ r, v:r.load })), {
    lo: 0, hi: Math.max(80, Math.ceil(Math.max(...loads.map(r => r.load)) / 20) * 20), step: 20,
    tipFmt: pt => `<b>${fmtDate(pt.r.date)}</b><br>Load ${pt.v} · ${fmtDur(pt.r.runSec)} jogging` });
  const drifts = runs.filter(r => r.drift != null).slice(-12);
  if (drifts.length) chartLine($('#c-drift'), drifts.map(r => ({ r, v:r.drift })), {
    lo: Math.min(0, Math.floor(Math.min(...drifts.map(r => r.drift)) / 5) * 5), hi: Math.max(15, Math.ceil(Math.max(...drifts.map(r => r.drift)) / 5) * 5), step: 5,
    tipFmt: pt => `<b>${fmtDate(pt.r.date)}</b><br>HR ${pt.v >= 0 ? 'rose' : 'fell'} ${Math.abs(pt.v)} bpm from the first half of the jogging to the second` });
}

function renderRunsList(){

    page.innerHTML = `<div class="page-head"><div><div class="eyebrow">No runs yet</div><h1 class="display">Runs</h1></div></div>
      <div class="empty"><b>No runs yet.</b><br><a href="#upload">Upload a FIT file</a> to get started.</div>`;
    return;
  }
  const dotColor = { crit:'var(--crit)', warn:'var(--warn)', wait:'var(--axis)' };
  page.innerHTML = `
    <div class="page-head"><div><div class="eyebrow">${runs.length} run${runs.length > 1 ? 's' : ''} · ${runs.filter(isClean).length} clean on the test route</div><h1 class="display">Runs</h1></div>
      <a class="btn primary" href="#upload" style="text-decoration:none">Upload FIT</a></div>
    <div class="card"><div class="table-wrap"><table class="runs">
      <thead><tr><th>Date</th><th>Route</th><th>Dist</th><th>Jog / walk</th><th>Pace</th><th>Avg HR</th><th>Jog HR</th><th>Max HR</th><th>An TE</th><th>Load</th><th>Flags</th></tr></thead>
      <tbody>${runs.map(r => {
        const fl = flagsFor(r).filter(f => f[0] !== 'wait' || f[1] === 'Not the test route');
        return `<tr data-run="${r.id}" tabindex="0">
          <td><div class="r-date">${fmtDate(r.date)}</div><div class="r-sub">${r.source === 'fit' ? fmtTime(r.start) + ' · FIT' : 'from notes'}</div></td>
          <td style="text-align:right">${isTest(r) ? '<span class="badge test">Test</span>' : '<span class="badge">Other</span>'}</td>
          <td>${fmtMi(r.distMi)}</td>
          <td>${fmtDur(r.runSec)} / ${fmtDur(r.walkSec)}</td>
          <td>${fmtDur(r.avgPaceSec)}</td>
          <td>${num(r.avgHr)}</td>
          <td>${r.jogHr != null ? Math.round(r.jogHr) : '—'}</td>
          <td>${num(r.maxHr)}</td>
          <td>${num(r.anaerobicTE, 1)}</td>
          <td>${num(r.load)}</td>
          <td><span class="flags" data-tip="${esc(fl.map(f => f[1]).join(' · ') || 'Clean')}">${fl.length ? fl.map(f => `<i class="flag-dot" style="background:${dotColor[f[0]]}"></i>`).join('') : `<span style="color:var(--good-text);font-weight:700">✓</span>`}</span></td>
        </tr>`;
      }).join('')}</tbody>
