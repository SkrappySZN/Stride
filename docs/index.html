/* ── Charts: hand-built SVG at the container's real width ────────── */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent){
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function svgFor(host, H){
  host.innerHTML = '';
  const W = Math.max(host.clientWidth, 260);
  return [el('svg', { width:W, height:H, viewBox:`0 0 ${W} ${H}` }, host), W];
}
function hGrid(svg, ticks, y, x0, x1, fmt = String){
  ticks.forEach(t => {
    el('line', { x1:x0, x2:x1, y1:y(t), y2:y(t), stroke:css('--grid'), 'stroke-width':1 }, svg);
    el('text', { x:x0 - 8, y:y(t) + 4, 'text-anchor':'end', class:'num' }, svg).textContent = fmt(t);
  });
}
function colPath(x, yTop, w, yBase, r = 4){
  const h = yBase - yTop; r = Math.min(r, h, w / 2);
  if (h <= 0) return '';
  return `M${x},${yBase} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yBase} Z`;
}
const tipOn = (node, html) => { node.dataset.tip = html; return node; };
const niceTicks = (lo, hi, step) => { const t = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) t.push(v); return t; };

function chartHrTrend(host, runs){
  const H = 260, m = { t:14, r:58, b:30, l:40 };
  const [svg, W] = svgFor(host, H);
  const p = doc.profile;
  // Plan weeks when there's a plan; otherwise weeks since the first run.
  const origin = coached() && !(runs[0]?.date < doc.planStart) ? doc.planStart : weekStart(runs[0]?.date ?? todayYmd());
  const vals = runs.map(hrMetric).filter(v => v != null);
  const lo = Math.min(140, ...vals.map(v => Math.floor((v - 5) / 10) * 10));
  const hi = Math.max(190, ...vals.map(v => Math.ceil((v + 5) / 10) * 10));
  const last = runs.length ? runs.at(-1).date : origin;
  const span = Math.max(56, Math.ceil((diffDays(origin, last) + 8) / 7) * 7);
  const x = d => m.l + d / span * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

  el('rect', { x:m.l, y:y(p.zones.easy), width:W - m.l - m.r, height:y(lo) - y(p.zones.easy), fill:css('--series-1-wash') }, svg);
  hGrid(svg, niceTicks(lo, hi, 10), y, m.l, W - m.r);
  const weeks = span / 7, every = Math.ceil(weeks / 10);
  for (let w = 0; w < weeks; w++){
    if (w) el('line', { x1:x(w * 7), x2:x(w * 7), y1:m.t, y2:H - m.b, stroke:css('--grid') }, svg);
    if (w % every === 0) el('text', { x:x(w * 7 + 3.5), y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = 'W' + (w + 1);
  }
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  el('line', { x1:m.l, x2:W - m.r, y1:y(p.lthr), y2:y(p.lthr), stroke:css('--crit'), 'stroke-width':1.5 }, svg);
  el('text', { x:W - m.r + 6, y:y(p.lthr) + 4 }, svg).textContent = 'LT ' + p.lthr;
  el('text', { x:W - m.r + 6, y:y(p.zones.easy) + 4 }, svg).textContent = 'Easy';
  const td = diffDays(origin, todayYmd());
  if (td >= 0 && td <= span){
    el('line', { x1:x(td), x2:x(td), y1:m.t, y2:H - m.b, stroke:css('--ink'), opacity:.35 }, svg);
    el('text', { x:x(td) + 5, y:m.t + 10, style:'font-weight:700' }, svg).textContent = 'Today';
  }
  const clean = runs.filter(isClean);
  if (clean.length > 1){
    el('path', { d: clean.map((r, i) => `${i ? 'L' : 'M'}${x(diffDays(origin, r.date))},${y(hrMetric(r))}`).join(' '),
      fill:'none', stroke:css('--series-1'), 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  }
  runs.forEach(r => {
    const v = hrMetric(r); if (v == null) return;
    const cx = x(diffDays(origin, r.date)), cy = y(v), ok = isClean(r);
    if (ok) el('circle', { cx, cy, r:6, fill:css('--series-1'), stroke:css('--surface'), 'stroke-width':2 }, svg);
    else el('circle', { cx, cy, r:5, fill:css('--surface'), stroke:css('--muted'), 'stroke-width':2 }, svg);
    if (ok && (r === clean.at(-1) || r === clean[0])) el('text', { x:cx + 10, y:cy - 8, class:'lbl num' }, svg).textContent = Math.round(v);
    const pace = fmtDur(r.jogPaceSec ?? r.avgPaceSec);
    const kind = r.jogHr != null ? 'jogging HR' : 'avg HR (whole run)';
    const hit = el('circle', { cx, cy, r:14, fill:'transparent', style:'cursor:pointer' }, svg);
    hit.addEventListener('click', () => { location.hash = 'runs/' + r.id; });
    tipOn(hit, `<b>${fmtDate(r.date)}</b><br>${Math.round(v)} bpm ${kind} · ${pace} /mi<br>${ok ? '✓ Clean test-route run' : '✕ Excluded: ' + exclusionReasons(r).join(' · ')}`);
  });
}

function chartColumns(host, { cats, series, max, ticks, fmt, guard, labelFmt, tipFmt, onClick }){
  const H = 210, m = { t:20, r:12, b:28, l:36 };
  const [svg, W] = svgFor(host, H);
  const y = v => m.t + (max - v) / max * (H - m.t - m.b);
  hGrid(svg, ticks ?? niceTicks(0, max, max <= 5 ? 1 : 5), y, m.l, W - m.r, fmt);
  const band = (W - m.l - m.r) / Math.max(cats.length, 1);
  const bw = Math.min(24, band * 0.55);
  cats.forEach((c, i) => {
    const cx = m.l + band * i + band / 2;
    let acc = 0;
    series.forEach((s, si) => {
      const v = Math.min(c[s.key] ?? 0, max - acc);
      if (v <= 0) return;
      const y0 = y(acc), y1 = y(acc + v), gap = acc > 0 ? 2 : 0;
      const top = series.slice(si + 1).every(s2 => !(c[s2.key] > 0));
      if (top) el('path', { d:colPath(cx - bw / 2, y1, bw, y0 - gap), fill:s.color }, svg);
      else el('rect', { x:cx - bw / 2, y:y1, width:bw, height:Math.max(0, y0 - y1 - gap), fill:s.color }, svg);
      acc += v;
    });
    if (labelFmt && band > 34) el('text', { x:cx, y:y(acc) - 6, 'text-anchor':'middle', class:'lbl num' }, svg).textContent = labelFmt(c);
    if (band > 30 || i % Math.ceil(30 / band) === 0)
      el('text', { x:cx, y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = c.date.slice(5).replace('-', '/');
    const hit = el('rect', { x:cx - band / 2 + 2, y:m.t, width:Math.max(band - 4, 4), height:H - m.t - m.b, fill:'transparent', style:onClick ? 'cursor:pointer' : '' }, svg);
    tipOn(hit, tipFmt(c));
    if (onClick) hit.addEventListener('click', () => onClick(c));
  });
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  if (guard != null) el('line', { x1:m.l, x2:W - m.r, y1:y(guard), y2:y(guard), stroke:css('--crit'), 'stroke-width':1.5 }, svg);
}

function chartLine(host, pts, { lo = 0, hi, step, tipFmt }){
  const H = 210, m = { t:22, r:24, b:28, l:36 };
  const [svg, W] = svgFor(host, H);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const x = i => pts.length === 1 ? (m.l + W - m.r) / 2 : m.l + 16 + i * (W - m.l - m.r - 32) / (pts.length - 1);
  hGrid(svg, niceTicks(lo, hi, step), y, m.l, W - m.r);
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  if (pts.length > 1) el('path', { d:pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.v)}`).join(' '), fill:'none',
    stroke:css('--series-1'), 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  const labelEvery = Math.ceil(pts.length / 8);
  pts.forEach((p, i) => {
    el('circle', { cx:x(i), cy:y(p.v), r:4.5, fill:css('--series-1'), stroke:css('--surface'), 'stroke-width':2 }, svg);
    if (i === 0 || i === pts.length - 1) el('text', { x:x(i), y:y(p.v) - 11, 'text-anchor':'middle', class:'lbl num' }, svg).textContent = p.v;
    if (i % labelEvery === 0 || i === pts.length - 1) el('text', { x:x(i), y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = p.r.date.slice(5).replace('-', '/');
    tipOn(el('circle', { cx:x(i), cy:y(p.v), r:14, fill:'transparent' }, svg), tipFmt(p));
  });
}

// One run's heart rate over time, zone bands behind, run/walk strip below.
function chartTrace(host, s){
  const H = 280, m = { t:12, r:74, b:46, l:40 };
  const [svg, W] = svgFor(host, H);
  const p = doc.profile;
  const hrs = s.hr.filter(v => v != null);
  if (!hrs.length){ host.innerHTML = '<div class="pending-box">No heart rate in this file.</div>'; return; }
  const lo = Math.min(100, Math.floor((Math.min(...hrs) - 5) / 10) * 10);
  const hi = Math.max(190, Math.ceil((Math.max(...hrs) + 3) / 10) * 10);
  const tMax = s.t.at(-1) || 1;
  const x = t => m.l + t / tMax * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const bands = [[lo, p.zones.easy, '--z-easy', 'Easy'], [p.zones.easy, p.zones.mod, '--z-mod', 'Moderate'], [p.zones.mod, p.lthr, '--z-hard', 'Hard'], [p.lthr, hi, '--z-above', 'Above LT']];
  bands.forEach(([a, b, c, label]) => {
    el('rect', { x:m.l, y:y(b), width:W - m.l - m.r, height:y(a) - y(b), fill:css(c), 'fill-opacity':.1 }, svg);
    el('text', { x:W - m.r + 8, y:(y(a) + y(b)) / 2 + 4 }, svg).textContent = label;
  });
  hGrid(svg, niceTicks(lo, hi, 20), y, m.l, W - m.r);
  el('line', { x1:m.l, x2:W - m.r, y1:y(p.lthr), y2:y(p.lthr), stroke:css('--crit'), 'stroke-width':1.5 }, svg);
  const tickStep = tMax > 1800 ? 300 : tMax > 600 ? 120 : 60;
  for (let t = 0; t <= tMax; t += tickStep) el('text', { x:x(t), y:H - m.b + 32, 'text-anchor':'middle', class:'num' }, svg).textContent = fmtDur(t);
  let d = '', pen = false;
  s.t.forEach((t, i) => {
    const v = s.hr[i];
    if (v == null || (i && t - s.t[i-1] > 5)){ pen = false; if (v == null) return; }
    d += `${pen ? 'L' : 'M'}${x(t).toFixed(1)},${y(v).toFixed(1)}`; pen = true;
  });
  el('path', { d, fill:'none', stroke:css('--series-1'), 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  // run / walk / idle strip
  const stripY = H - m.b + 8, colors = [css('--muted'), css('--walk'), css('--series-1')];
  let i0 = 0;
  for (let i = 1; i <= s.t.length; i++){
    if (i === s.t.length || s.st[i] !== s.st[i0]){
      const x0 = x(s.t[i0]), x1 = x(i === s.t.length ? tMax : s.t[i]);
      el('rect', { x:x0, y:stripY, width:Math.max(x1 - x0 - (i === s.t.length ? 0 : 2), 1), height:8, rx:2, fill:colors[s.st[i0]], opacity:s.st[i0] === 0 ? .5 : 1 }, svg);
      i0 = i;
    }
  }
  // crosshair
  const cross = el('line', { y1:m.t, y2:H - m.b, stroke:css('--ink'), opacity:0 }, svg);
  const dot = el('circle', { r:4.5, fill:css('--series-1'), stroke:css('--surface'), 'stroke-width':2, opacity:0 }, svg);
  const hit = el('rect', { x:m.l, y:m.t, width:W - m.l - m.r, height:H - m.t, fill:'transparent' }, svg);
  const STATE = ['standing', 'walking', 'jogging'];
  hit._tip = e => {
    const r = svg.getBoundingClientRect();
    const t = (e.clientX - r.left - m.l) / (W - m.l - m.r) * tMax;
    let a = 0, b = s.t.length - 1;
    while (b - a > 1){ const mid = (a + b) >> 1; if (s.t[mid] < t) a = mid; else b = mid; }
    const i = Math.abs(s.t[a] - t) < Math.abs(s.t[b] - t) ? a : b;
    cross.setAttribute('x1', x(s.t[i])); cross.setAttribute('x2', x(s.t[i])); cross.setAttribute('opacity', .3);
    if (s.hr[i] != null){ dot.setAttribute('cx', x(s.t[i])); dot.setAttribute('cy', y(s.hr[i])); dot.setAttribute('opacity', 1); }
    const pace = s.spd[i] > 30 ? `${fmtDur(MI / (s.spd[i] / 100))} /mi` : '—';
    return `<b>${fmtDur(s.t[i])}</b> · ${STATE[s.st[i]]}<br>${s.hr[i] ?? '—'} bpm · ${pace}${s.cad[i] ? ` · ${s.cad[i]} spm` : ''}`;
  };
  hit._tipOut = () => { cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); };
}

function routeSvg(path){
  if (!path || path.length < 2) return '';
  const lat0 = path[0][0] * Math.PI / 180;
  const pts = path.map(([la, lo]) => [lo * Math.cos(lat0), -la]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const span = Math.max(x1 - x0, y1 - y0) || 1, W = 300, H = 180, padd = 16;
  const k = Math.min((W - 2 * padd) / (x1 - x0 || span), (H - 2 * padd) / (y1 - y0 || span));
  const ox = (W - (x1 - x0) * k) / 2, oy = (H - (y1 - y0) * k) / 2;
  const P = pts.map(([px, py]) => [ox + (px - x0) * k, oy + (py - y0) * k]);
  const d = P.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('');
  return `<svg class="route-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-label="Route shape">
    <path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${P.at(-1)[0]}" cy="${P.at(-1)[1]}" r="5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${P[0][0]}" cy="${P[0][1]}" r="6" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/>
  </svg>`;
}

const tip = $('#tip');
let lastTipTarget = null;
document.addEventListener('pointermove', e => {
  const t = e.target.closest?.('[data-tip]');
  const live = e.target._tip ? e.target : null;
  if (lastTipTarget && lastTipTarget !== live && lastTipTarget._tipOut) lastTipTarget._tipOut();
  lastTipTarget = live;
  const html = live ? live._tip(e) : t?.dataset.tip;
  if (!html){ tip.classList.remove('show'); return; }
  tip.innerHTML = html; tip.classList.add('show');
  const r = tip.getBoundingClientRect();
  let lx = e.clientX + 14, ly = e.clientY - r.height - 12;
  if (lx + r.width > innerWidth - 8) lx = e.clientX - r.width - 14;
  if (ly < 8) ly = e.clientY + 16;
  tip.style.left = lx + 'px'; tip.style.top = ly + 'px';
});

  red: '<b>Stop running and get it looked at.</b> One calf much worse than the other, shin-bone pain, or Achilles tightness getting out of bed are the plan’s hard stops.',
};

function taskHTML(key, main, sub, meta){
  const on = !!doc.done[key];
  return `<li><button class="task" data-task="${esc(key)}" aria-pressed="${on}">
    <span class="box">${CHECK}</span>
    <span><div class="t-main">${main}</div>${sub ? `<div class="t-sub">${sub}</div>` : ''}</span>
    ${meta ? `<span class="t-meta">${meta}</span>` : ''}
  </button></li>`;
}
const tasksFor = (date, ids) => ids.map(id => taskHTML(`${date}|${id}`, ...TASKS[id])).join('');

// Shared poster band at the top of every page.
function band({ eyebrow, title, sub = '', stats = [], extra = '' }){
  return `<section class="band"><div class="band-stripes"></div><div class="band-in">
    <div><div class="eyebrow">${eyebrow}</div><h1 class="band-title display">${title}</h1>${sub ? `<p class="band-sub">${sub}</p>` : ''}</div>
    ${stats.length ? `<div class="band-stats">${stats.map(([l, v, u]) => `<div class="bstat"><div class="bstat-v display num">${v}${u ? `<small>${u}</small>` : ''}</div><div class="bstat-l">${l}</div></div>`).join('')}</div>` : ''}
    ${extra ? `<div class="band-wide">${extra}</div>` : ''}
  </div></section>`;
}

function checkinCards(){
  const pc = pendingCheckin();
  let html = '';
  if (pc){
    const dn = DOW_LONG[parseYmd(pc.run.date).getDay()];
    html = `<div class="card">
      <div class="card-head"><h2>How are the legs after ${dn}’s run?</h2><span class="card-sub">${pc.stage === '48' ? '48-hour check' : '~' + Math.round(pc.hours) + ' hrs after'}</span></div>
      <div class="pill-row">${Object.entries(SORE).map(([k, l]) => `<button class="pill${k === 'red' ? ' flag' : ''}" data-checkin="${k}" data-run="${pc.run.id}" data-stage="${pc.stage}">${l}</button>`).join('')}</div>
    </div>`;
  }
  if (lastResponse){
    html += `<div class="card"><div class="card-head"><h2>Logged</h2><button class="link-btn" data-action="undo-checkin">Undo</button></div>
      <div class="response show${lastResponse.alarm ? ' alarm' : ''}" style="margin-top:0">${lastResponse.html}</div></div>`;
  }
  return html ? `<div class="grid" style="margin-bottom:16px">${html}</div>` : '';
}

function todayNotes(today){
  const notes = [];
  const recent = sortedRuns().filter(r => diffDays(r.date, today) <= 7);
  if (coached()) for (let i = 1; i < recent.length; i++){
    if (diffDays(recent[i - 1].date, recent[i].date) === 1){
      notes.push(`<b>${DOW[parseYmd(recent[i - 1].date).getDay()]} and ${DOW[parseYmd(recent[i].date).getDay()]} were back-to-back.</b> The plan wants a rest or walk day between runs — the schedule keeps a gap from here.`);
      break;
    }
  }
  const manual = doc.runs.filter(r => r.source === 'manual').length;
  if (manual) notes.push(`<b>${manual} run${manual > 1 ? 's are' : ' is'} from your notes, not FIT files.</b> <a href="#setup">Upload ${manual > 1 ? 'them' : 'it'}</a> for jogging-only HR, zones and time above ${doc.profile.lthr}.`);
  if (!doc.runs.length) notes.push(`<b>No runs yet.</b> ${doc.intervals?.key ? 'Your next run will appear here once your watch syncs.' : `<a href="#setup">Connect intervals.icu</a> so runs arrive on their own, or upload a FIT file.`}${syncOn() && !SESSION ? ' Sign in under Setup to keep your runs on every device.' : ''}`);
  if (doc.profile.zonesSet === false){
    const glt = sortedRuns().reverse().find(r => r.garminLthr)?.garminLthr;
    notes.push(`<b>These are placeholder heart-rate zones.</b> ${glt ? `Your watch puts your threshold at ${glt} bpm. ` : ''}<a href="#setup">Set your own in Setup</a> — every number here is anchored to them.`);
  }
  if (!testRoute() && doc.runs.some(r => r.source === 'fit')) notes.push('<b>No test route set yet.</b> Open a run on a flat route you’ll repeat and tap “Make this the test route” — it’s what makes the heart-rate trend fair.');
  return notes.map(n => `<div class="note">${WARN_SVG}<div>${n}</div></div>`).join('');
}

function renderToday(){
  const today = todayYmd(), now = new Date();
  const dateLine = `${DOW_LONG[now.getDay()]} · ${MON_LONG[now.getMonth()]} ${now.getDate()}`;
  const red = redFlagActive();
  const ranYesterday = runsOn(addDays(today, -1)).length > 0;
  const todayRuns = runsOn(today);
  const ws = weekStart(today);
  const weekRuns = doc.runs.filter(r => r.date >= ws);
  const weekMi = weekRuns.reduce((a, r) => a + (r.distMi ?? 0), 0);

  if (!coached()){
    const last = sortedRuns().at(-1);
    const title = todayRuns.length ? 'Run <em>logged</em>' : red ? 'Get it <em>checked</em>' : 'This <em>week</em>';
    const sub = red ? 'A hard-stop symptom is logged. No running until a doctor or physical therapist has looked at it.'
      : last ? `Last run ${fmtRel(last.date).toLowerCase()}: ${fmtMi(last.distMi)} mi in ${fmtDur(last.timerSec)}, ${last.jogHr != null ? `jogging HR ${Math.round(last.jogHr)}` : `avg HR ${num(last.avgHr)}`}.`
      : 'Nothing logged yet. Runs show up here as soon as your watch syncs.';
    const strip = `<div class="card"><div class="card-head"><h2>Last 7 days</h2><span class="card-sub">tap a run to open it</span></div>
      <div class="days">${Array.from({ length:7 }, (_, i) => addDays(today, i - 6)).map((d, i) => {
        const rr = runsOn(d), dd = parseYmd(d);
        return `<${rr.length ? `a href="#runs/${rr[0].id}"` : 'div'} class="day${i === 6 ? ' today' : ''}" style="text-decoration:none;color:inherit">
          <div class="d-name">${DOW[dd.getDay()]}</div><div class="d-num num">${dd.getDate()}</div>
          <div class="d-tag ${rr.length ? 'tag-run' : 'tag-rest'}">${rr.length ? fmtMi(rr.reduce((a, r) => a + r.distMi, 0)) : '—'}</div></${rr.length ? 'a' : 'div'}>`;
      }).join('')}</div></div>`;
    $('#page-today').innerHTML = band({
      eyebrow: `${dateLine} · just tracking`, title, sub,
      stats: [['Runs this week', weekRuns.length], ['Miles', weekMi.toFixed(1)], ['Jogging', Math.round(weekRuns.reduce((a, r) => a + (r.runSec ?? 0), 0) / 60), 'min']],
      extra: red ? `<button class="btn small" data-action="clear-red">I’ve been cleared to run</button>` : '',
    }) + `<div class="wrap">${checkinCards()}
      <div class="grid three">${strip}${bodyTodayCard()}${lastRunCard(last)}</div>
      <div class="grid" style="margin-top:16px">${todayNotes(today)}</div></div>`;
    return;
  }

  const weeks = planState(), cur = weeks.at(-1), pw = cur.planWeek, len = planLen();
  const days = schedule(today, 7), t = days[0];
  const pwo = planWeekObj(pw);
  let eyebrow = `${dateLine} · today’s assignment`, title, copy, tasks;
  if (red){
    eyebrow = `${dateLine} · plan paused`;
    title = 'Get it <em>checked</em>';
    copy = 'A hard-stop symptom is logged. No running until a doctor or physical therapist has looked at it. Walking and the hip stretch are fine if they don’t hurt.';
    tasks = tasksFor(today, ['hip']) + `<li><button class="btn small" data-action="clear-red">I’ve been cleared to run</button></li>`;
  } else if (t.kind === 'done'){
    const r = todayRuns.at(-1);
    title = 'Run <em>done</em>';
    copy = `${fmtMi(r.distMi)} mi · ${fmtDur(r.runSec)} jogging · ${r.jogHr != null ? `jogging HR ${Math.round(r.jogHr)}` : `avg HR ${r.avgHr}`}${r.recoveryHr != null ? ` · recovery ${r.recoveryHr}` : ''}. Stretch the calves tonight; there’s a soreness check tomorrow.`;
    tasks = tasksFor(today, ['calf', 'roll', 'hip']);
  } else if (t.kind === 'ref'){
    title = 'Sport <em>day</em>';
    copy = 'Not a rest day — another sport still loads the legs. Stretch between sessions, and skip the next run if the legs are done.';
    tasks = tasksFor(today, ['sporthip', 'calf']);
  } else if (t.kind === 'run'){
    const s = sessionFor(pw, t.slot, today);
    eyebrow = `${dateLine} · week ${Math.min(pw, len)}, run ${t.slot}`;
    title = esc(s.title).replace(/^(\S+)/, '$1 <em>') + '</em>';
    copy = `${s.detail}.${s.extra ? ' ' + s.extra + '.' : ''}${t.note ? ' ' + t.note + '.' : ''}${isMarathon() ? '' : ' The protocol is below.'}`;
    tasks = tasksFor(today, ['hip', 'calf']);
  } else {
    title = 'Rest <em>day</em>';
    copy = isRef(addDays(today, 1)) ? 'Sport day tomorrow — rest today and go in fresh. Mobility only.'
      : ranYesterday ? 'You ran yesterday. The 24–48 hours after a run are when soreness peaks — let the legs settle. Mobility only.'
      : t.note === 'Week’s runs are in' ? 'This week’s three runs are in. A walk is fine; keep the stretching going.'
      : 'Mobility only today.';
    tasks = tasksFor(today, ranYesterday ? ['hip', 'calf', 'roll', 'bridge'] : ['hip', 'bridge']);
  }

  // Next run
  const nr = days.find(d => d.kind === 'run');
  let next;
  if (red) next = `<div class="card"><div class="card-head"><h2>Next run</h2></div><div class="next-run-big display">On hold</div><p class="card-sub" style="margin:0">Resume at the week you were on once you’re cleared.</p></div>`;
  else if (!nr) next = `<div class="card"><div class="card-head"><h2>Next run</h2></div><p class="card-sub" style="margin:0">Nothing scheduled in the next 7 days — tap a day in “Next 7 days” to change sport days.</p></div>`;
  else {
    const nwk = diffDays(cur.start, nr.date) >= 7 ? Math.min(cur.gate.auto === 'advance' ? pw + 1 : pw, len) : Math.min(pw, len);
    const s = sessionFor(nwk, nr.slot, nr.date);
    next = `<div class="card">
      <div class="card-head"><h2>${nr.date === today ? 'Today’s run' : 'Next run'}</h2><span class="card-sub">${fmtRel(nr.date)}${fmtRel(nr.date).includes(',') ? '' : ' · ' + fmtDate(nr.date)} · week ${nwk}, run ${nr.slot}</span></div>
      <div class="next-run-big display">${esc(s.title)}</div>
      <div class="card-sub">${esc(s.detail)}${s.extra ? '. ' + esc(s.extra) : ''}</div>
      ${isMarathon() ? `<div class="kv">
        <div>Distance<b class="num">${s.mi} mi</b></div>
        <div>Effort<b>${/marathon effort/.test(s.title) ? 'Easy, then marathon effort' : s.title === 'Race day' ? 'Even, patient' : 'Easy enough to talk'}</b></div>
        <div>Easy means HR under<b class="num">${doc.profile.zones.easy}</b></div>
        ${s.mi >= 12 ? `<div>Fuel<b>Every 30–45 min after hour 1</b></div>` : ''}
      </div>` : `<div class="kv">
        <div>Pace<b>Easy enough to talk</b></div>
        <div>Route<b>Flat test route</b></div>
        <div>Walk break if HR<b class="num">&gt; ${doc.profile.zones.mod}</b></div>
        <div>Ceiling<b class="num">${doc.profile.lthr} bpm</b></div>
      </div>`}
      ${isMarathon() ? '' : `<details class="protocol" style="margin-top:18px"${nr.date === today ? ' open' : ''}>
        <summary><span class="eyebrow" style="color:var(--ink-2)">Run protocol · 6 steps</span><svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></summary>
        <ul class="task-list">${PROTOCOL(doc.profile).map(([id, mm, sub], i) => taskHTML(`${nr.date}|${id}`, `${i + 1}. ${mm}`, sub)).join('')}</ul>
        <p class="card-sub" style="margin:12px 0 0">Auto-pause off. Same time of day where you can. Uploads that break steps 1, 4 or 5 get flagged and kept out of the trend lines.</p>
      </details>`}
    </div>`;
  }

  const g = cur.gate;
  const gate = `<div class="card">
    <div class="card-head"><h2>Week ${Math.min(pw, len)} gate</h2><span class="card-sub">decides Sunday night</span></div>
    <ul class="status-list">${g.items.map(([st, mm, sub]) => `<li class="status-row">${statusIcon(st)}<span><div class="s-main">${mm}</div><div class="s-sub">${sub}</div></span></li>`).join('')}</ul>
    <div class="verdict">${statusIcon(g.verdict[0])}<span><strong>${g.verdict[1]}</strong> ${g.verdict[2]}</span></div>
  </div>`;

  const TAG = { run:['run', 'Run'], done:['done', 'Done'], ref:['ref', 'Sport'], rest:['rest', 'Rest'] };
  const strip = `<div class="card">
    <div class="card-head"><h2>Next 7 days</h2><span class="card-sub">tap a day with another sport</span></div>
    <div class="days">${days.map((d, i) => {
      const dd = parseYmd(d.date), [k, l] = TAG[d.kind];
      return `<button class="day${i === 0 ? ' today' : ''}" data-refday="${d.date}" ${d.kind === 'done' ? 'disabled' : ''} style="cursor:${d.kind === 'done' ? 'default' : 'pointer'};font:inherit;color:inherit" ${d.note ? `data-tip="${esc(d.note)}"` : ''}>
        <div class="d-name">${DOW[dd.getDay()]}</div><div class="d-num num">${dd.getDate()}</div><div class="d-tag tag-${k}">${l}${d.kind === 'run' && d.note ? '?' : ''}</div></button>`;
    }).join('')}</div>
    <div class="plan-bar" style="grid-template-columns:repeat(${len},1fr);margin-top:18px">${activePlan().weeks.map((_, i) => `<div class="plan-seg${i + 1 < pw ? ' done' : i + 1 === pw ? ' now' : ''}"></div>`).join('')}</div>
    <p class="card-sub" style="margin:10px 0 0">${pw < len ? `Week ${pw + 1}: ${[planWeekObj(pw + 1).detail, planWeekObj(pw + 1).add].filter(Boolean).map(x => esc(x.charAt(0).toLowerCase() + x.slice(1))).join('. ')}.` : isMarathon() ? 'Race week. The work is done — rest, eat, sleep.' : 'Final week. After this, re-test on the flat route and pick what’s next on the Plan tab.'}</p>
  </div>`;

  const runsDone = weekRuns.length;
  $('#page-today').innerHTML = band({
    eyebrow, title, sub: copy,
    stats: [[`Week · ${esc(pwo.phase)}`, Math.min(pw, len), `/${len}`], ['Runs this week', Math.min(runsDone, 9), `/${pwo.runs?.length ?? 3}`],
      isMarathon() ? ['Race in', Math.max(0, diffDays(today, doc.race.date)), 'days'] : ['Miles this week', weekMi.toFixed(1)]],
    extra: `<ul class="task-list">${tasks}</ul>`,
  }) + `<div class="wrap">${checkinCards()}
    <div class="grid three">${gate}${strip}${bodyTodayCard()}</div>
    <div class="grid today-grid" style="margin-top:16px"><div class="col">${next}</div><div class="col">${todayNotes(today) || lastRunCard(sortedRuns().at(-1))}</div></div>
  </div>`;
}

function lastRunCard(r){
  if (!r) return '';
  return `<a class="card card-link" href="#runs/${r.id}">
    <div class="card-head"><h2>Last run</h2><span class="card-sub">${fmtRel(r.date)}</span></div>
    <div class="next-run-big display num">${fmtMi(r.distMi)}<span style="font-size:.45em"> mi</span></div>
    <div class="kv">
      <div>Time<b class="num">${fmtDur(r.timerSec)}</b></div>
      <div>${r.jogHr != null ? 'Jog HR' : 'Avg HR'}<b class="num">${r.jogHr != null ? Math.round(r.jogHr) : num(r.avgHr)}</b></div>
      <div>Pace<b class="num">${fmtDur(r.avgPaceSec)}</b></div>
    </div></a>`;
}

/* ═══ PROGRESS ═══════════════════════════════════════════════════════ */
function renderProgress(){
  const runs = sortedRuns(), p = doc.profile;
  const page = $('#page-progress');
  if (!runs.length){
    page.innerHTML = band({ eyebrow:'No runs yet', title:'Progress' }) + `<div class="wrap">
      <div class="empty"><b>Nothing to chart yet.</b><br>Runs appear once your watch syncs, or upload a FIT file. <a href="#setup">Go to Setup</a></div></div>`;
    return;
  }
  const clean = runs.filter(isClean);
  const lastClean = clean.at(-1), firstClean = clean[0];
  const rec = runs.filter(r => r.recoveryHr != null);
  const lastRun = runs.at(-1);
  const delta = (a, b, lowerBetter) => {
    if (a == null || b == null || a === b) return '';
    const d = Math.round((a - b) * 10) / 10, good = lowerBetter ? d < 0 : d > 0;
    return ` <span style="color:var(--${good ? 'good' : 'warn'}-text);font-weight:700">${d > 0 ? '+' : ''}${d} vs first</span>`;
  };

  const kpiHr = lastClean
    ? `<div class="k-val display num">${Math.round(hrMetric(lastClean))}<span class="k-unit">bpm</span></div>
       <span class="k-dir">↓ Lower is better</span>
       <div class="k-foot">${lastClean.jogHr != null ? 'Jogging only' : 'Whole-run average'} at <b>${fmtDur(lastClean.jogPaceSec ?? lastClean.avgPaceSec)} /mi</b>, ${fmtDate(lastClean.date)}.${clean.length > 1 ? delta(hrMetric(lastClean), hrMetric(firstClean), true) : ' The baseline — the same pace should cost fewer beats every few weeks.'}</div>`
    : `<div class="k-val display num">—</div><div class="k-foot">No clean test-route run yet. Run the protocol on the flat route.</div>`;
  const kpiRec = rec.length
    ? `<div class="k-val display num">${rec.at(-1).recoveryHr}<span class="k-unit">bpm</span></div>
       <span class="k-dir">↑ Higher is better</span>
       <div class="k-foot">${fmtDate(rec.at(-1).date)}.${rec.length > 1 ? delta(rec.at(-1).recoveryHr, rec[0].recoveryHr, false) : ' Moves before pace does. Only counts when you stand still 2 min before saving.'}</div>`
    : `<div class="k-val display num">—</div><div class="k-foot">Not captured yet. Stop the timer, stand still 2 minutes, then save.</div>`;
  const teRuns = runs.filter(r => r.anaerobicTE != null).slice(-6);
  const kpiTe = `<div class="k-val display num">${num(lastRun.anaerobicTE, 1)}<span class="k-unit">last run</span></div>
    <span class="k-dir">→ Stay near 0.0</span>
    <div class="te-strip">${teRuns.map(r => { const ok = r.anaerobicTE <= 1.0;
      return `<div class="te-cell" data-tip="${esc(fmtDate(r.date))} · ${ok ? 'easy' : 'too hard for an easy run'}"><b class="num"><i style="background:var(--${ok ? 'good' : 'crit'})"></i>${r.anaerobicTE.toFixed(1)}</b>${fmtDate(r.date).slice(4)}</div>`; }).join('')}</div>`;

  const withS = runs.filter(r => r.aboveLtSec != null);
  const recent = runs.slice(-12);
  const latest = k => [...runs].reverse().find(r => r[k] != null)?.[k];

  const totMi = runs.reduce((a, r) => a + (r.distMi ?? 0), 0), totJog = runs.reduce((a, r) => a + (r.runSec ?? 0), 0);
  page.innerHTML = band({
    eyebrow: `Since ${fmtDate(runs[0].date).slice(4)}${firstClean ? ` · baseline ${fmtDate(firstClean.date).slice(4)}` : ''}`,
    title: 'Pro<em>gress</em>',
    sub: 'The question every chart answers: is the same effort costing fewer heartbeats?',
    stats: [['Runs', runs.length], ['Clean on test route', clean.length], ['Miles', totMi.toFixed(1)], ['Hours jogging', (totJog / 3600).toFixed(1)]],
  }) + `<div class="wrap">
    <div class="grid kpis">
      <div class="card kpi"><div class="eyebrow">${lastClean?.jogHr != null ? 'Jogging HR' : 'Avg HR'} · test route</div>${kpiHr}</div>
      <div class="card kpi"><div class="eyebrow">Recovery HR · 2-min drop</div>${kpiRec}</div>
      <div class="card kpi"><div class="eyebrow">Anaerobic TE · easy runs</div>${kpiTe}</div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="card-head"><div><h2>Heart rate on the test route</h2>
        <div class="card-sub">Only clean runs on the flat route count toward the trend. Jogging-only HR where there’s a FIT file; whole-run average otherwise.</div></div></div>
      <div class="legend">
        <span><i class="dotf" style="background:var(--series-1)"></i>Clean test-route run</span>
        <span><i class="ring"></i>Excluded — hover for why</span>
        <span><i style="background:var(--series-1-wash);border:1px solid var(--series-1)"></i>Easy zone (&lt; ${p.zones.easy})</span>
      </div>
      <div class="chart" id="c-hr"></div>
    </div>
    <div class="eyebrow" style="margin:28px 0 12px">Secondary</div>
    <div class="grid two">
      <div class="card"><div class="card-head"><h2>Jogging vs walking</h2><span class="card-sub">minutes per run</span></div>
        <div class="legend"><span><i style="background:var(--series-1)"></i>Jog</span><span><i style="background:var(--walk)"></i>Walk</span></div>
        <div class="chart" id="c-jog"></div></div>
      <div class="card"><div class="card-head"><h2>Recovery HR</h2><span class="card-sub">2-min drop · higher is better</span></div>
        ${rec.length ? '<div class="chart" id="c-rec"></div>' : '<div class="pending-box">No recovery HR captured yet.<br>Stand still 2 min before saving, or type it in on a run’s page.</div>'}</div>
      <div class="card"><div class="card-head"><h2>Max HR per run</h2><span class="card-sub">guardrail ~${p.guardHr}</span></div>
        <div class="legend"><span><i style="background:var(--series-1)"></i>Max HR</span><span><i style="background:var(--crit);height:2px;border-radius:0"></i>Guardrail</span></div>
        <div class="chart" id="c-max"></div></div>
      <div class="card"><div class="card-head"><h2>Time above ${p.lthr} bpm</h2><span class="card-sub">should trend to zero</span></div>
        ${withS.length ? '<div class="chart" id="c-lt"></div>' : '<div class="pending-box">Needs second-by-second HR from a FIT file.<br>Fills in with your first upload.</div>'}</div>
      <div class="card"><div class="card-head"><h2>Exercise load</h2><span class="card-sub">lower for the same work is better</span></div>
        <div class="chart" id="c-load"></div></div>
      <div class="card"><div class="card-head"><h2>Cardiac drift</h2><span class="card-sub">2nd half vs 1st half of the jogging</span></div>
        ${runs.some(r => r.drift != null) ? '<div class="chart" id="c-drift"></div>' : '<div class="pending-box">Needs a FIT file with 8+ minutes of jogging.<br>Small drift means you’re ready to go longer.</div>'}</div>
    </div>
    <div class="card" style="margin-top:16px">
      <details class="stored"><summary><span>Stored, not charted as progress</span><span class="card-sub">latest values ›</span></summary>
        <table class="quiet" style="margin-top:10px">
          <tr><td>Jogging cadence</td><td>${num(latest('cadence'))} spm</td><td>From jog segments only — the blended average is meaningless</td></tr>
          <tr><td>Stride length</td><td>${num(latest('stride'), 2)} m</td><td>Holding it while pace dropped was the overstriding fix</td></tr>

          <tr><td>Ground contact</td><td>${num(latest('gct'))} ms</td><td>Rises as you slow down — pace-dependent</td></tr>

  });

    lo: 0, hi: Math.max(50, Math.ceil(Math.max(...rec.map(r => r.recoveryHr)) / 10) * 10 + 10), step: 10,

  chartColumns($('#c-max'), {

// A daily series on a real date axis, so missed days leave gaps instead of
// squeezing the line. `smooth` draws raw days as faint dots under a 7-day mean.
function chartDaily(host, pts, { days, unit = '', step, dec = 0, smooth = false, bars = false, gapDays = 10 }){
  const H = 200, m = { t:22, r:44, b:28, l:38 };
  const [svg, W] = svgFor(host, H);
  const end = todayYmd(), start = addDays(end, -days + 1);
  pts = pts.filter(p => p.date >= start);
  if (!pts.length){ host.innerHTML = '<div class="pending-box">Nothing in this range yet.</div>'; return; }
  const vals = pts.map(p => p.v);
  let lo = bars ? 0 : Math.floor((Math.min(...vals) - step / 2) / step) * step, hi = Math.ceil((Math.max(...vals) + step / 2) / step) * step;
  if (hi - lo < step * 2) hi = lo + step * 2;
  const x = d => m.l + (diffDays(start, d) + .5) / days * (W - m.l - m.r);
  const y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const f = v => Number(v).toFixed(dec);
  hGrid(svg, niceTicks(lo, hi, step), y, m.l, W - m.r, v => step < 1 ? f(v) : String(Math.round(v)));
  el('line', { x1:m.l, x2:W - m.r, y1:H - m.b, y2:H - m.b, stroke:css('--axis') }, svg);
  const tickEvery = days <= 31 ? 7 : days <= 92 ? 14 : 61;
  for (let d = 0; d < days; d += tickEvery){
    const dd = addDays(start, d);
    el('text', { x:x(dd), y:H - m.b + 18, 'text-anchor':'middle' }, svg).textContent = `${MON[parseYmd(dd).getMonth()]} ${parseYmd(dd).getDate()}`;
  }
  const c = css('--series-1'), surf = css('--surface');
  const band = (W - m.l - m.r) / days;
  let line = pts;
  if (bars){
    const bw = Math.max(2, Math.min(14, band - 2));
    pts.forEach(p => el('path', { d:colPath(x(p.date) - bw / 2, y(p.v), bw, y(lo)), fill:c }, svg));
  } else if (smooth){
    pts.forEach(p => el('circle', { cx:x(p.date), cy:y(p.v), r:3, fill:c, 'fill-opacity':.28 }, svg));
    line = pts.map(p => ({ date:p.date, v:windowAvg(pts, 7, p.date) }));
  }
  if (!bars && line.length > 1){
    let d = '';
    line.forEach((p, i) => { const gap = i && diffDays(line[i - 1].date, p.date) > gapDays; d += `${!i || gap ? 'M' : 'L'}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`; });
    el('path', { d, fill:'none', stroke:c, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, svg);
  }
  if (!bars && !smooth) pts.forEach(p => el('circle', { cx:x(p.date), cy:y(p.v), r:pts.length > 40 ? 2.5 : 4, fill:c, stroke:surf, 'stroke-width':pts.length > 40 ? 0 : 2 }, svg));
  const lastP = line.at(-1);
  el('circle', { cx:x(lastP.date), cy:y(lastP.v), r:5, fill:c, stroke:surf, 'stroke-width':2 }, svg);
  el('text', { x:x(lastP.date) + 8, y:y(lastP.v) + 4, class:'lbl num' }, svg).textContent = f(lastP.v);
  // hover: nearest day
  const cross = el('line', { y1:m.t, y2:H - m.b, stroke:css('--ink'), opacity:0 }, svg);
  const hit = el('rect', { x:m.l, y:m.t, width:W - m.l - m.r, height:H - m.t - m.b, fill:'transparent' }, svg);
  hit._tip = e => {
    const r = svg.getBoundingClientRect(), dx = (e.clientX - r.left - m.l) / (W - m.l - m.r) * days;
    const want = addDays(start, Math.round(dx - .5));
    const p = pts.reduce((a, b) => Math.abs(diffDays(b.date, want)) < Math.abs(diffDays(a.date, want)) ? b : a);
    cross.setAttribute('x1', x(p.date)); cross.setAttribute('x2', x(p.date)); cross.setAttribute('opacity', .3);
    const avg = smooth ? windowAvg(pts, 7, p.date) : null;
    return `<b>${fmtDate(p.date)}</b><br>${f(p.v)} ${unit}${avg != null ? ` · 7-day avg ${f(avg)}` : ''}${p.src === 'manual' ? ' · weigh-in' : ''}`;
  };
  hit._tipOut = () => cross.setAttribute('opacity', 0);
}

function bodyStat(label, pts, { unit = '', dec = 0, days = 7, lowerBetter = null } = {}){
  const now = windowAvg(pts, days), before = windowAvg(pts, days, addDays(todayYmd(), -28));
  let delta = '';
  if (now != null && before != null && Math.abs(now - before) >= Math.pow(10, -dec)){
    const d = now - before, good = lowerBetter == null ? null : lowerBetter ? d < 0 : d > 0;
    delta = `<span class="delta${good == null ? '' : good ? ' good' : ' bad'}">${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(dec)} vs 4 wks ago</span>`;
  }
  return { label, value: now == null ? '—' : now.toFixed(dec), unit, delta };
}
function bodyStats(){
  return {
    weight: bodyStat('Weight · 7-day avg', weightSeries(), { unit:'lbs', dec:1 }),
    rhr: bodyStat('Resting HR', bodySeries('rhr'), { unit:'bpm', lowerBetter:true }),
    hrv: bodyStat('HRV · overnight', bodySeries('hrv'), { unit:'ms', lowerBetter:false }),
    sleep: bodyStat('Sleep · 7-night avg', bodySeries('sleepH'), { unit:'hrs', dec:1, lowerBetter:false }),
  };
}

    stats: Object.values(st).map(x => [x.label.split(' · ')[0], x.value, x.value === '—' ? '' : x.unit]),

  }) + `<div class="wrap">

    <div class="grid two">

      ${chartCard('c-rhr', 'Resting heart rate', 'drifts down as fitness builds · lower is better', rhr)}
      ${chartCard('c-hrv', 'HRV', 'overnight · a sudden drop can mean run down', hrv)}

    </div>
    <div class="section-label">Fitness & composition</div>
    <div class="grid two">
      <div class="card"><div class="card-head"><h2>VO2 max</h2><span class="card-sub">${vo2.length ? 'Garmin’s estimate · moves slowly' : 'Garmin’s estimate'}</span></div>
        ${vo2.length > 1 ? '<div class="chart" id="c-vo2"></div>' : `<div class="next-run-big display num">${vo2Now ?? '—'}</div><p class="card-sub" style="margin:0">${vo2Now ? 'Only one reading so far — the trend fills in over weeks.' : 'Comes from Garmin when your watch estimates it, or add it below.'}</p>`}
      </div>
      <div class="card"><div class="card-head"><h2>Add a measurement</h2><span class="card-sub">a weigh-in, a DEXA scan, a lab test</span></div>
        <div class="field-row">
          <div class="field"><label for="m-date">Date</label><input id="m-date" type="date" value="${todayYmd()}"></div>
          <div class="field"><label for="m-w">Weight (lbs)</label><input id="m-w" type="number" step="0.1" inputmode="decimal"></div>
          <div class="field"><label for="m-fat">Body fat %</label><input id="m-fat" type="number" step="0.1" inputmode="decimal"></div>
          <div class="field"><label for="m-vo2">VO2 max</label><input id="m-vo2" type="number" step="1" inputmode="numeric"></div>
          <div class="field" style="grid-column:1 / -1"><label for="m-note">Note</label><input id="m-note" type="text" placeholder="e.g. DEXA scan"></div>
        </div>
        <div class="btn-row" style="margin-top:14px"><button class="btn small primary" data-action="add-measure">Save</button></div>
        ${comps.length || doc.profile.weights.length ? `<table class="quiet" style="margin-top:16px">
          ${[...doc.profile.weights.map(w => ({ date:w.date, txt:`${w.lbs} lbs`, note:w.note ?? '', kind:'w' })),
             ...comps.map(c => ({ date:c.date, txt:[c.bodyFat != null && c.bodyFat + '% fat', c.vo2 != null && 'VO2 ' + c.vo2].filter(Boolean).join(' · '), note:c.note ?? '', kind:'c' }))]
            .sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 8)
            .map(r => `<tr><td>${fmtDate(r.date)}</td><td>${esc(r.txt)}</td><td>${esc(r.note)} <button class="link-btn" data-del-measure="${r.kind}|${r.date}">remove</button></td></tr>`).join('')}
        </table>` : ''}
        ${fatG ? `<p class="card-sub" style="margin:12px 0 0">Garmin last reported ${fatG.v}% body fat on ${fmtDate(fatG.date)}.</p>` : ''}
      </div>
    </div>
  </div>`;

  if (ws.length) chartDaily($('#c-weight'), ws, { days, unit:'lbs', step: days > 90 ? 5 : 2, dec:1, smooth:true });
  if (rhr.length) chartDaily($('#c-rhr'), rhr, { days, unit:'bpm', step:5 });
  if (hrv.length) chartDaily($('#c-hrv'), hrv, { days, unit:'ms', step:10 });
  if (sleep.length) chartDaily($('#c-sleep'), sleep, { days, unit:'hrs', step:2, dec:1, bars:true });
  if (vo2.length > 1) chartDaily($('#c-vo2'), vo2, { days:Math.max(days, 90), unit:'', step:2, gapDays:60 });
}

function renderPlan(){
  const plan = activePlan(), len = planLen();
  if (!coached()){
    $('#page-plan').innerHTML = band({ eyebrow:'Plan', title:'Just <em>tracking</em>', sub:'No plan, no weekly gate. Stride logs every run and charts the trends. Want structure? Pick a plan — your runs stay as they are.',
      extra:`<a class="btn small" href="#welcome" style="text-decoration:none">Choose a plan</a>` }) + `<div class="wrap">${planChoices(doc.planId)}</div>`;
    return;
  }
  const weeks = planState(), cur = weeks.at(-1), pw = cur.planWeek;
  const past = weeks.filter(w => !w.current).reverse();
  const DEC = { advance:'Advanced', repeat:'Repeated', back:'Went back a week' };
  const mara = isMarathon(), toRace = mara ? diffDays(todayYmd(), doc.race.date) : 0;
  $('#page-plan').innerHTML = band(mara ? {
    eyebrow: `${esc(doc.race.name || 'Marathon')} · ${fmtDateLong(doc.race.date)} · ${doc.race.perWeek} runs a week`,
    title: toRace > 0 ? `Race in <em>${toRace}</em> days` : toRace === 0 ? 'Race <em>day</em>' : 'Race <em>done</em>',
    sub: `Built backward from race day. Long runs climb from ${doc.race.longest} mi to ${Math.max(...plan.weeks.filter(w => !w.race).map(w => w.longMi))} mi, then taper. Miss a long run and the next one holds near what you’ve actually run — it never jumps more than 2 mi.`,
    stats: [['Week', Math.min(pw, len), `/${len}`], ['Phase', esc(planWeekObj(pw).phase)], ['This week', planWeekObj(pw).miles, 'mi']],
    extra: `<div class="btn-row"><a class="btn small" href="#welcome" data-pick-plan="marathon" style="text-decoration:none">Edit race</a><a class="btn small" href="#welcome" style="text-decoration:none">Change plan</a></div>`,
  } : {
    eyebrow: `${esc(plan.name)} · three runs a week, rest day between`,
    title: pw > len ? 'Plan <em>done</em>' : `Week <em>${pw}</em>`,
    sub: `Goal: ${esc(plan.goal)}. Each week has to pass its gate before the next one unlocks.`,
    stats: [['Plan length', len, 'wks'], ['Started', fmtDate(doc.planStart).slice(4)], ['Phase', esc(planWeekObj(pw).phase)]],
    extra: `<a class="btn small" href="#welcome" style="text-decoration:none">Change plan</a>`,
  }) + `<div class="wrap"><div class="grid today-grid">
      <div class="col"><div class="plan-list">
        ${plan.weeks.map((p, i) => { const w = i + 1; return `<div class="plan-row${w === Math.min(pw, len) ? ' now' : ''}" style="${w < pw ? 'opacity:.55' : ''}">
          <div class="wk display num">${w}</div>
          <div><div class="p-t">${p.phase === p.session ? esc(p.session) : `${esc(p.phase)} · ${esc(p.session)}`}</div><div class="p-s">${mara ? `Week of ${fmtDate(addDays(weekStart(doc.planStart), i * 7)).slice(4)} · ` : ''}${esc(p.detail)}</div></div>
          <div class="p-s" style="max-width:240px">${esc(p.add)}</div>
        </div>`; }).join('')}
      </div></div>
      <div class="col">
        <div class="card"><div class="card-head"><h2>Week history</h2><span class="card-sub">${mara ? 'how each week went' : 'decided by the gate; override if needed'}</span></div>
          ${past.length ? `<ul class="hist">${past.map((w, i) => `<li>
            <span><b>${fmtDate(w.start).slice(4)} – ${fmtDate(w.end).slice(4)}</b> · week ${Math.min(w.planWeek, len)} · ${w.runs.length} run${w.runs.length === 1 ? '' : 's'}</span>
            <span>${mara ? esc(w.gate.verdict[1].replace(/\.$/, '')) : DEC[w.decision]}${w.overridden ? ' (you)' : ''}
              ${i === 0 && !mara ? `· <button class="link-btn" data-decide="${w.start}" data-val="${w.decision === 'advance' ? 'repeat' : 'advance'}">${w.decision === 'advance' ? 'Repeat instead' : 'Advance instead'}</button>${w.overridden ? ` · <button class="link-btn" data-decide="${w.start}" data-val="">Use gate</button>` : ''}` : ''}</span>
          </li>`).join('')}</ul>` : '<p class="card-sub" style="margin:0">First week in progress.</p>'}
        </div>
        ${mara ? `<div class="card"><div class="card-head"><h2>Rules that override the plan</h2></div>
          <ul class="rules">
            <li><b>Easy runs are easy.</b> Most of your miles should be under ${doc.profile.zones.easy} bpm. Going harder on easy days is the most common way to arrive at race day tired.</li>
            <li><b>The long run never jumps more than 2 mi</b> past the longest you’ve run in the last three weeks — Stride caps it for you.</li>
            <li><b>Missed a run?</b> Skip it; don’t stack it onto another day. Missed the long run? Next week’s holds steady.</li>
            <li><b>Soreness past 48 hours, or sharp pain:</b> make the next week all easy, no marathon-effort work.</li>
            <li><b>One calf much worse, shin-bone pain, a spot on the bone that hurts to press, or pain that changes your stride:</b> stop and get it looked at.</li>
            <li><b>Practise fueling</b> on every long run over 12 mi. Nothing new on race day — shoes, food or kit.</li>
          </ul>
        </div>
        <div class="card"><div class="card-head"><h2>Effort</h2></div>
          <p class="card-sub" style="margin:0"><b>Easy</b> — you can talk in full sentences, HR under ${doc.profile.zones.easy}. <b>Marathon effort</b> — comfortably hard, short sentences only, roughly ${doc.profile.zones.easy}–${doc.profile.zones.mod}. In the race, the first half should feel too easy.</p>
        </div>` : `<div class="card"><div class="card-head"><h2>Rules that override the plan</h2></div>
          <ul class="rules">
            <li><b>Sport day or big day on your feet:</b> rest the day before, and skip the run right after if the legs are toast.</li>
            <li><b>Soreness past 48 hours, or sharp pain:</b> repeat the week.</li>
            <li><b>Miss a week:</b> go back one week, don’t jump ahead.</li>
            <li><b>One calf much worse, shin-bone pain, or Achilles tightness out of bed:</b> stop and get it looked at.</li>
            <li><b>Knee pain that turns sharp, swells, or causes a limp:</b> see a doctor or PT.</li>
            <li>Don’t add more than about 10% a week. When in doubt, repeat the week.</li>
          </ul>
        </div>
        <div class="card"><div class="card-head"><h2>Pacing</h2></div>
          <p class="card-sub" style="margin:0">Run slow enough to hold a conversation. If that’s barely faster than a walk, don’t shuffle — control effort with <b>interval length, not pace</b>: jog 2 min, walk 90 sec, × 5, walking until HR is back under ${doc.profile.zones.easy}. If HR passes ~${doc.profile.zones.mod}, take a walk break.</p>
        </div>`}
      </div>
    </div></div>`;
}

/* ═══ WELCOME / CHOOSE A PLAN ════════════════════════════════════════ */
const welcomeUi = { plan:null, start:null, race:null };
// Live preview of a marathon plan from the form, with a straight answer when time is short.
function maraPreview(){
  const r = welcomeUi.race, start = welcomeUi.start;
  if (!r?.date) return '<p class="card-sub" style="margin:0">Pick the race date to see the plan.</p>';
  const weeks = diffDays(weekStart(start), weekStart(r.date)) / 7 + 1;
  if (r.date <= start) return '<div class="note">' + WARN_SVG + '<div><b>That date is before the plan would start.</b></div></div>';
  const ws = marathonWeeks({ ...r }, start), build = ws.filter(w => !w.race && w.phase !== 'Taper');
  const peak = build.length ? Math.max(...build.map(w => w.longMi)) : r.longest;
  const top = Math.max(0, ...ws.filter(w => !w.race).map(w => w.miles));
  let warn = '';
  if (weeks < 4) warn = `<b>${weeks} week${weeks === 1 ? '' : 's'} isn’t enough to build anything safely.</b> Stride can only taper you from where you are. If ${r.longest} mi is your longest run, think hard about the half, or a later race.`;
  else if (peak < 16) warn = `<b>The long run only reaches ${peak} mi before the taper.</b> Most plans want 16–20. You can still finish — with planned walk breaks from the start — but a later race or the half would be kinder to your legs.`;
  return `<div class="mara-sum">
      <div><b class="display num">${ws.length}</b><span>weeks</span></div>
      <div><b class="display num">${peak}</b><span>mi peak long run</span></div>
      <div><b class="display num">${top}</b><span>mi biggest week</span></div>
      <div><b class="display num">${ws.filter(w => w.phase === 'Taper').length + 1}</b><span>weeks of taper</span></div>
    </div>
    <div class="mara-strip">${ws.map(w => `<i style="height:${Math.max(8, w.longMi / 26.2 * 100)}%" class="${w.race ? 'race' : w.phase === 'Taper' ? 'taper' : w.phase === 'Recovery' ? 'cut' : ''}" data-tip="Week ${w.week} · ${esc(w.phase)}<br>${w.race ? 'Race' : w.longMi + ' mi long run'} · ~${w.miles} mi"></i>`).join('')}</div>
    <div class="legend" style="margin:10px 0 0"><span><i style="background:var(--series-1)"></i>Build</span><span><i style="background:var(--series-1);opacity:.45"></i>Easier week</span><span><i style="background:var(--walk)"></i>Taper</span><span><i style="background:var(--accent)"></i>Race</span></div>
    ${warn ? `<div class="note" style="margin-top:14px">${WARN_SVG}<div>${warn}</div></div>` : ''}`;
}

    <button class="card plan-card" data-pick-plan="${id}" aria-pressed="${sel === id}">
      <div class="eyebrow">${id === 'marathon' ? 'Built from your race date · 3–5 runs a week' : pl.weeks.length ? pl.weeks.length + ' weeks · 3 runs a week' : 'No plan'}</div>

      ? `<button class="btn small primary" data-action="verify-code">Sign in</button><button class="link-btn" data-action="change-email">Use a different email</button><button class="link-btn" data-action="send-link">Resend</button>`

// Page-level drop so a file dragged anywhere still lands.
addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });

let sdkP, zipP;
const loadSdk = () => sdkP ??= import(FITSDK_URL);
const loadZip = () => zipP ??= import(JSZIP_URL).then(m => m.default);

async function handleFiles(files){
  if (!files.length) return;
  if (location.hash !== '#setup') location.hash = 'setup';
  const jobs = [];
  for (const f of files){
    const lower = f.name.toLowerCase();
    try {
      if (lower.endsWith('.zip')){
        const Zip = await loadZip();
        const z = await Zip.loadAsync(await f.arrayBuffer());
        const fits = Object.values(z.files).filter(e => !e.dir && e.name.toLowerCase().endsWith('.fit'));
        if (!fits.length) importLog.unshift({ status:'crit', title:esc(f.name), sub:'No .fit file inside this zip.' });
        for (const e of fits) jobs.push([`${f.name} › ${e.name.split('/').pop()}`, await e.async('arraybuffer')]);
      } else if (lower.endsWith('.fit')) jobs.push([f.name, await f.arrayBuffer()]);
      else importLog.unshift({ status:'crit', title:esc(f.name), sub:'Not a .fit or .zip file — skipped.' });
    } catch (err){
      importLog.unshift({ status:'crit', title:esc(f.name), sub:`Couldn’t open it: ${esc(err.message)}` });
    }
  }
  for (const [name, buf] of jobs){
    try { importLog.unshift(await importFit(name, buf)); }
    catch (err){ importLog.unshift({ status:'crit', title:esc(name), sub:`Couldn’t read it: ${esc(err.message)}` }); }
  }
  await save();
  if (location.hash === '#setup') $('#log').innerHTML = importLog.map(logItem).join('');
}

function matchRoute(r){
  if (!r.startLL || !r.endLL) return null;
  for (const rt of doc.routes){
    if (haversine(r.startLL, rt.start) <= 150 && haversine(r.endLL, rt.end) <= 150 && Math.abs(r.distMi - rt.distMi) / rt.distMi <= 0.2) return rt.id;
  }
  return null;
}
function makeTestRoute(r){
  doc.routes.forEach(x => x.isTest = false);
  const rt = { id:'rt' + Date.now().toString(36), name:'Test route', start:r.startLL, end:r.endLL, distMi:r.distMi, isTest:true, from:r.id };
  doc.routes.push(rt);
  for (const x of doc.runs) if (x.startLL){ x.routeId = matchRoute(x); if (x.testOverride === false && x.id === r.id) x.testOverride = null; }
  r.routeId = rt.id; r.testOverride = null;
}

async function importFit(name, buf){
  const { Decoder, Stream } = await loadSdk();
  const decoder = new Decoder(Stream.fromArrayBuffer(buf));
  if (!decoder.isFIT()) throw new Error('not a FIT file');
  const { messages, errors } = decoder.read({ includeUnknownData:true, mergeHeartRates:true });
  if (!messages.recordMesgs?.length) throw new Error(errors?.[0]?.message ?? 'no activity data (is this a settings file?)');
  const { run, samples } = analyzeFit(messages, doc.profile);
  const title = `${fmtDate(run.date)} · ${fmtMi(run.distMi)} mi`;
  if (!/running|walking|generic/.test(run.sport)) return { status:'wait', title, sub:`A ${esc(run.sport || 'non-running')} activity — skipped.` };
  if (runById(run.id)) return { status:'wait', title, sub:'Already imported — skipped.', runId:run.id };

  // A FIT file for a day that came from the notes replaces that entry.
  const seed = doc.runs.find(x => x.source === 'manual' && Math.abs(diffDays(x.date, run.date)) <= 1 && Math.abs(x.distMi - run.distMi) / run.distMi <= 0.2);
  let sub = `${fmtDur(run.runSec)} jogging · ${fmtDur(run.walkSec)} walking`;
  if (run.jogHr != null) sub += ` · jogging HR ${Math.round(run.jogHr)}`;
  if (seed){
    run.felt = seed.felt || run.felt;
    run.recoveryHr ??= seed.recoveryHr;
    doc.checkins.forEach(c => { if (c.runId === seed.id) c.runId = run.id; });
    doc.runs = doc.runs.filter(x => x !== seed);
    sub += ' · replaced the entry from your notes';
  }
  run.routeId = matchRoute(run);
  doc.runs.push(run);
  await putSamples(run.id, samples);

  let makeTest = null;
  if (seed?.testOverride && !testRoute() && run.startLL){ makeTestRoute(run); sub += ' · set as your test route'; }
  else if (!testRoute() && run.startLL && (run.gainFt ?? 99) <= 50) makeTest = run.id;
  else if (isTest(run)) sub += ' · test route ✓';
  const fl = flagsFor(run).filter(f => f[0] === 'warn' || f[0] === 'crit');
  return { status: fl.length ? 'warn' : 'good', title, sub: sub + (fl.length ? ` · ${fl.map(f => esc(f[1])).join(', ')}` : ''), runId:run.id, makeTest };
}

/* ── intervals.icu: new runs arrive on their own ──────────────────────
   Garmin (or Coros, Suunto, Wahoo) syncs to intervals.icu, which keeps the
   original FIT file; this pulls new runs' files and feeds them through the
   same importFit as a dropped file. Only the API key lives in the synced doc.
   What's been checked is per-device, so a check never writes to the account
   unless it actually found a run. */
const ICU = 'https://intervals.icu/api/v1';
const ICU_RUNS = ['Run', 'TrailRun', 'VirtualRun'];
const ICUKEY = 'stride.icu';
const icuUi = { status:'idle', msg:'' };
let icuBusy = false;
const icuLocal = () => {
  let s = {}; try { s = JSON.parse(localStorage.getItem(ICUKEY)) || {}; } catch {}
  return s.tail === doc.intervals?.key?.slice(-6) ? s : { tail: doc.intervals?.key?.slice(-6), seen:[] };   // a new key starts over
};
const setIcuLocal = s => { try { localStorage.setItem(ICUKEY, JSON.stringify(s)); } catch {} };
async function icuGet(path, key){
  const r = await fetch(ICU + path, { headers:{ Authorization:'Basic ' + btoa('API_KEY:' + key) } });
  if (r.status === 401 || r.status === 403){ const e = new Error('intervals.icu didn’t accept the API key — paste it again'); e.auth = true; throw e; }
  if (!r.ok) throw new Error('intervals.icu returned ' + r.status);
  return r;
}
// The original file comes back gzipped; Garmin's own exports can be zips.
async function unpackFit(buf){
  const b = new Uint8Array(buf, 0, 2);
  if (b[0] === 0x1f && b[1] === 0x8b) return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  if (b[0] === 0x50 && b[1] === 0x4b){
    const z = await (await loadZip()).loadAsync(buf);
    const f = Object.values(z.files).find(e => !e.dir && /\.fit$/i.test(e.name));
    if (!f) throw new Error('no FIT file in the download');
    return f.async('arraybuffer');
  }
  return buf;
}
function paintIcu(){
  const el = $('#icu-status'); if (!el) return;
  const loc = icuLocal();
  const line = icuUi.status === 'checking' ? 'Checking for new runs…'
    : icuUi.status === 'error' ? icuUi.msg
    : icuUi.msg || (loc.lastChecked ? 'Checked ' + timeAgo(loc.lastChecked) : 'Not checked yet');
  el.className = `sync-line sync-${icuUi.status === 'error' ? 'error' : icuUi.status === 'checking' ? 'busy' : 'ok'}`;
  el.innerHTML = `<span class="dot"></span>${esc(line)}`;
}
async function checkIntervals({ manual = false } = {}){
  const key = doc.intervals?.key;
  if (!key || icuBusy) return;
  const loc = icuLocal();
  if (!manual && loc.lastChecked && Date.now() - Date.parse(loc.lastChecked) < 5 * 60e3) return;
  icuBusy = true; icuUi.status = 'checking'; icuUi.msg = ''; paintIcu();
  let added = 0, problems = 0;
  try {
    // First check reaches back 30 days; after that, a few days before the last check.
    const from = loc.lastChecked ? addDays(ymd(new Date(loc.lastChecked)), -3) : addDays(todayYmd(), -30);
    const list = await (await icuGet(`/athlete/0/activities?oldest=${from}&newest=${addDays(todayYmd(), 1)}`, key)).json();
    const seen = new Set(loc.seen);
    const todo = list.filter(a => ICU_RUNS.includes(a.type) && !seen.has(a.id))
      .sort((a, b) => a.start_date_local < b.start_date_local ? -1 : 1);
    for (const a of todo){
      const title = `${esc(a.name || 'Run')} · ${a.start_date_local ? fmtDate(a.start_date_local.slice(0, 10)) : ''}`;
      let it;
      try {
        if (a.source === 'STRAVA') it = { status:'wait', title, sub:'Came in through Strava, which doesn’t share the original file. Connect Garmin to intervals.icu directly.' };
        else if (a.file_type && a.file_type !== 'fit') it = { status:'wait', title, sub:`A ${esc(a.file_type)} file, not FIT — skipped.` };
        else {
          it = await importFit(title, await unpackFit(await (await icuGet(`/activity/${a.id}/file`, key)).arrayBuffer()));
          if (it.status === 'good' || it.status === 'warn') added++;
        }
        seen.add(a.id);
      } catch (err){
        if (err.auth) throw err;
        problems++;   // not marked seen, so the next check retries it
        it = { status:'crit', title, sub:`Couldn’t import it: ${esc(err.message)}` };
      }
      if (!/Already imported/.test(it.sub)) importLog.unshift({ ...it, sub:'From intervals.icu · ' + it.sub });
    }
    // Daily body data Garmin sends to intervals.icu: weight, resting HR, HRV, sleep, VO2 max.
    let bodyChanged = false;
    try {
      const wFrom = loc.wellnessAt ? addDays(ymd(new Date(loc.wellnessAt)), -3) : addDays(todayYmd(), -180);
      const wl = await (await icuGet(`/athlete/0/wellness?oldest=${wFrom}&newest=${todayYmd()}`, key)).json();
      doc.body ??= {};
      for (const w of wl){
        const rec = {
          weight: w.weight ? Math.round(w.weight * 2.20462 * 10) / 10 : null,   // the API is metric
          rhr: w.restingHR ?? null, hrv: w.hrv != null ? Math.round(w.hrv) : null,
          sleepH: w.sleepSecs ? Math.round(w.sleepSecs / 360) / 10 : null, sleepScore: w.sleepScore ?? null,
          vo2: w.vo2max ?? null, bodyFat: w.bodyFat ?? null,
        };
        for (const k of Object.keys(rec)) if (rec[k] == null) delete rec[k];
        if (!w.id || !Object.keys(rec).length) continue;
        if (stableStringify(doc.body[w.id] ?? {}) !== stableStringify(rec)){ doc.body[w.id] = rec; bodyChanged = true; }
      }
      loc.wellnessAt = new Date().toISOString();
    } catch (err){ if (err.auth) throw err; }
    setIcuLocal({ ...loc, seen:[...seen].slice(-500), lastChecked:new Date().toISOString() });
    icuUi.status = 'idle';
    icuUi.msg = added ? `${added} new run${added > 1 ? 's' : ''} just now` : problems ? `${problems} couldn’t be imported — see the log` : '';
    if (added){ await save(); toast(`${added} new run${added > 1 ? 's' : ''} from intervals.icu`); render(); }
    else if (bodyChanged){ await save(); if (['', '#today', '#body'].includes(location.hash)) render(); }
    else if (manual) toast(problems ? 'Some runs couldn’t be imported' : 'No new runs');
  } catch (err){
    icuUi.status = 'error'; icuUi.msg = err.message;
    if (manual || err.auth) toast(err.message);
  } finally {
    icuBusy = false; paintIcu();
    if (location.hash.startsWith('#setup') && importLog.length) $('#log') && ($('#log').innerHTML = importLog.map(logItem).join(''));
  }
}
async function connectIntervals(){
  const key = $('#icu-key')?.value.trim();
  if (!key){ toast('Paste your intervals.icu API key'); return; }
  try {
    const me = await (await icuGet('/athlete/0', key)).json();
    doc.intervals = { key, name: me.name || me.email || '' };
    await save(); icuUi.msg = ''; render(); toast('Connected to intervals.icu');
    checkIntervals({ manual:true });
  } catch (err){ toast(err.message.replace(' — paste it again', '')); }
}

}

async function rescoreAll(){
  for (const r of doc.runs){
    if (!r.hasSamples) continue;
    const s = await getSamples(r.id); if (!s) continue;
    Object.assign(r, zoneStats(s, doc.profile));
  }
}

async function exportBackup(){
  const samples = {};
  for (const r of doc.runs) if (r.hasSamples){ const s = await getSamples(r.id); if (s) samples[r.id] = s; }
  const blob = new Blob([JSON.stringify({ app:'stride', exported:new Date().toISOString(), doc:(({ intervals, ...d }) => d)(blobOf()), samples })], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `stride-backup-${todayYmd()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importBackup(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'stride' || !data.doc?.runs) throw new Error('not a Stride backup');
    const { sync, intervals } = doc;
    doc = normalize(data.doc);
    if (sync) doc.sync = sync;
    if (intervals) doc.intervals = intervals;
    await idb.clear('samples').catch(() => {});
    memSamples.clear();
    for (const [id, s] of Object.entries(data.samples ?? {})) await putSamples(id, s);
    await save(); toast(`Restored ${doc.runs.length} runs`); render();
  } catch (err){ toast('Couldn’t import: ' + err.message); }
}

/* ── Actions ─────────────────────────────────────────────────────── */
document.addEventListener('click', async e => {
  const pk = e.target.closest('[data-pick-plan]');
  if (pk){ welcomeUi.plan = pk.dataset.pickPlan; if (location.hash !== '#welcome' && doc.planId) location.hash = 'welcome'; else renderWelcome(); return; }
  const mp = e.target.closest('[data-mr-per], [data-mr-day]');
  if (mp){ if (mp.dataset.mrPer) welcomeUi.race.perWeek = +mp.dataset.mrPer; else welcomeUi.race.longDay = +mp.dataset.mrDay; renderWelcome(); return; }
  const ps = e.target.closest('[data-pick-start]');
  if (ps){ welcomeUi.start = ps.dataset.pickStart; renderWelcome(); return; }
  const br = e.target.closest('[data-body-range]');
  if (br){ prefs.set('bodyRange', +br.dataset.bodyRange); renderBody(); return; }
  const dm = e.target.closest('[data-del-measure]');
  if (dm){
    const [kind, date] = dm.dataset.delMeasure.split('|');
    if (kind === 'w') doc.profile.weights = doc.profile.weights.filter(w => w.date !== date);
    else doc.profile.comps = (doc.profile.comps ?? []).filter(c => c.date !== date);
    await save(); renderBody(); return;
  }
  const task = e.target.closest('[data-task]');
  if (task){
    const k = task.dataset.task;
    if (doc.done[k]) delete doc.done[k]; else doc.done[k] = true;
    task.setAttribute('aria-pressed', !!doc.done[k]);
    save(); return;
  }
  const ck = e.target.closest('[data-checkin]');
  if (ck){
    const c = { runId:ck.dataset.run, stage:ck.dataset.stage, value:ck.dataset.checkin, at:new Date().toISOString() };
    doc.checkins.push(c);
    lastResponse = { c, html: c.value === 'red' ? RESPONSES.red : RESPONSES[c.stage][c.value], alarm: c.value === 'red' || (c.stage === '48' && c.value !== 'none') };
    await save(); render(); return;
  }
  const rd = e.target.closest('[data-refday]');
  if (rd && !rd.disabled){
    const d = rd.dataset.refday;
    doc.refDays = isRef(d) ? doc.refDays.filter(x => x !== d) : [...doc.refDays, d];
    await save(); render(); return;
  }
  const row = e.target.closest('tr[data-run]');
  if (row){ location.hash = 'runs/' + row.dataset.run; return; }
  const mk = e.target.closest('[data-make-test]');
  if (mk){
    const r = runById(mk.dataset.makeTest); if (!r) return;
    makeTestRoute(r); importLog.forEach(it => { if (it.makeTest === r.id) it.makeTest = null; });
    await save(); toast('Test route set'); render(); return;
  }
  const dec = e.target.closest('[data-decide]');
  if (dec){
    if (dec.dataset.val) doc.decisions[dec.dataset.decide] = dec.dataset.val; else delete doc.decisions[dec.dataset.decide];
    await save(); render(); return;
  }
  const act = e.target.closest('[data-action]')?.dataset.action;
  if (!act) return;
  const r = runById($('#page-runs').dataset.run);
  switch (act){
    case 'back': location.hash = 'runs'; break;
    case 'clear-red': doc.redClearedAt = new Date().toISOString(); await save(); render(); break;
    case 'undo-checkin': doc.checkins = doc.checkins.filter(c => c !== lastResponse?.c); lastResponse = null; await save(); render(); break;
    case 'make-test': if (r){ makeTestRoute(r); await save(); toast('Test route set'); render(); } break;
    case 'not-test': if (r){ r.testOverride = false; await save(); render(); } break;
    case 'count-test': if (r){ r.testOverride = true; await save(); render(); } break;
    case 'delete-ask': $('#del-confirm').classList.add('show'); break;
    case 'delete-no': $('#del-confirm').classList.remove('show'); break;
    case 'delete-yes':
      if (r){
        doc.runs = doc.runs.filter(x => x !== r);
        doc.checkins = doc.checkins.filter(c => c.runId !== r.id);
        memSamples.delete(r.id); idb.del('samples', r.id).catch(() => {}); dropSamples(r.id);
        await save(); toast('Run deleted'); location.hash = 'runs';
      } break;
    case 'save-zones': {
      const g = id => Math.round(+$(id).value);
      const lthr = g('#s-lthr'), easy = g('#s-easy'), mod = g('#s-mod'), guard = g('#s-guard');
      if (!(easy < mod && mod < lthr) || lthr > 230 || easy < 80){ toast('Zones must go easy < moderate < threshold'); break; }
      Object.assign(doc.profile, { lthr, guardHr:guard, zones:{ easy, mod }, zonesSet:true });
      await rescoreAll(); await save(); toast('Zones saved — every run re-scored'); render(); break;
    }
    case 'add-weight': {
      const lbs = +$('#s-w').value, date = $('#s-wd').value;
      if (!(lbs > 50 && lbs < 600) || !date){ toast('Enter a weight and a date'); break; }
      doc.profile.weights = [...doc.profile.weights.filter(w => w.date !== date), { date, lbs }].sort((a, b) => a.date < b.date ? -1 : 1);
      await save(); toast('Weigh-in saved'); render(); break;
    }
    case 'welcome-go': {
      if (!welcomeUi.plan) break;
      if (welcomeUi.plan === 'marathon'){
        const r = welcomeUi.race;
        if (!r.date || r.date <= welcomeUi.start){ toast('Pick a race date after the plan starts'); break; }
        if (!(r.longest > 0)){ toast('Enter your longest recent run'); break; }
        const moved = doc.race?.date !== r.date || doc.planStart !== welcomeUi.start;
        doc.race = { ...r, setAt: todayYmd() };
        doc.planId = 'marathon'; doc.planStart = welcomeUi.start;
        if (moved) doc.decisions = {};
        welcomeUi.plan = welcomeUi.start = welcomeUi.race = null;
        await save(); location.hash = 'today'; render(); break;
      }
      const changed = doc.planId !== welcomeUi.plan;
      doc.planId = welcomeUi.plan;
      if (PLANS[doc.planId].weeks.length && (changed || welcomeUi.start !== doc.planStart)){
        if (welcomeUi.start !== doc.planStart) doc.decisions = {};   // a new start date means a fresh week history
        doc.planStart = welcomeUi.start;
      }
      welcomeUi.plan = welcomeUi.start = welcomeUi.race = null;
      await save(); location.hash = 'today'; render(); break;
    }
    case 'add-measure': {
      const date = $('#m-date').value, lbs = +$('#m-w').value, fat = +$('#m-fat').value, vo2 = +$('#m-vo2').value, note = $('#m-note').value.trim();
      if (!date || !(lbs || fat || vo2)){ toast('Enter at least one number'); break; }
      if (lbs && !(lbs > 50 && lbs < 600)){ toast('That weight looks off'); break; }
      if (lbs) doc.profile.weights = [...doc.profile.weights.filter(w => w.date !== date), { date, lbs, ...(note ? { note } : {}) }].sort((a, b) => a.date < b.date ? -1 : 1);
      if (fat || vo2) doc.profile.comps = [...(doc.profile.comps ?? []).filter(c => c.date !== date),
        { date, ...(fat ? { bodyFat:fat } : {}), ...(vo2 ? { vo2 } : {}), ...(note ? { note } : {}) }];
      await save(); toast('Saved'); renderBody(); break;
    }
    case 'export': exportBackup(); break;
    case 'icu-connect': connectIntervals(); break;
    case 'icu-check': checkIntervals({ manual:true }); break;
    case 'icu-off': delete doc.intervals; try { localStorage.removeItem(ICUKEY); } catch {} await save(); render(); toast('Disconnected from intervals.icu'); break;
    case 'reset-ask': $('#reset-confirm').classList.add('show'); break;
    case 'reset-no': $('#reset-confirm').classList.remove('show'); break;
    case 'reset-yes':
      { const { sync } = doc; doc = freshDoc(); if (sync) doc.sync = sync; }
      memSamples.clear(); importLog.length = 0; setUnsent([]);
      await idb.clear('samples').catch(() => {}); dropSamples(); await save(); toast('Reset to the starting data'); render(); break;
    case 'goto-signin': location.hash = 'setup'; setTimeout(() => $('#si-email, #si-code')?.focus(), 50); break;
    case 'send-link': sendLink(); break;
    case 'verify-code': verifyCode(); break;
    case 'change-email': authUi.stage = 'email'; renderSetup(); break;
    case 'signout': signOut(); break;
    case 'sync-now': if (doc.sync?.dirty) pushRow().catch(e => setSync('error', e.message)); else { await refreshFromRemote(); setSync(SYNC.status === 'off' ? 'ok' : SYNC.status); toast('Up to date'); } break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'si-email'){ sendLink(); return; }
  if (e.key === 'Enter' && e.target.id === 'si-code'){ verifyCode(); return; }
  if (e.key === 'Enter' && e.target.id === 'icu-key'){ connectIntervals(); return; }
  if (e.key === 'Enter' && e.target.matches('tr[data-run]')) location.hash = 'runs/' + e.target.dataset.run;
  if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey) return;
  const pages = { 1:'today', 2:'progress', 3:'runs', 4:'body', 5:'plan', 6:'setup' };
  if (pages[e.key]) location.hash = pages[e.key];
});

document.addEventListener('input', e => {
  if (!e.target.id?.startsWith('mr-') || !welcomeUi.race) return;
  const r = welcomeUi.race, v = e.target.value;
  if (e.target.id === 'mr-date') r.date = v;
  if (e.target.id === 'mr-name') r.name = v;
  if (e.target.id === 'mr-long') r.longest = Math.min(22, Math.max(0, +v || 0));
  const pv = $('#mara-preview'); if (pv) pv.innerHTML = maraPreview();
});

/* ── Routing ─────────────────────────────────────────────────────── */
document.querySelectorAll('.tab[data-page]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.page; }));
function render(){
  let [page, arg] = (location.hash.slice(1) || 'today').split('/');
  if (page === 'upload') page = 'setup';   // older links
  let pg = ['today', 'progress', 'runs', 'body', 'plan', 'setup', 'welcome'].includes(page) ? page : 'today';
  // No plan chosen yet: everything but Setup (where you can sign in) waits on the welcome screen.
  if (!doc.planId && pg !== 'setup') pg = 'welcome';
  document.querySelectorAll('.tab[data-page]').forEach(b => b.dataset.page === pg ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + pg));
  tip.classList.remove('show');
  if (pg === 'welcome') renderWelcome();
  if (pg === 'today') renderToday();
  if (pg === 'progress') renderProgress();
  if (pg === 'runs'){ $('#page-runs').dataset.run = ''; arg ? renderRunDetail(arg) : renderRunsList(); }
  if (pg === 'body') renderBody();
  if (pg === 'plan') renderPlan();
  if (pg === 'setup') renderSetup();
}
let lastRoute = null;
addEventListener('hashchange', () => { render(); if (location.hash !== lastRoute) scrollTo(0, 0); lastRoute = location.hash; });
let rt, lastW = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === lastW) return; lastW = innerWidth;
  clearTimeout(rt); rt = setTimeout(() => { if (!/setup/.test(location.hash)) render(); }, 120);
});

/* ── Boot ────────────────────────────────────────────────────────── */
const fromLink = syncOn() ? consumeAuthHash() : null;
if (syncOn()) loadSession();
try { doc = await idb.get('doc', 'main'); }
catch { storageOk = false; }
doc = doc ? normalize(doc) : freshDoc();
await saveLocal();
if (!storageOk) toast('Storage is blocked here — changes won’t survive a reload');
lastRoute = location.hash;
render();
paintSync();
syncInit(fromLink).finally(() => checkIntervals());
</script>
</body>
</html>
