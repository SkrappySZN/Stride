async function renderRunDetail(id){
  const r = runById(id);
  const page = $('#page-runs');
  if (!r){ page.innerHTML = `<div class="empty"><b>That run isn’t here.</b><br><a href="#runs">Back to runs</a></div>`; return; }
  const s = r.hasSamples ? await getSamples(r.id) : null;
  if (location.hash.slice(1) !== 'runs/' + id) return;   // navigated away while loading
  const p = doc.profile, flags = flagsFor(r), tr = testRoute();
  const stat = (l, v, unit = '', note = '') => `<div class="stat"><div class="s-l">${l}</div><div class="s-v">${v}${unit ? `<small>${unit}</small>` : ''}</div>${note ? `<div class="s-n">${note}</div>` : ''}</div>`;
  const zs = r.zoneSec, zTot = zs ? Object.values(zs).reduce((a, b) => a + b, 0) : 0;
  const checks = doc.checkins.filter(c => c.runId === r.id);

  let routeCtl;
  if (isTest(r)) routeCtl = `<span class="badge test">Test route</span> <button class="btn small" data-action="not-test">Not the test route</button>`;
  else if (r.startLL && !tr) routeCtl = `<button class="btn small primary" data-action="make-test">Make this the test route</button>`;
  else if (r.startLL && tr) routeCtl = `<button class="btn small" data-action="count-test">Count as test route</button> <button class="btn small" data-action="make-test">Replace the test route with this one</button>`;
  else routeCtl = `<button class="btn small" data-action="count-test">Count as test route</button>`;

  page.innerHTML = `
    <div class="detail-head">
      <div>
        <button class="link-btn" data-action="back">← All runs</button>
        <h1 class="display num">${fmtMi(r.distMi)} <span style="font-size:.5em">mi</span></h1>
        <div class="eyebrow">${fmtDateLong(r.date)}${r.source === 'fit' ? ' · ' + fmtTime(r.start) : ''} · ${r.source === 'fit' ? 'FIT file' : 'from notes'}</div>
      </div>
      <div class="btn-row">${routeCtl}</div>
    </div>
    <div class="stat-grid">
      ${stat('Timer', fmtDur(r.timerSec))}
      ${stat('Jog / walk', `${fmtDur(r.runSec)}`, `/ ${fmtDur(r.walkSec)}`)}
      ${stat('Avg pace', fmtDur(r.avgPaceSec), '/mi')}
      ${stat('Jog pace', fmtDur(r.jogPaceSec), '/mi')}
      ${stat('Avg HR', num(r.avgHr), 'bpm')}
      ${stat('Jog HR', r.jogHr != null ? Math.round(r.jogHr) : '—', 'bpm', 'the fitness signal')}
      ${stat('Max HR', num(r.maxHr), 'bpm')}
      <div class="stat"><div class="s-l">Recovery HR</div><input type="number" inputmode="numeric" min="0" max="120" id="rec-in" value="${r.recoveryHr ?? ''}" placeholder="—" aria-label="Recovery HR, bpm dropped in 2 minutes"><div class="s-n">${r.recoveryHr == null ? 'Type it in from Garmin Connect' : 'bpm dropped in 2 min'}</div></div>
      ${stat(`Above ${p.lthr}`, fmtDur(r.aboveLtSec))}
      ${stat('Anaerobic TE', num(r.anaerobicTE, 1), '', r.anaerobicTE > 1 ? 'too hard' : r.anaerobicTE != null ? 'easy' : '')}
      ${stat('Aerobic TE', num(r.aerobicTE, 1))}
      ${stat('Load', num(r.load))}
      ${stat('Drift', r.drift != null ? (r.drift > 0 ? '+' : '') + r.drift : '—', r.drift != null ? 'bpm' : '')}
      ${stat('Idle', fmtDur(r.idleSec), '', (r.idleSec ?? 0) > IDLE_TOLERANCE ? 'timer left running' : '')}
    </div>

    <div class="grid today-grid" style="margin-top:16px">
      <div class="col">
        <div class="card"><div class="card-head"><h2>Heart rate</h2><span class="card-sub">zones anchored to your ${p.lthr} threshold</span></div>
          ${s ? `<div class="legend"><span><i style="background:var(--series-1)"></i>Jogging</span><span><i style="background:var(--walk)"></i>Walking</span><span><i style="background:var(--muted);opacity:.5"></i>Standing</span></div><div class="chart" id="c-trace"></div>`
              : '<div class="pending-box">Upload this run’s FIT file to see the second-by-second trace.</div>'}
          ${zs ? `<div class="zone-bar">${[['easy', '--z-easy'], ['mod', '--z-mod'], ['hard', '--z-hard'], ['above', '--z-above']].filter(([k]) => zs[k] > 0).map(([k, c]) => `<div style="flex:${zs[k]};background:var(${c})" data-tip="${fmtDur(zs[k])}"></div>`).join('')}</div>
            <div class="zone-legend">
              <div><i style="background:var(--z-easy)"></i>Easy &lt;${p.zones.easy}<b>${fmtDur(zs.easy)}</b></div>
              <div><i style="background:var(--z-mod)"></i>Moderate<b>${fmtDur(zs.mod)}</b></div>
              <div><i style="background:var(--z-hard)"></i>Hard ${p.zones.mod}–${p.lthr}<b>${fmtDur(zs.hard)}</b></div>
              <div><i style="background:var(--z-above)"></i>Above ${p.lthr}<b>${fmtDur(zs.above)}</b></div>
            </div>` : ''}
        </div>
        <div class="card"><div class="card-head"><h2>How it felt</h2><span class="card-sub">saved as you type</span></div>
          <textarea class="felt" id="felt" placeholder="Legs, breathing, anything odd…">${esc(r.felt)}</textarea>
          ${checks.length ? `<div class="pill-row" style="margin-top:12px">${checks.map(c => `<span class="badge${c.value === 'none' ? '' : c.value === 'red' ? ' crit' : ' warn'}">${c.stage} hr · ${esc(SORE[c.value])}</span>`).join('')}</div>` : ''}
        </div>
      </div>
      <div class="col">
        <div class="card"><div class="card-head"><h2>Protocol check</h2><span class="card-sub">${isClean(r) ? 'counts toward the trend' : 'kept out of the trend'}</span></div>
          ${flags.length ? `<ul class="status-list">${flags.map(([st, mm, sub]) => `<li class="status-row">${statusIcon(st)}<span><div class="s-main">${esc(mm)}</div><div class="s-sub">${esc(sub)}</div></span></li>`).join('')}</ul>`
            : `<div class="verdict" style="margin:0">${statusIcon('good')}<span><strong>Clean.</strong> Test route, no idle time, recovery HR captured.</span></div>`}
        </div>
        ${s?.path?.length ? `<div class="card"><div class="card-head"><h2>Route</h2><span class="card-sub">${r.gainFt ?? '—'} ft gain · ${r.minElevFt ?? '—'}–${r.maxElevFt ?? '—'} ft</span></div>${routeSvg(s.path)}</div>` : ''}
        <div class="card"><div class="card-head"><h2>Form</h2><span class="card-sub">stored, not progress</span></div>
          <table class="quiet">
            <tr><td>Jogging cadence</td><td>${num(r.cadence)} spm</td><td></td></tr>
            <tr><td>Stride length</td><td>${num(r.stride, 2)} m</td><td></td></tr>
            <tr><td>Vertical ratio</td><td>${num(r.vertRatio, 1)}%</td><td></td></tr>
            <tr><td>Vertical oscillation</td><td>${num(r.vertOsc, 1)} cm</td><td></td></tr>
            <tr><td>Ground contact</td><td>${num(r.gct)} ms</td><td></td></tr>
            <tr><td>Power avg / max</td><td>${num(r.avgPower)} / ${num(r.maxPower)} W</td><td>${r.weightLbs ? `at ${r.weightLbs} lbs` : ''}</td></tr>
            <tr><td>Calories</td><td>${num(r.calories)}</td><td></td></tr>
            ${r.filtered && (r.filtered.hr + r.filtered.cad + r.filtered.gct) ? `<tr><td>Glitches filtered</td><td>${r.filtered.hr + r.filtered.cad + r.filtered.gct}</td><td>${[r.filtered.hr && r.filtered.hr + ' HR', r.filtered.cad && r.filtered.cad + ' cadence', r.filtered.gct && r.filtered.gct + ' contact'].filter(Boolean).join(', ')}</td></tr>` : ''}
          </table>
        </div>
        <div class="btn-row">
          <button class="btn small danger" data-action="delete-ask">Delete this run</button>
          <span class="confirm" id="del-confirm">Delete for good? <button class="btn small danger" data-action="delete-yes">Delete</button><button class="btn small" data-action="delete-no">Keep</button></span>
        </div>
      </div>
    </div>`;

  if (s) chartTrace($('#c-trace'), s);
  $('#rec-in').addEventListener('change', async e => {
    const v = e.target.value.trim();
    r.recoveryHr = v === '' ? null : Math.max(0, Math.min(120, Math.round(+v)));
    await save(); toast('Recovery HR saved'); renderRunDetail(r.id);
  });
  let ft;
  $('#felt').addEventListener('input', e => { clearTimeout(ft); ft = setTimeout(() => { r.felt = e.target.value; save(); }, 500); });
  page.dataset.run = r.id;
}

function renderPlan(){
  const weeks = planState(), cur = weeks.at(-1), pw = cur.planWeek;
  const past = weeks.filter(w => !w.current).reverse();
  const DEC = { advance:'Advanced', repeat:'Repeated', back:'Went back a week' };
  $('#page-plan').innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Three runs a week · rest day between</div><h1 class="display">Plan</h1></div>
      <span class="chip"><span class="dot"></span>Week ${Math.min(pw, 8)} of 8</span></div>
    <div class="grid today-grid">
      <div class="col"><div class="plan-list">
        ${PLAN.map(p => `<div class="plan-row${p.w === Math.min(pw, 8) ? ' now' : ''}" style="${p.w < pw ? 'opacity:.55' : ''}">
          <div class="wk display num">${p.w}</div>
          <div><div class="p-t">${p.phase === p.session ? esc(p.session) : `${esc(p.phase)} · ${esc(p.session)}`}</div><div class="p-s">${esc(p.detail)}</div></div>
          <div class="p-s" style="max-width:240px">${esc(p.add)}</div>
        </div>`).join('')}
      </div></div>
      <div class="col">
        <div class="card"><div class="card-head"><h2>Week history</h2><span class="card-sub">decided by the gate; override if needed</span></div>
          ${past.length ? `<ul class="hist">${past.map((w, i) => `<li>
            <span><b>${fmtDate(w.start).slice(4)} – ${fmtDate(w.end).slice(4)}</b> · week ${Math.min(w.planWeek, 8)} · ${w.runs.length} run${w.runs.length === 1 ? '' : 's'}</span>
            <span>${DEC[w.decision]}${w.overridden ? ' (you)' : ''}
              ${i === 0 ? `· <button class="link-btn" data-decide="${w.start}" data-val="${w.decision === 'advance' ? 'repeat' : 'advance'}">${w.decision === 'advance' ? 'Repeat instead' : 'Advance instead'}</button>${w.overridden ? ` · <button class="link-btn" data-decide="${w.start}" data-val="">Use gate</button>` : ''}` : ''}</span>
          </li>`).join('')}</ul>` : '<p class="card-sub" style="margin:0">First week in progress.</p>'}
        </div>
        <div class="card"><div class="card-head"><h2>Rules that override the plan</h2></div>
          <ul class="rules">
            <li><b>Sport day or big day on your feet:</b> rest the day before, and skip the run right after if the legs are toast.</li>
            <li><b>Soreness past 48 hours, or sharp pain:</b> repeat the week.</li>
            <li><b>Miss a week:</b> go back one week, don’t jump ahead.</li>
            <li><b>One calf much worse, shin-bone pain, or Achilles tightness out of bed:</b> stop and get it looked at.</li>
            <li><b>Knee pain that turns sharp, swells, or causes a limp:</b> see a doctor or PT.</li>
            <li>Don’t add more than a couple of minutes of jogging a week. When in doubt, repeat the week.</li>
          </ul>
        </div>
        <div class="card"><div class="card-head"><h2>Pacing</h2></div>
          <p class="card-sub" style="margin:0">Run slow enough to hold a conversation. If that’s barely faster than a walk, don’t shuffle — control effort with <b>interval length, not pace</b>: jog 2 min, walk 90 sec, × 5, walking until HR is back under ${doc.profile.zones.easy}. If HR passes ~${doc.profile.zones.mod}, take a walk break.</p>
        </div>
      </div>
    </div>`;
}

  const code = authUi.stage === 'code';
  return `<div class="card" id="signin"><div class="card-head"><h2>Sign in</h2><span class="card-sub">keeps your runs on every device</span></div>
    <p class="card-sub" style="margin:0 0 12px">${code
      ? `We emailed <b>${esc(authUi.email)}</b>. Open it on this device and tap <b>Sign in</b>. It can take a minute — check spam if it doesn’t show.`
      : 'No password. We email you a sign-in link; anything already in this browser moves into your account.'}</p>
    <div class="field-row">${code
      ? `<div class="field"><label for="si-code">Got a code instead? Enter it here</label><input id="si-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></div>`
      : `<div class="field"><label for="si-email">Email</label><input id="si-email" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(authUi.email)}"></div>`}</div>
    <div class="btn-row" style="margin-top:14px">${code
      ? `<button class="btn small primary" data-action="verify-code">Sign in</button><button class="link-btn" data-action="change-email">Use a different email</button><button class="link-btn" data-action="send-link">Resend</button>`
      : `<button class="btn small primary" data-action="send-link"${authUi.busy ? ' disabled' : ''}>${authUi.busy ? 'Sending…' : 'Email me a link'}</button>`}</div></div>`;
}
function logItem(it){
  return `<li>${statusIcon(it.status)}<span style="flex:1"><div class="s-main">${it.title}</div><div class="s-sub">${it.sub}</div>
    ${it.makeTest ? `<div class="btn-row" style="margin-top:8px"><button class="btn small primary" data-make-test="${it.makeTest}">Yes — this is my flat test route</button></div>` : ''}
    ${it.runId ? `<div style="margin-top:6px"><a href="#runs/${it.runId}" class="link-btn">Open run →</a></div>` : ''}</span></li>`;
}
// Page-level drop so a file dragged anywhere still lands.
addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
addEventListener('drop', e => {
  if (!e.dataTransfer?.files?.length || e.target.closest?.('#drop')) return;
  e.preventDefault(); location.hash = 'upload'; handleFiles([...e.dataTransfer.files]);
});

let sdkP, zipP;
const loadSdk = () => sdkP ??= import(FITSDK_URL);
const loadZip = () => zipP ??= import(JSZIP_URL).then(m => m.default);

async function handleFiles(files){
  if (!files.length) return;
  if (location.hash !== '#upload') location.hash = 'upload';
  const jobs = [];
  for (const f of files){
    const lower = f.name.toLowerCase();
    try {
      if (lower.endsWith('.zip')){
        const Zip = await loadZip();
        const z = await Zip.loadAsync(await f.arrayBuffer());
        const fits = Object.values(z.files).filter(e => !e.dir && e.name.toLowerCase().endsWith('.fit'));
        if (!fits.length) importLog.unshift({ status:'crit', title:esc(f.name), sub:'No .fit file inside this zip.' });
        for (const e of fits) jobs.push([`${f.name} › ${e.name.split('/').pop()}`, await e.async('arraybuffer')]);
      } else if (lower.endsWith('.fit')) jobs.push([f.name, await f.arrayBuffer()]);
      else importLog.unshift({ status:'crit', title:esc(f.name), sub:'Not a .fit or .zip file — skipped.' });
    } catch (err){
      importLog.unshift({ status:'crit', title:esc(f.name), sub:`Couldn’t open it: ${esc(err.message)}` });
    }
  }
  for (const [name, buf] of jobs){
    try { importLog.unshift(await importFit(name, buf)); }
    catch (err){ importLog.unshift({ status:'crit', title:esc(name), sub:`Couldn’t read it: ${esc(err.message)}` }); }
  }
  await save();
  if (location.hash === '#upload') $('#log').innerHTML = importLog.map(logItem).join('');
}

function matchRoute(r){
  if (!r.startLL || !r.endLL) return null;
  for (const rt of doc.routes){
    if (haversine(r.startLL, rt.start) <= 150 && haversine(r.endLL, rt.end) <= 150 && Math.abs(r.distMi - rt.distMi) / rt.distMi <= 0.2) return rt.id;
  }
  return null;
}
function makeTestRoute(r){
  doc.routes.forEach(x => x.isTest = false);
  const rt = { id:'rt' + Date.now().toString(36), name:'Test route', start:r.startLL, end:r.endLL, distMi:r.distMi, isTest:true, from:r.id };
  doc.routes.push(rt);
  for (const x of doc.runs) if (x.startLL){ x.routeId = matchRoute(x); if (x.testOverride === false && x.id === r.id) x.testOverride = null; }
  r.routeId = rt.id; r.testOverride = null;
}

async function importFit(name, buf){
  const { Decoder, Stream } = await loadSdk();
  const decoder = new Decoder(Stream.fromArrayBuffer(buf));
  if (!decoder.isFIT()) throw new Error('not a FIT file');
  const { messages, errors } = decoder.read({ includeUnknownData:true, mergeHeartRates:true });
  if (!messages.recordMesgs?.length) throw new Error(errors?.[0]?.message ?? 'no activity data (is this a settings file?)');
  const { run, samples } = analyzeFit(messages, doc.profile);
  const title = `${fmtDate(run.date)} · ${fmtMi(run.distMi)} mi`;
  if (!/running|walking|generic/.test(run.sport)) return { status:'wait', title, sub:`A ${esc(run.sport || 'non-running')} activity — skipped.` };
  if (runById(run.id)) return { status:'wait', title, sub:'Already imported — skipped.', runId:run.id };

  // A FIT file for a day that came from the notes replaces that entry.
  const seed = doc.runs.find(x => x.source === 'manual' && Math.abs(diffDays(x.date, run.date)) <= 1 && Math.abs(x.distMi - run.distMi) / run.distMi <= 0.2);
  let sub = `${fmtDur(run.runSec)} jogging · ${fmtDur(run.walkSec)} walking`;
  if (run.jogHr != null) sub += ` · jogging HR ${Math.round(run.jogHr)}`;
  if (seed){
    run.felt = seed.felt || run.felt;
    run.recoveryHr ??= seed.recoveryHr;
    doc.checkins.forEach(c => { if (c.runId === seed.id) c.runId = run.id; });
    doc.runs = doc.runs.filter(x => x !== seed);
    sub += ' · replaced the entry from your notes';
  }
  run.routeId = matchRoute(run);
  doc.runs.push(run);
  await putSamples(run.id, samples);

  let makeTest = null;
  if (seed?.testOverride && !testRoute() && run.startLL){ makeTestRoute(run); sub += ' · set as your test route'; }
  else if (!testRoute() && run.startLL && (run.gainFt ?? 99) <= 50) makeTest = run.id;
  else if (isTest(run)) sub += ' · test route ✓';
  const fl = flagsFor(run).filter(f => f[0] === 'warn' || f[0] === 'crit');
  return { status: fl.length ? 'warn' : 'good', title, sub: sub + (fl.length ? ` · ${fl.map(f => esc(f[1])).join(', ')}` : ''), runId:run.id, makeTest };
}

async function rescoreAll(){
  for (const r of doc.runs){
    if (!r.hasSamples) continue;
    const s = await getSamples(r.id); if (!s) continue;
    Object.assign(r, zoneStats(s, doc.profile));
  }
}

async function exportBackup(){
  const samples = {};
  for (const r of doc.runs) if (r.hasSamples){ const s = await getSamples(r.id); if (s) samples[r.id] = s; }
  const blob = new Blob([JSON.stringify({ app:'stride', exported:new Date().toISOString(), doc:blobOf(), samples })], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `stride-backup-${todayYmd()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importBackup(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'stride' || !data.doc?.runs) throw new Error('not a Stride backup');
    const { sync } = doc;
    doc = normalize(data.doc);
    if (sync) doc.sync = sync;
    await idb.clear('samples').catch(() => {});
    memSamples.clear();
    for (const [id, s] of Object.entries(data.samples ?? {})) await putSamples(id, s);
    await save(); toast(`Restored ${doc.runs.length} runs`); render();
  } catch (err){ toast('Couldn’t import: ' + err.message); }
}

/* ── Actions ─────────────────────────────────────────────────────── */
document.addEventListener('click', async e => {
  const task = e.target.closest('[data-task]');
  if (task){
    const k = task.dataset.task;
    if (doc.done[k]) delete doc.done[k]; else doc.done[k] = true;
    task.setAttribute('aria-pressed', !!doc.done[k]);
    save(); return;
  }
  const ck = e.target.closest('[data-checkin]');
  if (ck){
    const c = { runId:ck.dataset.run, stage:ck.dataset.stage, value:ck.dataset.checkin, at:new Date().toISOString() };
    doc.checkins.push(c);
    lastResponse = { c, html: c.value === 'red' ? RESPONSES.red : RESPONSES[c.stage][c.value], alarm: c.value === 'red' || (c.stage === '48' && c.value !== 'none') };
    await save(); render(); return;
  }
  const rd = e.target.closest('[data-refday]');
  if (rd && !rd.disabled){
    const d = rd.dataset.refday;
    doc.refDays = isRef(d) ? doc.refDays.filter(x => x !== d) : [...doc.refDays, d];
    await save(); render(); return;
  }
  const row = e.target.closest('tr[data-run]');
  if (row){ location.hash = 'runs/' + row.dataset.run; return; }
  const mk = e.target.closest('[data-make-test]');
  if (mk){
    const r = runById(mk.dataset.makeTest); if (!r) return;
    makeTestRoute(r); importLog.forEach(it => { if (it.makeTest === r.id) it.makeTest = null; });
    await save(); toast('Test route set'); render(); return;
  }
  const dec = e.target.closest('[data-decide]');
  if (dec){
    if (dec.dataset.val) doc.decisions[dec.dataset.decide] = dec.dataset.val; else delete doc.decisions[dec.dataset.decide];
    await save(); render(); return;
  }
  const act = e.target.closest('[data-action]')?.dataset.action;
  if (!act) return;
  const r = runById($('#page-runs').dataset.run);
  switch (act){
    case 'back': location.hash = 'runs'; break;
    case 'clear-red': doc.redClearedAt = new Date().toISOString(); await save(); render(); break;
    case 'undo-checkin': doc.checkins = doc.checkins.filter(c => c !== lastResponse?.c); lastResponse = null; await save(); render(); break;
    case 'make-test': if (r){ makeTestRoute(r); await save(); toast('Test route set'); render(); } break;
    case 'not-test': if (r){ r.testOverride = false; await save(); render(); } break;
    case 'count-test': if (r){ r.testOverride = true; await save(); render(); } break;
    case 'delete-ask': $('#del-confirm').classList.add('show'); break;
    case 'delete-no': $('#del-confirm').classList.remove('show'); break;
    case 'delete-yes':
      if (r){
        doc.runs = doc.runs.filter(x => x !== r);
        doc.checkins = doc.checkins.filter(c => c.runId !== r.id);
        memSamples.delete(r.id); idb.del('samples', r.id).catch(() => {}); dropSamples(r.id);
        await save(); toast('Run deleted'); location.hash = 'runs';
      } break;
    case 'save-zones': {
      const g = id => Math.round(+$(id).value);
      const lthr = g('#s-lthr'), easy = g('#s-easy'), mod = g('#s-mod'), guard = g('#s-guard');
      if (!(easy < mod && mod < lthr) || lthr > 230 || easy < 80){ toast('Zones must go easy < moderate < threshold'); break; }
      Object.assign(doc.profile, { lthr, guardHr:guard, zones:{ easy, mod }, zonesSet:true });
      await rescoreAll(); await save(); toast('Zones saved — every run re-scored'); render(); break;
    }
    case 'add-weight': {
      const lbs = +$('#s-w').value, date = $('#s-wd').value;
      if (!(lbs > 50 && lbs < 600) || !date){ toast('Enter a weight and a date'); break; }
      doc.profile.weights = [...doc.profile.weights.filter(w => w.date !== date), { date, lbs }].sort((a, b) => a.date < b.date ? -1 : 1);
      await save(); toast('Weigh-in saved'); render(); break;
    }
    case 'export': exportBackup(); break;
    case 'reset-ask': $('#reset-confirm').classList.add('show'); break;
    case 'reset-no': $('#reset-confirm').classList.remove('show'); break;
    case 'reset-yes':
      { const { sync } = doc; doc = freshDoc(); if (sync) doc.sync = sync; }
      memSamples.clear(); importLog.length = 0; setUnsent([]);
      await idb.clear('samples').catch(() => {}); dropSamples(); await save(); toast('Reset to the starting data'); render(); break;
    case 'goto-signin': location.hash = 'upload'; setTimeout(() => $('#si-email, #si-code')?.focus(), 50); break;
    case 'send-link': sendLink(); break;
    case 'verify-code': verifyCode(); break;
    case 'change-email': authUi.stage = 'email'; renderUpload(); break;
    case 'signout': signOut(); break;
    case 'sync-now': if (doc.sync?.dirty) pushRow().catch(e => setSync('error', e.message)); else { await refreshFromRemote(); setSync(SYNC.status === 'off' ? 'ok' : SYNC.status); toast('Up to date'); } break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'si-email'){ sendLink(); return; }
  if (e.key === 'Enter' && e.target.id === 'si-code'){ verifyCode(); return; }
  if (e.key === 'Enter' && e.target.matches('tr[data-run]')) location.hash = 'runs/' + e.target.dataset.run;
  if (e.target.closest('input,textarea') || e.metaKey || e.ctrlKey) return;
  const pages = { 1:'today', 2:'progress', 3:'runs', 4:'plan', 5:'upload' };
  if (pages[e.key]) location.hash = pages[e.key];
});

/* ── Routing ─────────────────────────────────────────────────────── */
document.querySelectorAll('.nav-btn[data-page]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.page; }));
function render(){
  const [page, arg] = (location.hash.slice(1) || 'today').split('/');
  const pg = ['today', 'progress', 'runs', 'plan', 'upload'].includes(page) ? page : 'today';
  document.querySelectorAll('.nav-btn[data-page]').forEach(b => b.dataset.page === pg ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + pg));
  tip.classList.remove('show');
  if (pg === 'today') renderToday();
  if (pg === 'progress') renderProgress();
  if (pg === 'runs'){ $('#page-runs').dataset.run = ''; arg ? renderRunDetail(arg) : renderRunsList(); }
  if (pg === 'plan') renderPlan();
  if (pg === 'upload') renderUpload();
}
let lastRoute = null;
addEventListener('hashchange', () => { render(); if (location.hash !== lastRoute) scrollTo(0, 0); lastRoute = location.hash; });
let rt, lastW = innerWidth;
addEventListener('resize', () => {
  if (innerWidth === lastW) return; lastW = innerWidth;
  clearTimeout(rt); rt = setTimeout(() => { if (!/upload/.test(location.hash)) render(); }, 120);
});

/* ── Boot ────────────────────────────────────────────────────────── */
const fromLink = syncOn() ? consumeAuthHash() : null;
if (syncOn()) loadSession();
try { doc = await idb.get('doc', 'main'); }
catch { storageOk = false; }
doc = doc ? normalize(doc) : freshDoc();
await saveLocal();
if (!storageOk) toast('Storage is blocked here — changes won’t survive a reload');
lastRoute = location.hash;
render();
paintSync();
syncInit(fromLink);
</script>
</body>
