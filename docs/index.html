<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Running tracker: automatic Garmin import, heart-rate trends, body metrics and a plan that adapts week to week.">
<title>Stride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ───────────────────────────────────────────────────────── */
:root{
  color-scheme:light;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;

  --bg:#eef0ea;
  --surface:#ffffff;
  --surface-2:#f5f6f2;
  --ink:#0c0d0e;
  --ink-2:#4a4d52;
  --muted:#7c8087;
  --line:#e2e4de;
  --grid:#e8e9e4;
  --axis:#c5c8c0;

  --accent:#d4ff3a;          /* brand volt — fills only, never text on light */
  --accent-ink:#0c0d0e;      /* text that sits on the volt fill */
  --accent-text:#4b6a00;     /* volt-family text that reads on the surface */

  --series-1:#2a78d6;
  --series-1-wash:rgba(42,120,214,.08);
  --walk:#bfc2ba;

  --good:#0ca30c;  --good-text:#006300;
  --warn:#fab219;  --warn-text:#8a5a00;
  --crit:#d03b3b;  --crit-text:#b02a2a;

  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 0 rgba(12,13,14,.04), 0 1px 3px rgba(12,13,14,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0a0b0d; --surface:#14161a; --surface-2:#1b1e22;
    --ink:#f3f4f0; --ink-2:#b8bbb3; --muted:#7f838a;
    --line:#24272c; --grid:#22252a; --axis:#393d43;
    --accent-text:#d4ff3a;
    --series-1:#3987e5; --series-1-wash:rgba(57,135,229,.10);
    --walk:#4a4e55;
    --good-text:#3fcf3f; --warn-text:#fab219; --crit-text:#ff7a7a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0b0d; --surface:#14161a; --surface-2:#1b1e22;
  --ink:#f3f4f0; --ink-2:#b8bbb3; --muted:#7f838a;
  --line:#24272c; --grid:#22252a; --axis:#393d43;
  --accent-text:#d4ff3a;
  --series-1:#3987e5; --series-1-wash:rgba(57,135,229,.10);
  --walk:#4a4e55;
  --good-text:#3fcf3f; --warn-text:#fab219; --crit-text:#ff7a7a;
  --shadow:none;
}

/* ── Base ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.display{
  font-stretch:72%; font-weight:850; font-style:italic;
  letter-spacing:-.01em; text-transform:uppercase; line-height:.95;
}
.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted);
}
.num{font-variant-numeric:tabular-nums}

/* ── Shell: top bar + full-bleed poster bands ─────────────────────── */
.topbar{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px; margin:0 auto; padding:0 28px; height:62px; display:flex; align-items:center; gap:28px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; flex:none}
.brand-mark{width:30px; height:30px; border-radius:8px; background:var(--accent); display:grid; place-items:center; transform:skewX(-8deg)}
.brand-name{font-size:26px}
.tabs{display:flex; gap:2px; flex:1; min-width:0}
.tab{
  display:flex; align-items:center; gap:7px; padding:8px 13px; border:0; border-radius:999px; background:none;
  font-weight:650; font-size:14px; color:var(--ink-2); cursor:pointer; white-space:nowrap
}
.tab svg{width:17px; height:17px; flex:none}
.tab:hover{background:var(--surface-2); color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink); color:var(--surface)}
.tab[aria-current="page"] svg{color:var(--accent)}
.top-right{display:flex; align-items:center; gap:10px; flex:none}
.icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; color:var(--ink-2)}
.icon-btn:hover{color:var(--ink); border-color:var(--ink-2)}
.icon-btn svg{width:17px; height:17px}
#syncbox{display:flex; align-items:center}
.sync-pill{display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; font-weight:650; color:var(--ink-2); cursor:pointer; text-decoration:none; white-space:nowrap}
.sync-pill.signin{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.sync-line{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:650; color:var(--ink-2)}
.sync-line .dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--good)}
.sync-busy .dot,.sync-signedout .dot,.sync-off .dot{background:none; box-shadow:0 0 0 1.5px var(--muted) inset}
.sync-error,.sync-conflict{color:var(--crit-text)}
.sync-error .dot,.sync-conflict .dot{background:var(--crit)}
@media (max-width:720px){ .sync-pill .sync-txt{display:none} .sync-pill.sync-line{padding:10px} }
dialog#choose{
  max-width:min(440px, calc(100vw - 32px)); padding:24px; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); color:var(--ink); box-shadow:0 12px 40px rgba(0,0,0,.25)
}
dialog#choose::backdrop{background:rgba(10,11,13,.55)}
dialog#choose h2{font-size:32px; margin:0 0 10px}
dialog#choose p{margin:0 0 18px; color:var(--ink-2); font-size:14.5px}

main{min-width:0; padding-bottom:80px}
.page{display:none}
.page.active{display:block}
.wrap{max-width:1240px; margin:0 auto; padding:0 28px}

.band{position:relative; overflow:hidden; background:var(--ink); color:var(--surface); margin-bottom:28px}
:root[data-theme="dark"] .band{background:var(--surface); color:var(--ink); border-bottom:3px solid var(--accent)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .band{background:var(--surface); color:var(--ink); border-bottom:3px solid var(--accent)} }
.band-in{position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:34px 28px 30px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px 40px; align-items:end}
.band .eyebrow{color:var(--accent)}
.band-title{font-size:clamp(56px, 9vw, 112px); margin:10px 0 0; line-height:.86}
.band-title em{font-style:inherit; color:var(--accent)}
.band-sub{margin:14px 0 0; max-width:60ch; opacity:.8; font-size:15.5px}
.band-stats{display:flex; gap:30px; flex-wrap:wrap; justify-content:flex-end}
.bstat-v{font-size:52px; line-height:.9}
.bstat-v small{font-size:16px; font-style:normal; font-weight:700; opacity:.6; margin-left:4px; font-stretch:90%; text-transform:none}
.bstat-l{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin-top:6px}
.band-wide{grid-column:1 / -1}
.band-stripes{
  position:absolute; right:-60px; top:0; bottom:0; width:42%; opacity:.13; pointer-events:none;
  background:repeating-linear-gradient(115deg, var(--accent) 0 18px, transparent 18px 44px);
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 60%); mask-image:linear-gradient(90deg, transparent, #000 60%)
}
.band .task{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12)}
:root[data-theme="dark"] .band .task{background:var(--surface-2); border-color:var(--line)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .band .task{background:var(--surface-2); border-color:var(--line)} }
.band .task-list{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); margin-top:20px}
.band .btn{color:var(--ink)}
.band .link-btn{color:inherit; opacity:.75}
.section-label{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:30px 0 12px; display:flex; align-items:center; gap:10px}
.section-label::after{content:""; flex:1; height:1px; background:var(--line)}

/* ── Cards ────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow); min-width:0;
}
.card h2{margin:0; font-size:15px; font-weight:750}
.card-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; margin-bottom:14px; flex-wrap:wrap}
.card-sub{color:var(--muted); font-size:13px}
.grid{display:grid; gap:16px}
.today-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); align-items:start}
.col{display:grid; gap:16px; min-width:0}

.task-list{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); margin-top:20px}
.band .btn{color:var(--ink)}
.band .link-btn{color:inherit; opacity:.75}
.section-label{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:30px 0 12px; display:flex; align-items:center; gap:10px}
.section-label::after{content:""; flex:1; height:1px; background:var(--line)}

/* ── Cards ────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow); min-width:0;
}
.card h2{margin:0; font-size:15px; font-weight:750}
.card-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; margin-bottom:14px; flex-wrap:wrap}
.card-sub{color:var(--muted); font-size:13px}
.grid{display:grid; gap:16px}
.today-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); align-items:start}
.col{display:grid; gap:16px; min-width:0}

/* hero assignment */
.hero{
  position:relative; overflow:hidden; padding:26px 24px 22px;
  background:var(--ink); color:var(--surface); border:0;
}
:root[data-theme="dark"] .hero{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hero{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)} }
.hero .eyebrow{color:var(--accent)}
.hero-title{font-size:68px; margin:10px 0 12px}
.hero-title em{font-style:inherit; color:var(--accent)}
.hero p{margin:0; max-width:52ch; opacity:.82}
.hero-stripes{
  position:absolute; right:-40px; top:-20px; width:260px; height:200px; opacity:.12;
  background:repeating-linear-gradient(115deg, var(--accent) 0 14px, transparent 14px 34px);
  pointer-events:none;
}
.task-list{list-style:none; margin:18px 0 0; padding:0; display:grid; gap:8px}
.task{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:11px 12px; border-radius:10px; cursor:pointer;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10);
}
.card .task{background:var(--surface-2); border:1px solid var(--line)}
.task .box{
  width:22px; height:22px; flex:none; border-radius:7px; border:2px solid currentColor; opacity:.55;
  display:grid; place-items:center;
}
.task .box svg{width:14px; height:14px; opacity:0}
.task[aria-pressed="true"] .box{background:var(--accent); border-color:var(--accent); opacity:1; color:var(--accent-ink)}
.task[aria-pressed="true"] .box svg{opacity:1}
.task[aria-pressed="true"] .t-main{text-decoration:line-through; opacity:.55}
.t-main{font-weight:600}
.t-sub{font-size:12.5px; opacity:.65}
.task .t-meta{margin-left:auto; font-size:12px; opacity:.6; white-space:nowrap}

/* check-in */
.pill-row{display:flex; flex-wrap:wrap; gap:8px}
.pill{
  padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
  font-weight:600; cursor:pointer; font-size:14px;
}
.pill:hover{border-color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.pill.flag{border-style:dashed}
.response{margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--surface-2); font-size:14px; display:none}
.response.show{display:block}
.response.alarm{background:color-mix(in srgb, var(--crit) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--crit) 40%, transparent)}

/* status rows */
.status-list{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.status-row{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line)}
.status-row:first-child{border-top:0}
.s-icon{width:22px; height:22px; flex:none; border-radius:50%; display:grid; place-items:center; margin-top:1px}
.s-icon svg{width:13px; height:13px}
.s-good{background:var(--good); color:#fff}
.s-warn{background:var(--warn); color:#1a1300}
.s-crit{background:var(--crit); color:#fff}
.s-wait{background:var(--surface-2); color:var(--muted); border:1.5px dashed var(--axis)}
.s-main{font-weight:600}
.s-sub{font-size:13px; color:var(--muted)}
.verdict{margin-top:14px; padding:12px 14px; border-radius:10px; background:var(--surface-2); display:flex; gap:10px; align-items:center; font-size:14px}
.verdict strong{font-weight:750}

/* week strip */
.days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.day{
  border-radius:10px; padding:9px 4px 10px; text-align:center; background:var(--surface-2);
  border:1px solid var(--line); min-width:0;
}
.day .d-name{font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--muted); text-transform:uppercase}
.day .d-num{font-size:20px; font-weight:800; font-stretch:75%; margin:2px 0 6px}
.day .d-tag{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 0; border-radius:6px}
.day.today{outline:2px solid var(--ink); outline-offset:-1px}
.tag-run{background:var(--accent); color:var(--accent-ink)}
.tag-ref{background:var(--ink); color:var(--surface)}
.tag-rest{color:var(--muted)}
.tag-done{color:var(--accent-text)}

.plan-bar{display:grid; grid-template-columns:repeat(8,1fr); gap:4px; margin-top:6px}
.plan-seg{height:8px; border-radius:4px; background:var(--grid)}
.plan-seg.done{background:var(--ink)}
.plan-seg.now{background:var(--accent); box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.plan-labels{display:grid; grid-template-columns:repeat(8,1fr); gap:4px; margin-top:6px; font-size:11px; color:var(--muted); text-align:center}

.note{
  display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:var(--radius);
  background:color-mix(in srgb, var(--warn) 14%, var(--surface)); border:1px solid color-mix(in srgb, var(--warn) 45%, transparent);
  font-size:14px;
}
.note b{font-weight:700}

details.protocol summary{cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center}
details.protocol summary::-webkit-details-marker{display:none}
details.protocol summary .caret{transition:transform .15s; color:var(--muted)}
details.protocol[open] summary .caret{transform:rotate(180deg)}
.next-run-big{font-size:40px; margin:6px 0 4px}
.kv{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:10px}
.kv div{font-size:13px; color:var(--muted)}
.kv b{display:block; font-size:17px; color:var(--ink); font-weight:750}
.switch{display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600; font-size:14px; user-select:none}
.switch input{appearance:none; width:40px; height:24px; border-radius:999px; background:var(--axis); position:relative; cursor:pointer; margin:0; transition:background .15s}
.switch input::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(16px); background:var(--accent)}

/* ── Progress ─────────────────────────────────────────────────────── */
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .k-val{font-size:64px; margin:14px 0 2px; display:flex; align-items:baseline; gap:8px}
.kpi .k-unit{font-size:18px; font-style:normal; font-weight:700; color:var(--muted); font-stretch:90%; text-transform:none}
.kpi .k-dir{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.kpi .k-foot{margin-top:12px; font-size:13px; color:var(--muted)}
.kpi .k-foot b{color:var(--ink); font-weight:650}
.te-strip{display:flex; gap:6px; margin-top:10px}
.te-cell{flex:1; border-radius:8px; padding:7px 8px; background:var(--surface-2); border:1px solid var(--line); font-size:12px; color:var(--muted)}
.te-cell b{display:flex; align-items:center; gap:5px; font-size:16px; color:var(--ink)}
.te-cell i{width:9px; height:9px; border-radius:50%; display:inline-block}

.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr)); align-items:start}
.card-link{display:block; text-decoration:none; color:inherit}
.mini-stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 12px}
.ms-l{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.ms-v{font-size:34px; margin-top:4px}
.ms-v small{font-size:13px; font-style:normal; font-weight:700; color:var(--muted); margin-left:3px; font-stretch:90%; text-transform:none}
.delta{display:block; font-size:12px; font-weight:650; color:var(--muted); margin-top:2px}
.delta.good{color:var(--good-text)} .delta.bad{color:var(--warn-text)}
.band .delta{display:inline; margin-left:4px; color:inherit; opacity:.75}
.band-deltas{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; opacity:.85}
.band-deltas:empty{display:none}
.filter-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
.plan-pick{grid-template-columns:repeat(auto-fit, minmax(230px, 1fr))}
.plan-card{text-align:left; cursor:pointer; font:inherit; color:inherit; display:flex; flex-direction:column; gap:8px; transition:border-color .12s, transform .12s}
.plan-card:hover{border-color:var(--ink-2)}
.plan-card[aria-pressed="true"]{border-color:var(--ink); box-shadow:0 0 0 2px var(--accent)}
.plan-card p{margin:0; font-size:14px; color:var(--ink-2)}
.pc-name{font-size:38px; margin:2px 0 4px}
.pc-goal{padding-top:10px; border-top:1px solid var(--line)}
.pc-goal b{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.btn[disabled]{opacity:.45; cursor:default}
.mara-sum{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px}
.mara-sum b{display:block; font-size:34px; line-height:1}
.mara-sum span{font-size:11.5px; color:var(--muted); font-weight:650}
.mara-strip{display:flex; align-items:flex-end; gap:3px; height:90px; border-bottom:1px solid var(--axis)}
.mara-strip i{flex:1; background:var(--series-1); border-radius:4px 4px 0 0; min-width:4px}
.mara-strip i.cut{opacity:.45}
.mara-strip i.taper{background:var(--walk)}
.mara-strip i.race{background:var(--accent); box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
@media (max-width:720px){ .mara-sum{grid-template-columns:repeat(2,minmax(0,1fr))} }
.card-link:hover{border-color:var(--ink-2)}
.chart{width:100%; position:relative}
.chart svg{display:block; width:100%; overflow:visible}
.chart text{font-family:var(--font); font-size:11px; fill:var(--muted)}
.chart .lbl{fill:var(--ink); font-weight:700; font-size:12px; paint-order:stroke; stroke:var(--surface); stroke-width:4px; stroke-linejoin:round}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); margin-bottom:10px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
.legend i.ring{border-radius:50%; border:2px solid var(--muted); background:var(--surface)}
.legend i.dotf{border-radius:50%}
.pending-box{
  height:170px; border-radius:10px; border:1.5px dashed var(--axis); display:grid; place-items:center;
  text-align:center; color:var(--muted); font-size:13.5px; padding:16px;
}
table.quiet{width:100%; border-collapse:collapse; font-size:13.5px}
table.quiet td{padding:9px 0; border-top:1px solid var(--line)}
table.quiet td:nth-child(2){text-align:right; font-weight:650; font-variant-numeric:tabular-nums}

<script type="module">
/* ═══════════════════════════════════════════════════════════════════
   STRIDE — running tracker
   One file. Runs, check-ins and settings live in this browser's
   IndexedDB; FIT files are parsed in the page and never uploaded.
   ═══════════════════════════════════════════════════════════════════ */

const FITSDK_URL = 'https://cdn.jsdelivr.net/npm/@garmin/fitsdk@21.217.0/+esm';
const JSZIP_URL  = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

/* ── Plans ──────────────────────────────────────────────────────────
   Each plan is weeks of three runs. Slot 3 can be a long run, a speed run or
   a time trial. 'track' has no weeks: Stride just logs and charts. */
const PLANS = {
  build: {
    name:'Run/walk build', short:'Run/walk', who:'Coming back from a break, or new to running. Starts at 9–10 minutes of jogging with walk breaks.',
    goal:'A continuous 1.5 miles, then a little speed',
    weeks: [
      { phase:'Base',      session:'9–10 min jog',     detail:'Flat route, walk breaks as needed',                     add:'Nothing — just no calf pain the next day' },
      { phase:'Base',      session:'9–10 min jog',     detail:'Flat route, walk breaks as needed',                     add:'Nothing — just no calf pain the next day' },
      { phase:'Full mile', session:'Full mile',        detail:'Same route, work toward the full mile continuous',      add:'4 × 20 sec strides after one run', strides:1 },
      { phase:'Full mile', session:'Full mile',        detail:'Same route, work toward the full mile continuous',      add:'4 × 20 sec strides after one run', strides:1 },
      { phase:'Extend',    session:'1.25–1.5 mi easy', detail:'Same easy pace. Keep one run a week on the test route', add:'Strides after two runs a week', strides:2 },
      { phase:'Extend',    session:'1.25–1.5 mi easy', detail:'Same easy pace. Keep one run a week on the test route', add:'Strides after two runs a week', strides:2 },
      { phase:'Speed',     session:'1.5 mi easy',      detail:'Two easy runs at 1.5 mi, one speed run',                add:'Speed run: warm up, 4 × 2 min harder / 2 min walk, cool down',
        third:['Speed run', 'Warm up, 4 × 2 min harder with 2 min walk, cool down'] },
      { phase:'Speed',     session:'1.5 mi easy',      detail:'Two easy runs at 1.5 mi, one speed run',                add:'Speed run: warm up, 4 × 2 min harder / 2 min walk, cool down',
        third:['Speed run', 'Warm up, 4 × 2 min harder with 2 min walk, cool down'] },
    ],
  },
  '5k': {
    name:'Build to 5K', short:'5K', who:'You can already jog about 20 minutes without stopping. Ends with a 5K time trial.',
    goal:'Run 5K (3.1 mi) continuously, then race it',
    weeks: [
      { phase:'Base',    session:'20 min easy', detail:'Conversational pace the whole way',          add:'Nothing new — settle into three runs a week' },
      { phase:'Base',    session:'22 min easy', detail:'Conversational pace the whole way',          add:'4 × 20 sec strides after one run', strides:1 },
      { phase:'Build',   session:'25 min easy', detail:'One run a week longer than the others',      add:'Long run: 30 min easy', strides:1, third:['Long run', '30 min easy — slower than you think'] },
      { phase:'Build',   session:'25 min easy', detail:'One run a week longer than the others',      add:'Long run: 32 min easy', strides:2, third:['Long run', '32 min easy'] },
      { phase:'Extend',  session:'28 min easy', detail:'Keep one run a week on the test route',      add:'Long run: 35 min easy', strides:2, third:['Long run', '35 min easy'] },
      { phase:'Sharpen', session:'25 min easy', detail:'Two easy runs and one with some speed',      add:'Speed run: 5 × 3 min at 5K effort, 2 min jog between',
        third:['Speed run', 'Warm up 10 min, 5 × 3 min at 5K effort with 2 min easy jog, cool down'] },
      { phase:'Sharpen', session:'28 min easy', detail:'Two easy runs and one with some speed',      add:'Speed run: 4 × 5 min at 5K effort, 2 min jog between',
        third:['Speed run', 'Warm up 10 min, 4 × 5 min at 5K effort with 2 min easy jog, cool down'] },
      { phase:'Race',    session:'20 min easy', detail:'Ease off so the legs are fresh',             add:'5K time trial on run 3 — run it, then celebrate',
        third:['5K time trial', 'Warm up 10 min, then run 5K as evenly as you can'] },
    ],
  },
  marathon: {
    name:'Marathon', short:'Marathon', who:'You already run a few times a week and have a race on the calendar. Built backward from race day and from what you can run now.',
    goal:'Get to the start line healthy, and finish',
    get weeks(){ return marathonWeeks(); },
  },
  track: {
    name:'Just track', short:'Tracking', who:'You already have your own training. No plan, no weekly gate — Stride logs every run and charts the trends.',
    goal:null, weeks:[],
  },
};
const activePlan = () => PLANS[doc.planId] ?? PLANS.build;
const planLen = () => activePlan().weeks.length;
const coached = () => planLen() > 0;

const PROTOCOL = p => [
  ['p1','Start where the test route starts','Not from home if there’s a hill on the way — a climb contaminates every average'],
  ['p2','Warm up','5 min brisk walk, then 10 leg swings per side'],
  ['p3','Run the flat test route',`Under ~50 ft total gain. Walk break if HR passes ~${p.zones.mod}`],
  ['p4','Stop the timer at the finish','Don’t hit Save yet'],
  ['p5','Stand still for 2 minutes','This is how the watch captures recovery HR'],
  ['p6','Save, then walk home','That’s the cooldown'],
];

const TASKS = {
  hip:    ['Half-kneeling hip flexor stretch','Back knee down, squeeze the glute, tuck the hips · 30–45 sec','2–3× / side'],
  calf:   ['Calf stretch — straight leg, then bent','30 sec each, against the wall','2× / side'],
  roll:   ['Foam roll or tennis ball the calves','','~5 min'],
  bridge: ['Glute bridges','Takes load off the hip flexors and knees','2–3 × 12–15'],
  sporthip: ['Hip flexor stretch between sessions','Most sports work them hard','each break'],
};

/* SEED:START — empty in the published copy. */
const SEED = {};
/* SEED:END */

// ==ANALYZE:START== pure helpers + FIT analysis (no DOM) ───────────────
const MI = 1609.344, FT = 3.28084;
const IDLE_TOLERANCE = 20;   // seconds of standing still before a run is flagged
const RUN_CADENCE = 125;     // spm — at or above is jogging, below is walking

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const weekStart = s => addDays(s, -((parseYmd(s).getDay() + 6) % 7));   // Monday
const fmtDur = s => { if (s == null || !isFinite(s)) return '—'; s = Math.round(s); return `${Math.floor(s/60)}:${pad(s%60)}`; };

function median(a){
  const b = a.filter(v => v != null && !Number.isNaN(v)).sort((x, y) => x - y);
  if (!b.length) return null;
  const m = b.length >> 1;
  return b.length % 2 ? b[m] : (b[m-1] + b[m]) / 2;
}
function rollMedian(arr, i, k){
  const w = [];
  for (let j = Math.max(0, i-k); j <= Math.min(arr.length-1, i+k); j++) w.push(arr[j]);
  return median(w);
}
function haversine(a, b){
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0]-a[0]) * r, dLon = (b[1]-a[1]) * r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*r) * Math.cos(b[0]*r) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Time in each threshold-anchored zone. Recomputed whenever the zones change,
// so every run is always measured against the same lines.
function zoneStats(s, profile){
  const { easy, mod } = profile.zones, lt = profile.lthr;
  const z = { easy:0, mod:0, hard:0, above:0 };
  let above = 0;
  for (let i = 0; i < s.t.length; i++){
    const hr = s.hr[i]; if (hr == null) continue;
    const dt = i < s.t.length-1 && s.t[i+1]-s.t[i] <= 5 ? s.t[i+1]-s.t[i] : 1;
    if (hr >= lt){ z.above += dt; above += dt; }
    else if (hr >= mod) z.hard += dt;
    else if (hr >= easy) z.mod += dt;
    else z.easy += dt;
  }
  return { aboveLtSec: above, zoneSec: z };
}

function analyzeFit(messages, profile){
  const session = messages.sessionMesgs?.[0] ?? {};
  const recs = (messages.recordMesgs ?? []).filter(r => r.timestamp);
  if (!recs.length) throw new Error('No second-by-second samples in this file');
  const sport = String(session.sport ?? messages.sportMesgs?.[0]?.sport ?? '').toLowerCase();
  const startDate = new Date(session.startTime ?? recs[0].timestamp);
  const t0 = +startDate;
  const n = recs.length;

  const T = [], HR = [], SPD = [], CAD = [], PWR = [], ALT = [], DIST = [], GCT = [], LAT = [], LON = [];
  for (const r of recs){
    T.push(Math.round((+new Date(r.timestamp) - t0) / 1000));
    HR.push(r.heartRate ?? null);
    SPD.push(r.enhancedSpeed ?? r.speed ?? null);
    CAD.push(r.cadence != null ? (r.cadence + (r.fractionalCadence || 0)) * 2 : null);   // strides → steps
    PWR.push(r.power ?? null);
    ALT.push(r.enhancedAltitude ?? r.altitude ?? null);
    DIST.push(r.distance ?? null);
    GCT.push(r.stanceTime ?? null);
    LAT.push(r.positionLat != null ? r.positionLat * 180 / 2**31 : null);
    LON.push(r.positionLong != null ? r.positionLong * 180 / 2**31 : null);
  }

  // Single-sample sensor glitches: drop anything far from its neighbours.
  const filtered = { hr:0, cad:0, gct:0 };
  const HRf = HR.map((v, i) => {
    if (v == null) return null;
    const m = rollMedian(HR, i, 3);
    if (v < 40 || v > 230 || (m != null && Math.abs(v - m) > 25)){ filtered.hr++; return null; }
    return v;
  });
  const CADf = CAD.map((v, i) => {
    if (v == null) return null;
    const m = rollMedian(CAD, i, 2);
    if (v > 200 || (m != null && v - m > 40)){ filtered.cad++; return null; }
    return v;
  });
  const GCTf = GCT.map((v, i) => {
    if (v == null) return null;
    const m = rollMedian(GCT, i, 4);
    if (v < 150 || v > 500 || (m != null && Math.abs(v - m) > 70)){ filtered.gct++; return null; }
    return v;
  });
  const SPDf = SPD.map(v => v == null || v > 7 ? null : v);
  const DT = T.map((t, i) => i < n-1 && T[i+1] - t <= 5 ? T[i+1] - t : 1);   // gaps are timer pauses

  // Run / walk / idle, from smoothed cadence and speed.
  let ST = T.map((_, i) => {
    const c = rollMedian(CADf, i, 2), s = rollMedian(SPDf, i, 2);
    if ((s == null || s < 0.35) && (c == null || c < 40)) return 0;
    if (c != null ? c >= RUN_CADENCE : (s ?? 0) >= 1.6) return 2;
    return 1;
  });
  // Fold blips shorter than 8 s into the segment before them.
  const segs = [];
  ST.forEach((st, i) => {
    const last = segs.at(-1);
    if (last && last.st === st){ last.i1 = i; last.dur += DT[i]; }
    else segs.push({ st, i0:i, i1:i, dur:DT[i] });
  });
  for (let k = 1; k < segs.length; k++){
    if (segs[k].dur < 8){ for (let i = segs[k].i0; i <= segs[k].i1; i++) ST[i] = segs[k-1].st; segs[k].st = segs[k-1].st; }
  }
  // Garmin's own run/walk detection (rwd* splits) wins wherever it covers a sample.
  const RWD = { rwdRun:2, rwdWalk:1, rwdStand:0 };
  const rwdSplits = (messages.splitMesgs ?? []).filter(x => x.splitType in RWD && x.totalTimerTime > 0 && x.startTime);
  for (const sp of rwdSplits){
    const a = Math.round((+new Date(sp.startTime) - t0) / 1000);
    const b = Math.round((+new Date(sp.endTime ?? +new Date(sp.startTime) + sp.totalElapsedTime * 1000) - t0) / 1000);
    for (let i = 0; i < n; i++) if (T[i] >= a && T[i] <= b) ST[i] = RWD[sp.splitType];
  }
  const rwdSum = {};
  for (const x of messages.splitSummaryMesgs ?? []) if (x.splitType in RWD) rwdSum[x.splitType] = x;

  let runSec = 0, walkSec = 0, idleSec = 0, runDist = 0, hrSum = 0, hrW = 0;
  const runHr = [];
  for (let i = 0; i < n; i++){
    const dt = DT[i];
    if (ST[i] === 2){
      runSec += dt;
      if (i < n-1 && DIST[i] != null && DIST[i+1] != null && T[i+1]-T[i] <= 5) runDist += DIST[i+1] - DIST[i];
      if (HRf[i] != null){ hrSum += HRf[i] * dt; hrW += dt; runHr.push([runSec, HRf[i], dt]); }
    }
    else if (ST[i] === 1) walkSec += dt;
    else idleSec += dt;
  }
  // Cardiac drift: second half of the jogging vs the first half.
  let drift = null;
  if (runSec >= 480 && runHr.length > 20){
    const half = runSec / 2;
    const a = runHr.filter(x => x[0] <= half), b = runHr.filter(x => x[0] > half);
    const mean = xs => xs.reduce((s, x) => s + x[1]*x[2], 0) / xs.reduce((s, x) => s + x[2], 0);
    drift = Math.round((mean(b) - mean(a)) * 10) / 10;
  }

  const altOk = ALT.filter(v => v != null);
  let gainFt = session.totalAscent != null ? session.totalAscent * FT : null;
  if (gainFt == null && altOk.length){
    let g = 0, ref = altOk[0];
    for (const a of altOk){ if (a - ref > 1){ g += a - ref; ref = a; } else if (a < ref) ref = a; }
    gainFt = g * FT;
  }
  const firstLL = LAT.findIndex((v, i) => v != null && LON[i] != null);
  let lastLL = -1; for (let i = n-1; i >= 0; i--) if (LAT[i] != null && LON[i] != null){ lastLL = i; break; }
  const path = [];
  for (let i = 0; i < n; i += 5) if (LAT[i] != null && LON[i] != null) path.push([+LAT[i].toFixed(5), +LON[i].toFixed(5)]);

  if (rwdSum.rwdRun){
    runSec = rwdSum.rwdRun.totalTimerTime ?? runSec;
    if (rwdSum.rwdRun.totalDistance) runDist = rwdSum.rwdRun.totalDistance;
    if (rwdSum.rwdRun.avgHeartRate) hrSum = rwdSum.rwdRun.avgHeartRate, hrW = 1;
  }
  if (rwdSum.rwdWalk) walkSec = rwdSum.rwdWalk.totalTimerTime ?? walkSec;
  if (rwdSum.rwdStand) idleSec = rwdSum.rwdStand.totalTimerTime ?? idleSec;
  runSec = Math.round(runSec); walkSec = Math.round(walkSec); idleSec = Math.round(idleSec);

  // The watch's own local time, so the date is right wherever the file is opened.
  const act = messages.activityMesgs?.[0];
  const tzOffsetSec = act?.localTimestamp != null && act.timestamp ? Math.round(act.localTimestamp + 631065600 - +new Date(act.timestamp) / 1000) : null;
  const localDate = tzOffsetSec == null ? ymd(startDate) : new Date(t0 + tzOffsetSec * 1000).toISOString().slice(0, 10);
  // Recovery HR isn't in the public FIT profile; the FR265 writes it to session field 202.
  const recoveryHr = typeof session[202] === 'number' && session[202] > 0 ? session[202] : null;

  const lastDist = [...DIST].reverse().find(v => v != null) ?? 0;
  const distMi = (session.totalDistance ?? lastDist) / MI;
  const timerSec = session.totalTimerTime ?? T[n-1];
  const hrVals = HRf.filter(v => v != null);
  const user = messages.userProfileMesgs?.[0];
  const zt = messages.zonesTargetMesgs?.[0];

  // Garmin-only fields that aren't in the public FIT profile (recovery HR among
  // them) arrive as numbered fields. Keep them so they can be mapped later.
  const unknown = {};
  for (const [k, v] of Object.entries(session)) if (/^\d+$/.test(k) && typeof v === 'number') unknown['session.' + k] = v;

  const samples = {
    t: T, hr: HRf, st: ST, cad: CADf.map(v => v == null ? null : Math.round(v)),
    spd: SPDf.map(v => v == null ? null : Math.round(v * 100)),
    alt: ALT.map(v => v == null ? null : Math.round(v * 10)),
    dist: DIST.map(v => v == null ? null : Math.round(v)),
    gct: GCTf.map(v => v == null ? null : Math.round(v)),
    pwr: PWR, path,
  };
  const zs = zoneStats(samples, profile);

  const run = {
    id: 'g' + Math.round(t0 / 1000), source: 'fit', date: localDate, start: startDate.toISOString(), tzOffsetSec,
    sport, subSport: String(session.subSport ?? ''),
    distMi, elapsedSec: session.totalElapsedTime ?? T[n-1], timerSec,
    movingSec: runSec + walkSec, runSec, walkSec, idleSec,
    avgPaceSec: distMi > 0.05 ? timerSec / distMi : null,
    jogPaceSec: runDist > 50 ? runSec / (runDist / MI) : null,
    avgHr: session.avgHeartRate ?? (hrVals.length ? Math.round(hrVals.reduce((a, b) => a + b, 0) / hrVals.length) : null),
    maxHr: session.maxHeartRate ?? (hrVals.length ? Math.max(...hrVals) : null),
    jogHr: hrW ? Math.round(hrSum / hrW * 10) / 10 : null,
    drift, aboveLtSec: zs.aboveLtSec, zoneSec: zs.zoneSec,
    recoveryHr,
    aerobicTE: session.totalTrainingEffect ?? null,
    anaerobicTE: session.totalAnaerobicTrainingEffect ?? null,
    load: session.trainingLoadPeak != null ? Math.round(session.trainingLoadPeak) : null,
    avgPower: session.avgPower ?? null, maxPower: session.maxPower ?? null,
    weightLbs: user?.weight ? Math.round(user.weight * 2.20462 * 10) / 10 : null,
    cadence: (() => { const c = median(CADf.filter((_, i) => ST[i] === 2)); return c == null ? null : Math.round(c); })(),
    stride: session.avgStepLength ? Math.round(session.avgStepLength) / 1000 : null,
    vertRatio: session.avgVerticalRatio ?? null,
    vertOsc: session.avgVerticalOscillation != null ? Math.round(session.avgVerticalOscillation) / 10 : null,
    gct: (() => { const g = median(GCTf.filter((_, i) => ST[i] === 2)); return g == null ? (session.avgStanceTime ?? null) : Math.round(g); })(),
    gainFt: gainFt == null ? null : Math.round(gainFt),
    minElevFt: altOk.length ? Math.round(Math.min(...altOk) * FT) : null,
    maxElevFt: altOk.length ? Math.round(Math.max(...altOk) * FT) : null,
    calories: session.totalCalories ?? null,
    startLL: firstLL >= 0 ? [LAT[firstLL], LON[firstLL]] : null,
    endLL: lastLL >= 0 ? [LAT[lastLL], LON[lastLL]] : null,
    garminMaxHr: zt?.maxHeartRate ?? null, garminLthr: zt?.thresholdHeartRate ?? null,
    filtered, unknown, hasSamples: true,
    felt: '', routeId: null, testOverride: null,
  };
  return { run, samples };
}
// ==ANALYZE:END==

/* ── Storage: IndexedDB, one doc + one samples row per run ───────── */
const idb = {
  _db: null,
  open(){
    return this._db ??= new Promise((res, rej) => {
      const r = indexedDB.open('stride', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('doc'); r.result.createObjectStore('samples'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = () => res(req?.result);
      t.onerror = () => rej(t.error);
    });
  },
  get(store, k){ return this.tx(store, 'readonly', s => s.get(k)); },
  put(store, k, v){ return this.tx(store, 'readwrite', s => s.put(v, k)); },
  del(store, k){ return this.tx(store, 'readwrite', s => s.delete(k)); },
  clear(store){ return this.tx(store, 'readwrite', s => s.clear()); },
  keys(store){ return this.tx(store, 'readonly', s => s.getAllKeys()); },
};
let storageOk = true;
const memSamples = new Map();

function freshDoc(){
  return {
    v: 1,
    planStart: SEED.planStart ?? weekStart(todayYmd()),
    profile: structuredClone(SEED.profile ?? { lthr:170, guardHr:185, zones:{ easy:145, mod:160 }, weights:[], zonesSet:false }),
    runs: structuredClone(SEED.runs ?? []),
    checkins: structuredClone(SEED.checkins ?? []),
    routes: [], done: {}, refDays: [], decisions: {}, redClearedAt: null,
  };
}
// Older docs and docs pulled from another device may be missing newer keys.
function normalize(d){
  return { v:1, runs:[], checkins:[], routes:[], done:{}, refDays:[], decisions:{}, redClearedAt:null, body:{}, ...d,
    profile: { weights:[], comps:[], ...(d.profile ?? freshDoc().profile) } };
}
let doc;
// Sync bookkeeping writes through here so it never looks like an edit and
// schedules a push of its own.
async function saveLocal(){
  if (!storageOk) return;
  try { await idb.put('doc', 'main', doc); } catch { storageOk = false; toast('Couldn’t save — this browser is blocking storage'); }
}
async function save(){ await saveLocal(); syncTouch(); }
async function getSamples(id){
  if (memSamples.has(id)) return memSamples.get(id);
  let s = null;
  try { s = await idb.get('samples', id); } catch {}
  if (!s && signedIn()){
    s = await pullSamples(id).catch(() => null);
    if (s) try { await idb.put('samples', id, s); } catch {}
  }
  if (s) memSamples.set(id, s);
  return s;
}
async function putSamples(id, s){
  memSamples.set(id, s);
  try { await idb.put('samples', id, s); } catch { storageOk = false; }
  if (signedIn()){ addUnsent([id]); flushSamples(); }
}

/* ── Sync: optional login + Supabase copy ────────────────────────────
   Fill in url + key and the app gains an emailed-link login and a synced
   copy of each person's runs. Leave them empty and nothing changes — no
   network, no login, IndexedDB only.

   The publishable key is meant to be public; row-level security is what
   keeps each person's rows theirs. Use a Supabase project of its own.

   Two tables: stride_docs is one row per person (everything but the
   second-by-second samples), written compare-and-set on `version` so a
   stale device fails instead of overwriting. stride_samples is one
   write-once row per run, fetched only when a run page needs it. */
const SUPABASE = { url:'https://fqtmbqwfcgblkaqkhjkq.supabase.co', key:'sb_publishable_E4gLoI0nEo7obY-eJE_g_A_3K1oHYtb' };

const syncOn = () => !!(SUPABASE.url && SUPABASE.key);
const SESSKEY = 'stride.session', UNSENTKEY = 'stride.unsent';
let SESSION = null, pushTimer = null;
const SYNC = { status:'off', msg:'' };

function loadSession(){ try { SESSION = JSON.parse(localStorage.getItem(SESSKEY)) || null; } catch { SESSION = null; } }
function saveSession(){ try { SESSION ? localStorage.setItem(SESSKEY, JSON.stringify(SESSION)) : localStorage.removeItem(SESSKEY); } catch {} }
function setSession(d){
  SESSION = { access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at: Date.now() + (d.expires_in || 3600) * 1000,
    email: d.user?.email || SESSION?.email || '', user_id: d.user?.id || SESSION?.user_id || '' };
  saveSession();
}
const base = () => SUPABASE.url.replace(/\/+$/, '');
function sb(path, opts = {}, auth = true){
  const h = { apikey:SUPABASE.key, 'Content-Type':'application/json', ...(opts.headers || {}) };
  if (auth && SESSION) h.Authorization = 'Bearer ' + SESSION.access_token;
  return fetch(base() + path, { ...opts, headers:h });
}
async function ensureToken(){
  if (!SESSION) return false;
  if (Date.now() < SESSION.expires_at - 60000) return true;
  const r = await sb('/auth/v1/token?grant_type=refresh_token',
    { method:'POST', body:JSON.stringify({ refresh_token:SESSION.refresh_token }) }, false);
  if (!r.ok){ SESSION = null; saveSession(); return false; }
  setSession(await r.json()); return true;
}
// The emailed link lands with the tokens in the URL fragment — which this app
// also uses for routing — so it has to be read and cleared before first render.
function consumeAuthHash(){

  if (!/access_token=|error_description=/.test(h)) return null;
  const p = new URLSearchParams(h.slice(1));
  history.replaceState(null, '', location.pathname + location.search + '#today');
  if (p.get('error_description')) return { error: p.get('error_code') === 'otp_expired' ? 'That sign-in link has expired or was already used — send a new one' : p.get('error_description') };
  SESSION = { access_token:p.get('access_token'), refresh_token:p.get('refresh_token') || '',
    expires_at: Date.now() + parseInt(p.get('expires_in') || '3600', 10) * 1000, email:'', user_id:'' };

}

/* the doc row */
const blobOf = () => { const { sync, ...rest } = doc; return rest; };
const runCount = o => o?.runs?.length ?? 0;
const meta = (row, dirty) => ({ user_id:SESSION.user_id, email:SESSION.email, version:row?.version ?? 0, at:row?.updated_at ?? null, dirty });
// jsonb doesn't keep key order, so compare with keys sorted.
function stableStringify(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}
async function pullRow(){
  if (!await ensureToken()) return null;
  const r = await sb(`/rest/v1/stride_docs?user_id=eq.${SESSION.user_id}&select=data,version,updated_at`);
  if (!r.ok) throw new Error('pull failed (' + r.status + ')');
  return (await r.json())[0] || null;
}
async function markSynced(row){ doc.sync = meta(row, false); await saveLocal(); setSync('ok'); flushSamples(); }
async function adoptRemote(row){
  doc = normalize(row.data); doc.sync = meta(row, false);
  await saveLocal(); render(); setSync('ok');
}
async function pushRow(){
  clearTimeout(pushTimer); pushTimer = null;
  if (!signedIn()) return;
  if (!await ensureToken()){ setSync('signedout', 'Session expired — sign in again'); return; }
  const v = doc.sync?.version || 0;
  const payload = { user_id:SESSION.user_id, data:blobOf(), version:v + 1, updated_at:new Date().toISOString() };
  setSync('busy', 'Saving…');
  let r;
  if (v === 0){
    r = await sb('/rest/v1/stride_docs', { method:'POST', body:JSON.stringify(payload), headers:{ Prefer:'return=representation' } });
    if (r.status === 409){ await reconcile(); return; }
  } else {
    // compare-and-set: if another device wrote since, this matches nothing
    r = await sb(`/rest/v1/stride_docs?user_id=eq.${SESSION.user_id}&version=eq.${v}`,
      { method:'PATCH', body:JSON.stringify(payload), headers:{ Prefer:'return=representation' } });
  }
  if (!r.ok){ setSync('error', 'Couldn’t save — ' + r.status); return; }
  const rows = await r.json();
  if (!rows.length){ await reconcile(); return; }
  await markSynced(rows[0]);
}
// The row moved under us. Let the person choose; never guess.
async function reconcile(){
  const row = await pullRow();
  if (!row){ doc.sync = meta(null, true); await saveLocal(); return pushRow(); }
  if (!runCount(row.data) && runCount(doc)){ doc.sync = meta(row, true); await saveLocal(); return pushRow(); }
  if (stableStringify(blobOf()) === stableStringify(row.data)){ await markSynced(row); return; }
  setSync('conflict', 'Another device saved first');
  choose('Changed on another device',
    `Here: ${runCount(doc)} runs, last synced ${timeAgo(doc.sync?.at)}. There: ${runCount(row.data)} runs, saved ${timeAgo(row.updated_at)}. Keeping one replaces the other.`,
    ['Keep what’s here', async () => { doc.sync = meta(row, true); await saveLocal(); pushRow(); }],
    ['Take the other one', async () => { await adoptRemote(row); toast('Pulled from the other device'); }]);
}

    const uploadAll = async () => { addUnsent(doc.runs.filter(r => r.hasSamples).map(r => r.id)); await pushRow(); toast(`Uploaded ${runCount(doc)} runs to your account`); };
    if (!row){
      // signing in on an empty browser must not publish that emptiness
      doc.sync = meta(null, !!here); await saveLocal();
      if (here) await uploadAll(); else setSync('ok');
      return;
    }
    if (!there && !here){ await markSynced(row); return; }
    if (!there){ doc.sync = meta(row, true); await saveLocal(); await uploadAll(); return; }
    if (!here){ await adoptRemote(row); toast(`Loaded ${runCount(doc)} runs`); return; }
    // The version counter says what happened; content breaks the tie only the
    // first time this browser meets the row.
    const known = doc.sync?.version || 0, dirty = !!doc.sync?.dirty;
    if (known === row.version){
      if (!dirty){ await markSynced(row); return; }
      doc.sync = meta(row, true); await saveLocal(); await pushRow(); return;
    }
    if (known && known < row.version && !dirty){ await adoptRemote(row); toast('Pulled changes from another device'); return; }
    if (stableStringify(blobOf()) === stableStringify(row.data)){ await markSynced(row); return; }
    setSync('conflict', 'Two versions');
    choose('There are already runs on this account',
      `Here: ${here} runs. There: ${there} runs, saved ${timeAgo(row.updated_at)}. Keeping one replaces the other.`,
      ['Keep what’s here', async () => { doc.sync = meta(row, true); await saveLocal(); await uploadAll(); }],
      ['Take the account’s', async () => { await adoptRemote(row); toast('Loaded from your account'); }]);
  } catch (e){ setSync('error', e.message); }
}
// Pick up another device's changes when this tab comes back into view.
async function refreshFromRemote(){
  if (!signedIn() || doc.sync?.dirty || SYNC.status === 'conflict') return;
  try {
    const row = await pullRow();
    if (row && row.version > (doc.sync?.version || 0)) await adoptRemote(row);
  } catch {}
}

/* the samples rows — write-once per run, retried until they land */
function getUnsent(){ try { return JSON.parse(localStorage.getItem(UNSENTKEY)) || []; } catch { return []; } }
function setUnsent(a){ try { localStorage.setItem(UNSENTKEY, JSON.stringify([...new Set(a)])); } catch {} }
const addUnsent = ids => setUnsent([...getUnsent(), ...ids]);
let flushing = false;
async function flushSamples(){
  if (flushing || !signedIn()) return;
  flushing = true;
  try {
    for (const id of getUnsent()){
      if (!runById(id)){ setUnsent(getUnsent().filter(x => x !== id)); continue; }
      let s = memSamples.get(id);
      if (!s) try { s = await idb.get('samples', id); } catch {}
      if (s){
        if (!await ensureToken()) break;
        const r = await sb('/rest/v1/stride_samples?on_conflict=user_id,run_id', { method:'POST',
          body:JSON.stringify({ user_id:SESSION.user_id, run_id:id, data:s }),
          headers:{ Prefer:'resolution=merge-duplicates,return=minimal' } });
        if (!r.ok) break;
      }
      setUnsent(getUnsent().filter(x => x !== id));
    }
  } catch {} finally { flushing = false; }
}
async function pullSamples(id){
  if (!await ensureToken()) return null;
  const r = await sb(`/rest/v1/stride_samples?user_id=eq.${SESSION.user_id}&run_id=eq.${encodeURIComponent(id)}&select=data`);
  return r.ok ? (await r.json())[0]?.data ?? null : null;
}
async function dropSamples(id){
  if (!signedIn() || !await ensureToken()) return;
  const q = id ? `&run_id=eq.${encodeURIComponent(id)}` : '';
  await sb(`/rest/v1/stride_samples?user_id=eq.${SESSION.user_id}${q}`, { method:'DELETE' }).catch(() => {});
}

/* plumbing */
function setSync(status, msg = ''){ SYNC.status = status; SYNC.msg = msg; paintSync(); }
function syncTouch(){
  if (!signedIn()) return;
  doc.sync = { ...(doc.sync || meta(null, true)), dirty:true };
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => pushRow().catch(e => setSync('error', e.message)), 2500);
}
function timeAgo(iso){
  if (!iso) return 'never';
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' hr ago' : Math.round(s / 86400) + ' d ago';
}
function syncLine(){
  if (SYNC.msg) return SYNC.msg;
  return doc.sync?.at ? 'Synced ' + timeAgo(doc.sync.at) : 'Not synced yet';
}
function paintSync(){
  const box = $('#syncbox'); if (!box) return;
  if (!syncOn()){ box.innerHTML = ''; return; }
  if (!SESSION){ box.innerHTML = `<button class="sync-pill signin" data-action="goto-signin">Sign in</button>`; return; }
  const short = syncLine().replace(/ ago$/, '').replace(' min', 'm').replace(' hr', 'h').replace(' d', 'd');
  box.innerHTML = `<a class="sync-pill sync-line sync-${SYNC.status}" href="#setup" title="${esc(SESSION.email)} · ${esc(syncLine())}"><span class="dot"></span><span class="sync-txt">${esc(short)}</span></a>`;
  document.querySelectorAll('[data-sync-line]').forEach(e => { e.className = `sync-line sync-${SYNC.status}`; e.innerHTML = `<span class="dot"></span>${esc(syncLine())}`; });
}

/* two-way choice, for sync conflicts */
function choose(title, body, [aLabel, aFn], [bLabel, bFn]){
  const d = $('#choose');
  d.innerHTML = `<h2 class="display">${esc(title)}</h2><p>${esc(body)}</p>

/* ── Derived facts ───────────────────────────────────────────────── */
const sortedRuns = () => [...doc.runs].sort((a, b) => a.start < b.start ? -1 : 1);
const runsOn = d => doc.runs.filter(r => r.date === d);
const runById = id => doc.runs.find(r => r.id === id);
const isRef = d => doc.refDays.includes(d);
const testRoute = () => doc.routes.find(r => r.isTest);
const isTest = r => r.testOverride ?? (!!r.routeId && !!doc.routes.find(x => x.id === r.routeId)?.isTest);
const isClean = r => isTest(r) && (r.idleSec ?? 0) <= IDLE_TOLERANCE;
const hrMetric = r => r.jogHr ?? r.avgHr;
// Weight per day: a manual weigh-in beats Garmin's number for the same day.
function weightSeries(){
  const m = {};
  for (const [d, v] of Object.entries(doc.body ?? {})) if (v.weight != null) m[d] = { date:d, v:v.weight, src:'garmin' };
  for (const w of doc.profile.weights) m[w.date] = { date:w.date, v:w.lbs, src:'manual', note:w.note };
  return Object.values(m).sort((a, b) => a.date < b.date ? -1 : 1);
}
const bodySeries = k => Object.entries(doc.body ?? {}).filter(([, v]) => v[k] != null).map(([date, v]) => ({ date, v:v[k] })).sort((a, b) => a.date < b.date ? -1 : 1);
const currentWeight = () => weightSeries().at(-1)?.v ?? null;
const avgOf = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
// Mean of the series over the n days ending at `end` (inclusive).
const windowAvg = (pts, n, end = todayYmd()) => avgOf(pts.filter(p => p.date <= end && diffDays(p.date, end) < n).map(p => p.v));

function exclusionReasons(r){
  const why = [];
  if (!isTest(r)) why.push(r.gainFt > 50 ? `not the test route (${r.gainFt} ft gain)` : 'not the test route');
  if ((r.idleSec ?? 0) > IDLE_TOLERANCE) why.push(`idle ${fmtDur(r.idleSec)} — timer left running`);
  return why;
}

// Protocol audit: what, if anything, contaminates this run's numbers.
function flagsFor(r){
  const f = [], p = doc.profile;
  if ((r.idleSec ?? 0) > IDLE_TOLERANCE) f.push(['warn', `Idle ${fmtDur(r.idleSec)}`, 'Timer left running while standing — drags average pace and HR']);
  if (!isTest(r)) f.push(['wait', 'Not the test route', r.gainFt != null ? `${r.gainFt} ft of gain — kept out of the HR trend` : 'Kept out of the HR trend']);
  if (r.recoveryHr == null) f.push(['wait', 'No recovery HR', 'Stop the timer, stand still 2 min, then save. Or type it in from Garmin Connect']);
  if (r.anaerobicTE != null && r.anaerobicTE > 1.0) f.push(['crit', `Anaerobic TE ${r.anaerobicTE.toFixed(1)}`, 'Too hard for an easy run — should be near 0.0']);
  if (r.maxHr != null && r.maxHr > p.guardHr) f.push(['warn', `Max HR ${r.maxHr}`, `Over the ~${p.guardHr} guardrail — take a walk break when HR passes ${p.zones.mod}`]);
  if (r.aboveLtSec != null && r.aboveLtSec > 30) f.push(['warn', `${fmtDur(r.aboveLtSec)} above ${p.lthr}`, 'Should be near zero on easy runs']);
  const w = currentWeight();
  if (r.weightLbs != null && w != null && Math.abs(r.weightLbs - w) >= 3) f.push(['wait', `Computed at ${r.weightLbs} lbs`, 'Power and calories are a few percent off vs. your current weight']);
  if (r.source === 'manual') f.push(['wait', 'Entered from notes', 'Upload the FIT file for jogging-only HR, zones and time above threshold']);
  return f;
}

/* ── Check-ins and the red flag ──────────────────────────────────── */
const SORE = { none:'Nothing', calves:'Calves', hip:'Hip', knee:'Knee', red:'Shin / Achilles / one calf much worse' };
function redFlagActive(){
  const reds = doc.checkins.filter(c => c.value === 'red').map(c => c.at).sort();
  return reds.length > 0 && (!doc.redClearedAt || reds.at(-1) > doc.redClearedAt);
}
function pendingCheckin(){
  // Only the latest run matters — a newer run resets the soreness clock.
  const r = sortedRuns().reverse().find(x => hoursSince(x) >= 0);
  if (!r) return null;
  const h = hoursSince(r);
  const has = st => doc.checkins.some(c => c.runId === r.id && c.stage === st);
  if (h >= 36 && h < 72 && !has('48')) return { run:r, stage:'48', hours:h };
  if (h >= 10 && h < 36 && !has('24')) return { run:r, stage:'24', hours:h };
  return null;
}

/* ── Marathon: generated backward from race day ─────────────────────
   Weeks run from the plan start to race week. The long run climbs ~1.5–2 mi a
   week from the longest run you can do now, with an easier week every fourth
   week, peaks at no more than 20, then tapers for 2–3 weeks. Because race day
   can't move, a missed week isn't repeated: the next long run is instead
   capped at your longest recent long run + 2 mi (see longCap). */
const LONG_STEP_MAX = 2, PEAK_MAX = 20;
// Run days as offsets from the long-run day; race week counts back from race day.
const MARA_DAYS = { 3:[-4, -2, 0], 4:[-4, -3, -1, 0], 5:[-5, -4, -3, -1, 0] };
const RACE_WEEK_DAYS = [-5, -3, -1, 0];
const half = v => Math.round(v * 2) / 2;
const clampMi = (v, lo, hi) => half(Math.min(hi, Math.max(lo, v)));
function marathonWeeks(race = doc.race, start = doc.planStart){
  if (!race?.date || !start) return [];
  const N = Math.max(1, diffDays(weekStart(start), weekStart(race.date)) / 7 + 1);
  const taper = N >= 12 ? 3 : N >= 7 ? 2 : 1, B = N - taper, per = race.perWeek ?? 4;
  const longs = [];
  let base = Math.max(4, race.longest || 4);
  for (let i = 1; i <= B; i++){
    if (B >= 6 && i % 4 === 0 && i < B - 1) longs.push({ mi:half(base * .75), cut:true });
    else { if (i > 1) base = Math.min(PEAK_MAX, base + (base < 10 ? 1.5 : LONG_STEP_MAX)); longs.push({ mi:half(base), cut:false }); }
  }
  const peak = Math.max(...longs.map(l => l.mi), race.longest || 4);
  const taperLongs = taper === 3 ? [.7, .5] : taper === 2 ? [.6] : [];
  const weeks = [];
  longs.forEach((l, i) => {
    const phase = l.cut ? 'Recovery' : i >= B - 2 ? 'Peak' : i < B / 3 ? 'Base' : 'Build';
    weeks.push(maraWeek(phase, l.mi, per, !l.cut && (phase === 'Build' || phase === 'Peak')));
  });
  taperLongs.forEach(f => weeks.push(maraWeek('Taper', half(peak * f), per, true, .7)));
  const easy = clampMi(peak * .2, 3, 5);
  weeks.push({ phase:'Race week', race:true, longMi:26.2,
    runs:[ { mi:easy, title:`${easy} mi easy`, detail:'Then 4 × 20 sec strides. Legs should feel springy, not tired' },
           { mi:4, title:'4 mi with 2 at marathon effort', detail:'A last reminder of goal pace — no faster' },
           { mi:2, title:'2 mi shakeout', detail:'Very easy. Lay out your kit and fuel tonight' },
           { mi:26.2, long:true, title:'Race day', detail:'Start slower than you want to. Fuel early and on schedule. Walk the aid stations if it helps' } ] });
  return weeks.map((w, i) => {
    const miles = half(w.runs.reduce((a, r) => a + r.mi, 0));
    return { ...w, week:i + 1, miles,
      session: w.race ? 'Race' : `${w.longMi} mi long run`,
      detail: w.race ? `Race day ${fmtDateLong(race.date)}` : `${w.runs.length} runs · ~${miles} mi this week`,
      add: w.phase === 'Recovery' ? 'An easier week so the next block lands' : w.phase === 'Taper' ? 'Less volume, same rhythm — trust it' : w.race ? 'Rest the day after, then walk' : w.runs.find(r => r.mp)?.title ?? '' };
  });
}
function maraWeek(phase, longMi, per, quality, scale = 1){
  const easy = clampMi(longMi * .35 * scale, 3, 7), med = clampMi(longMi * .5 * scale, 4, 10), mp = clampMi(longMi * .2, 2, 6);
  const runs = [];
  const E = (mi, extra = '') => ({ mi, title:`${mi} mi easy`, detail:`Conversational pace${extra}` });
  const M = quality ? { mi:med, mp:true, title:`${med} mi with the last ${mp} at marathon effort`, detail:'Easy for the rest. Marathon effort is comfortably hard — you could still talk in short sentences' }
                    : { mi:med, title:`${med} mi easy`, detail:'The midweek medium run. Easy all the way' };
  if (per === 3) runs.push(E(easy, '. Then 4 × 20 sec strides'), M);
  if (per === 4) runs.push(E(easy), M, E(3, '. Short and very easy — it’s the day before the long run'));
  if (per === 5) runs.push(E(easy), M, E(easy, '. Then 4 × 20 sec strides'), E(3, '. Short and very easy — it’s the day before the long run'));
  runs.push({ mi:longMi, long:true, title:`${longMi} mi long run`,
    detail: longMi >= 16 ? 'Slower than marathon pace the whole way. Practise race fueling: something every 30–45 min after the first hour'
      : longMi >= 12 ? 'Easy pace. Take fuel after the first hour — find what your stomach likes now, not on race day'
      : 'Easy pace, the whole way. Walk breaks are fine' });
  return { phase, longMi, runs };
}
// The adaptive part: never prescribe more than 2 mi beyond what you've actually run lately.
function longCap(beforeDate){
  const recent = doc.runs.filter(r => r.date < beforeDate && diffDays(r.date, beforeDate) <= 21).map(r => r.distMi ?? 0);
  const setupLongest = doc.race?.setAt && diffDays(doc.race.setAt, beforeDate) <= 21 ? doc.race.longest || 0 : 0;
  return half(Math.max(4, setupLongest, ...recent) + LONG_STEP_MAX);
}
const isMarathon = () => doc.planId === 'marathon';
function maraRunDates(weekIdx){
  const w = marathonWeeks()[weekIdx]; if (!w) return [];
  if (w.race) return RACE_WEEK_DAYS.slice(-w.runs.length).map(o => addDays(doc.race.date, o));
  const longDate = addDays(addDays(weekStart(doc.planStart), weekIdx * 7), ((doc.race.longDay ?? 6) + 6) % 7);
  return MARA_DAYS[w.runs.length].map(o => addDays(longDate, o));
}
function marathonSchedule(from, n){
  const out = [], red = redFlagActive(), weeks = marathonWeeks();
  for (let i = 0; i < n; i++){
    const d = addDays(from, i), wi = diffDays(weekStart(doc.planStart), weekStart(d)) / 7;
    let kind = 'rest', note = '', slot = null;
    if (runsOn(d).length) kind = 'done';
    else if (isRef(d)) kind = 'ref';
    else if (wi < 0 || wi >= weeks.length) note = wi < 0 ? 'Plan starts Monday' : 'After the race';
    else if (red) note = 'Paused';
    else { const k = maraRunDates(wi).indexOf(d); if (k >= 0){ kind = 'run'; slot = k + 1; } }
    out.push({ date:d, kind, note, slot });
  }
  return out;
}
function marathonSession(pw, slot, date){
  const w = marathonWeeks()[pw - 1]; if (!w) return { title:'Rest', detail:'', extra:'' };
  const r = w.runs[slot - 1] ?? w.runs.at(-1);
  if (r.long && !w.race && date){
    const cap = longCap(weekStart(date));
    if (r.mi > cap) return { title:`${cap} mi long run`, detail:r.detail, extra:`Planned ${r.mi} mi — held at ${cap} because your longest run in the last three weeks was ${half(cap - LONG_STEP_MAX)} mi. Jumping more than 2 mi is how marathon builds break`, mi:cap };
  }
  return { title:r.title, detail:r.detail, extra:'', mi:r.mi };
}
function sorenessItem(runs){
  const cks = doc.checkins.filter(c => runs.some(r => r.id === c.runId));
  const red = cks.some(c => c.value === 'red');
  const sore48 = cks.filter(c => c.stage === '48' && c.value !== 'none');
  const last = runs.at(-1);
  const pending48 = !!last && !doc.checkins.some(c => c.runId === last.id && c.stage === '48') && hoursSince(last) < 72;
  let item;
  if (red) item = ['crit', 'No red-flag symptoms', 'Hard stop logged — plan paused'];
  else if (sore48.length) item = ['crit', 'No soreness past 48 hrs', `${SORE[sore48[0].value]} still sore at 48 hrs`];
  else if (pending48){
    const sore24 = cks.find(c => c.runId === last.id && c.stage === '24' && c.value !== 'none');
    const due = new Date(Date.parse(last.start) + 48 * 36e5);
    item = ['wait', 'No soreness past 48 hrs', `${sore24 ? SORE[sore24.value] + ' sore at ~24 hrs — normal. ' : ''}48-hr check ${DOW_LONG[due.getDay()]} ${due.getHours() >= 17 ? 'night' : ''}`.trim()];
  }
  else item = ['good', 'No soreness past 48 hrs', runs.length ? 'Clear' : '—'];
  return { item, red, sore48, pending48 };
}
function marathonGate(w){
  const pl = marathonWeeks()[w.planWeek - 1], runs = w.runs, n = runs.length, items = [];
  if (!pl) return { items:[['wait', 'Outside the plan', '—']], auto:'advance', verdict:['wait', 'No plan week.', ''] };
  const target = pl.race ? null : marathonSession(w.planWeek, pl.runs.length, w.start).mi ?? pl.longMi;
  const longest = n ? Math.max(...runs.map(r => r.distMi ?? 0)) : 0;
  const longDone = target != null && longest >= target * .8;
  const miles = half(runs.reduce((a, r) => a + (r.distMi ?? 0), 0));
  if (!pl.race) items.push([longDone ? 'good' : w.current ? 'wait' : 'warn', `Long run · ${target} mi`, longest ? `Longest this week ${fmtMi(longest)} mi` : 'Not yet']);
  items.push([n >= pl.runs.length - 1 ? 'good' : w.current ? 'wait' : 'warn', `${pl.runs.length} runs`, n ? `${n} so far · ${miles} of ~${pl.miles} mi` : 'None yet']);
  const so = sorenessItem(runs);
  items.push(so.item);
  let verdict;
  if (so.red) verdict = ['crit', 'Paused.', 'Resume once you’re cleared — the next long run will be held at what you’ve recently run.'];
  else if (so.sore48.length) verdict = ['warn', 'Ease off.', 'Soreness lasted past 48 hours. Make next week’s runs easy and skip any marathon-effort work.'];
  else if (pl.race) verdict = ['wait', 'Race week.', 'Rest, fuel, sleep. The work is done.'];
  else if (longDone && n >= pl.runs.length - 1) verdict = ['good', 'On track.', 'Next week’s long run steps up as planned.'];
  else if (w.current) verdict = ['wait', 'In progress.', longDone ? `${pl.runs.length - 1 - n} more run${pl.runs.length - 1 - n === 1 ? '' : 's'} this week.` : 'The long run is the one that matters most.'];
  else verdict = ['warn', 'Short week.', 'Next week’s long run is held near your longest recent run rather than jumping ahead.'];
  return { items, auto:'advance', verdict };
}

/* ── Plan state: walk calendar weeks from the start, gate each one ─ */
function gateFor(w){
  const runs = w.runs, n = runs.length, p = doc.profile, items = [];
  items.push([n >= 3 ? 'good' : w.current ? 'wait' : 'crit', '3 runs completed',
    n ? `${n} so far · ${runs.map(r => DOW[parseYmd(r.date).getDay()]).join(', ')}` : 'None yet']);

  const { item, red, sore48, pending48 } = sorenessItem(runs);
  items.push(item);

  const over = runs.filter(r => r.maxHr > p.guardHr);
  const peak = n ? Math.max(...runs.map(r => r.maxHr ?? 0)) : null;
  items.push([over.length ? 'warn' : n ? (peak === p.guardHr ? 'warn' : 'good') : 'wait', `Max HR under ~${p.guardHr}`,
    over.length ? `${over.map(r => `${r.maxHr} ${DOW[parseYmd(r.date).getDay()]}`).join(', ')} — walk when HR passes ${p.zones.mod}`
      : n ? (peak === p.guardHr ? `Peaked at ${peak} — right on the line` : `Peaked at ${peak}`) : '—']);

  const withS = runs.filter(r => r.aboveLtSec != null);
  if (!withS.length) items.push(['wait', `Little to no time above ${p.lthr}`, n ? 'Needs FIT samples — upload these runs' : '—']);
  else {
    const tot = withS.reduce((s, r) => s + r.aboveLtSec, 0);
    items.push([tot > 60 ? 'warn' : 'good', `Little to no time above ${p.lthr}`,
      `${fmtDur(tot)} total${withS.length < n ? ` · ${n - withS.length} run${n - withS.length > 1 ? 's' : ''} without samples` : ''}`]);
  }

  let auto, verdict;
  if (red){ auto = 'repeat'; verdict = ['crit', 'Paused.', 'Resume once you’re cleared.']; }
  else if (n === 0 && !w.current){ auto = 'back'; verdict = ['crit', 'Missed week.', 'Go back one week — don’t jump ahead.']; }
  else if (sore48.length){ auto = 'repeat'; verdict = ['warn', 'Repeat this week.', 'Soreness lasted past 48 hours.']; }
  else if (n < 3){ auto = 'repeat'; verdict = w.current ? ['wait', 'In progress.', `${3 - n} more run${3 - n > 1 ? 's' : ''} this week.`] : ['warn', 'Repeat this week.', 'Fewer than 3 runs.']; }
  else if (pending48){ auto = 'advance'; verdict = ['wait', 'Almost there.', 'Advances if the 48-hour check comes back clear.']; }
  else { auto = 'advance'; verdict = ['good', 'On track to advance.', w.planWeek === 1 ? 'Weeks 1–2 are the same workload, so there’s no jump either way.' : 'Next week’s targets unlock Monday.']; }
  return { items, auto, verdict };
}

function planState(){
  const cur = weekStart(todayYmd());
  const weeks = [];
  let ws = weekStart(doc.planStart), pw = 1;
  while (ws <= cur){
    const we = addDays(ws, 6);
    const w = { start:ws, end:we, planWeek:pw, current: ws === cur,
      runs: sortedRuns().filter(r => r.date >= ws && r.date <= we) };
    w.gate = isMarathon() ? marathonGate(w) : gateFor(w);
    if (isMarathon()) pw++;   // race day doesn't move, so weeks follow the calendar
    else if (!w.current){
      const ov = doc.decisions[ws];
      w.decision = ov || w.gate.auto; w.overridden = !!ov;
      pw = w.decision === 'advance' ? Math.min(planLen() + 1, pw + 1) : w.decision === 'back' ? Math.max(1, pw - 1) : pw;
    }
    weeks.push(w);
    ws = addDays(ws, 7);
  }
  if (isMarathon()) weeks.forEach(w => { w.decision = 'advance'; });
  return weeks;
}
const planWeekObj = pw => activePlan().weeks[Math.min(pw, planLen()) - 1];

// Next N days: rest between runs, three a week, rest before a sport day.
function schedule(from, n){
  if (isMarathon()) return marathonSchedule(from, n);
  const out = [], red = redFlagActive(), counts = {};
  const count = ws => counts[ws] ??= doc.runs.filter(r => weekStart(r.date) === ws).length;
  for (let i = 0; i < n; i++){
    const d = addDays(from, i), ws = weekStart(d);
    count(ws);
    const prevD = addDays(d, -1);
    const prev = i ? out[i-1] : { kind: runsOn(prevD).length ? 'done' : isRef(prevD) ? 'ref' : 'rest' };
    let kind, note = '';
    if (runsOn(d).length) kind = 'done';
    else if (isRef(d)) kind = 'ref';
    else if (red){ kind = 'rest'; note = 'Paused'; }
    else if (prev.kind === 'done' || prev.kind === 'run'){ kind = 'rest'; note = 'After a run'; }
    else if (counts[ws] >= 3){ kind = 'rest'; note = 'Week’s runs are in'; }
    else if (isRef(addDays(d, 1))){ kind = 'rest'; note = 'Sport tomorrow'; }
    else { kind = 'run'; counts[ws]++; if (prev.kind === 'ref') note = 'Skip if legs are toast'; }
    out.push({ date:d, kind, note, slot: kind === 'run' ? counts[ws] : null });
  }
  return out;
}
function sessionFor(pw, slot, date){
  if (isMarathon()) return marathonSession(pw, slot, date);
  const p = planWeekObj(pw);
  if (p.third && slot === 3) return { title:p.third[0], detail:p.third[1], extra:'' };
  return { title:p.session, detail:p.detail, extra: slot && p.strides && slot <= p.strides ? 'Then 4 × 20 sec strides at ~80% — a full minute of walking between' : '' };
}
